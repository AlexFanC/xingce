工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"废寝忘食","level":"B","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"顾不上睡觉，忘记了吃饭。形容对某事专心致志","example":"对于如此繁杂的调试工作，调试团队这半年多来几乎废寝忘食地投入。","pdfpage":102,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“专注做事，顾不上饮食休息”","myexample":"为了弄清一项数学证明，他经常忘了吃饭和睡觉，研究起来废寝忘食。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"披星戴月","level":"B","group":"第18组","category":"工作学习状态","sub":"辛苦奔波","meaning":"身披星光，头顶月色。形容早出晚归或连夜赶路。也作“戴月披星”","example":"北京建工养护集团八公路处工程部部长温冬梅介绍，洪水退后，抢修队伍披星戴月施工，人歇设备不歇。","pdfpage":107,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“早出晚归、披星戴月奔波”","myexample":"地质队员每天凌晨出发、深夜归营，长期披星戴月地奔走山野。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"挖空心思","level":"B","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"想方设法，费尽心机。（多含贬义）","example":"为了持续制造爽感、快感，一些微短剧创作者挖空心思，甚至无所不用其极——有的鼓吹炫富拜金，大肆描写不正当的婚恋观；有的宣扬以暴制暴，渲染血腥暴力；有的故意贩卖焦虑，挑起年龄对立、性别对立、地域歧视。","pdfpage":103,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“费尽心机，通常用于贬义”","myexample":"为了制造虚假的销量数据，他不断设计复杂手段欺骗消费者，挖空心思地钻制度空子。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"摩顶放踵","level":"B","group":"第18组","category":"工作学习状态","sub":"辛苦奔波","meaning":"意思是从头顶到脚跟都擦伤了；形容不辞劳苦，不顾身体","example":"如今，这位94岁的老人仍然坚持给每年新入校的博士生上课，并亲自带博士生。从1984年招收第一位博士生，至今40年，摩顶放踵培养人才，从未间断。","pdfpage":108,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“不辞辛苦到不顾身体的程度”","myexample":"乡村医生多年来跋山涉水、不顾劳累奔波于偏远村落，真是摩顶放踵。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"栉风沐雨","level":"B","group":"第18组","category":"工作学习状态","sub":"辛苦奔波","meaning":"栉：梳头。沐：洗头。形容人辛苦地四处奔波","example":"栉风沐雨、砥砺奋进。前进的道路少了磨难反倒是少了亮丽的风景，唯有经历磨难，才能不畏艰险。","pdfpage":106,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“风吹雨淋、辛苦奔波”","myexample":"那些测绘工作者顶风冒雨奔走在野外，为基础调查付出多年艰辛，堪称栉风沐雨。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"皓首穷经","level":"B","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"皓：白。穷经：彻底钻研经书。钻研经籍直到人老头白。也作“白首穷经”。（也可形容长期钻研）","example":"古人常说，稚年入学，皓首穷经，书好像一辈子读不完似的。","pdfpage":103,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"尽心钻研学习","myexample":"","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"目不窥园","level":"B","group":"第18组","category":"工作学习状态","sub":"抓紧时间、勤奋","meaning":"窥：看。形容学习专心致志，十分刻苦","example":"他搞这些研究已经很久了，目不窥园，终于成功了。","pdfpage":106,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"抓紧时间、勤奋","myexample":"","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"胼手胝足","level":"B","group":"第18组","category":"工作学习状态","sub":"辛苦奔波","meaning":"意思是手脚生茧。形容劳动十分辛勤","example":"哺育万物的土地，胼手胝足的农民，在习近平总书记心中有着沉甸甸的分量：“我们党成立以后就一直把依靠农民、为亿万农民谋幸福作为重要使命。”","pdfpage":108,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"辛苦奔波","myexample":"","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"苦心孤诣","level":"B","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"苦心：用尽心思。诣：（学业、技能等）所达到的程度。孤诣：别人达不到的程度。指尽心竭力钻研，达到了别人所达不到的地步。也指为了达到目的而费尽心思","example":"要改良社会，不得不这样，别人哪里会懂我们的苦心孤诣。","pdfpage":102,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"尽心钻研学习","myexample":"","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"风餐露宿","level":"B","group":"第18组","category":"工作学习状态","sub":"辛苦奔波","meaning":"在风中吃饭，在露天住宿。形容旅途中的辛苦劳累","example":"该团官兵担负国防通信光缆施工任务，常年身处荒漠戈壁、深山密林，部队分散流动，生活保障是个难题，官兵风餐露宿是常态。","pdfpage":107,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"辛苦奔波","myexample":"","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"以一持万","level":"B","group":"第19组","category":"正确做法","sub":"抓住问题关键","meaning":"用来形容抓住了关键的环节或因素，从而能够控制和影响整个局面。它强调的是在处理问题时识别并把握住核心部分的重要性，以此来驾驭复杂的情况或者广泛的领域","example":"改革，如秉轴持钧，以一持万。深入基层沉到一线，以实际调研筑牢工作基础，将成为各地公安机关下一步推动人员职能整合、业务工作融合、机制流程衔接的发力点。","pdfpage":113,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"抓住问题关键","myexample":"","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"当仁不让","level":"B","group":"第19组","category":"正确做法","sub":"勇于承担责任义务","meaning":"当：面对。仁：符合道义的事。后指遇到应该做的事，勇于承当，不推诿。（侧重情理上）","example":"为战而生、向战而行，汉中舰赓续着“英雄快艇”的红色血脉，急难险重任务面前打头阵、当先锋，以当仁不让、舍我其谁的担当，在转型备战中勇立时代潮头。","pdfpage":116,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"勇于承担责任义务","myexample":"","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"量力而行","level":"B","group":"第19组","category":"正确做法","sub":"踏实的做法","meaning":"意思是指根据自身的实际能力和条件来决定行动的范围，做事不要超过自己的能力范围，以免出现意外问题","example":"尽力而为也要量力而行，这就要求我们在推进共同富裕过程中必须具备充分考虑发展实际的科学精神。","pdfpage":114,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"踏实的做法","myexample":"","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"堂而皇之","level":"B","group":"第20组","category":"错误做法","sub":"不能这样做","meaning":"形容公然而毫不掩饰（多含贬义），强调表面上的正当性或气势宏大，可能隐含虚伪或掩饰","example":"象棋职业化改革不能总是停留在浅水区，任由商品交换原则堂而皇之遍布全行业、破坏起码的赛事公平。越是推进职业化改革，越需要筑牢制度防火墙，绝不能任由商品交换那一套搬到赛事竞技中来。","pdfpage":121,"usage":"多含批评，要注意错误做法造成的具体后果。","clue":"不能这样做","myexample":"","contrasts":[{"other":"于事无补","note":"同属“错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"明目张胆","level":"B","group":"第20组","category":"错误做法","sub":"不能这样做","meaning":"强调公开、毫无顾忌地做坏事，带有明显的贬义","example":"发言人指出，黎智英作为反中乱港事件主要策划者和煽动者，甘当美“以港遏华”马前卒，明目张胆勾结外部势力危害国家安全，铁证如山。","pdfpage":121,"usage":"多含批评，要注意错误做法造成的具体后果。","clue":"不能这样做","myexample":"","contrasts":[{"other":"于事无补","note":"同属“错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"作壁上观","level":"B","group":"第21组","category":"某些国家的错误做法","sub":"旁观、得利","meaning":"原指双方交战，自己站在壁垒上旁观。后多比喻站在一旁看着，不动手帮助","example":"维护国家安全没有“局外人”，国家安全面前你我都不能作壁上观。","pdfpage":128,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"旁观、得利","myexample":"","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"唯利是图","level":"B","group":"第21组","category":"某些国家的错误做法","sub":"不能这样做","meaning":"唯：只有；图：图谋，追求。只要有利可图，什么事都干","example":"“以义取利，不唯利是图”是其中一个重要方面金融行业要树立正确的经营观，把“以义取利，不唯利是图”的实践要求真正落到实处，坚持在…","pdfpage":126,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"不能这样做","myexample":"","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"穿凿附会","level":"B","group":"第21组","category":"某些国家的错误做法","sub":"不能这样做","meaning":"意思是把讲不通的或不相干的道理、事情硬扯在一起进行解释","example":"事实上，改革开放以来中国人道德出现滑坡的说法既不符合事实，也不符合辩证法，是以偏概全、穿凿附会的谬见。客观上说，互助友爱的风气是这个时代的主流，也是人们美好生活的重色。","pdfpage":126,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"不能这样做","myexample":"","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"置身事外","level":"B","group":"第21组","category":"某些国家的错误做法","sub":"旁观、得利","meaning":"置：安放。把自己放在事情之外。形容毫不关心","example":"我们生活在一个紧密相连的世界中，各国之间的利益和命运紧密相连。没有哪个国家可以独善其身，也没有哪个国家可以在国际事务中置身事外。","pdfpage":127,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"旁观、得利","myexample":"","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"国泰民安","level":"B","group":"第22组","category":"国家安定与动荡","sub":"社会安定","meaning":"泰：太平。国家太平，人民生活安定。形容社会安定，人民生活幸福","example":"剪纸、年画及炕围画等传统美术类非遗象征着幸福、吉祥和长寿，表达了民众祈盼万事如意、国泰民安、民族团结等美好愿望，展现了人民群众对幸福美满生活的向往与追求。","pdfpage":134,"usage":"描述社会秩序或居民处境，区分宏观安定与个体漂泊。","clue":"社会安定","myexample":"","contrasts":[{"other":"安居乐业","note":"同属“国家安定与动荡”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"安土重迁","level":"B","group":"第22组","category":"国家安定与动荡","sub":"国人习惯","meaning":"土：乡土；重：看得重，不轻易。安于本乡本土，不愿轻易迁移","example":"年轻一代在外成家立业、辛勤打拼，父辈祖辈安土重迁、难离故土，老年人没有和子女共同居住生活，是时下许多家庭的现实情况。","pdfpage":134,"usage":"描述社会秩序或居民处境，区分宏观安定与个体漂泊。","clue":"国人习惯","myexample":"","contrasts":[{"other":"安居乐业","note":"同属“国家安定与动荡”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"流离失所","level":"B","group":"第22组","category":"国家安定与动荡","sub":"生活不如意","meaning":"失所：失去安身之处。形容到处流浪，没有安身的地方。（多指因灾荒、战乱等导致的失去居所）","example":"强暴雨引发的洪水把也门部分地区房屋夷为平地，近2万户家庭流离失所，国际社会应行动起来进行紧急援助。","pdfpage":132,"usage":"描述社会秩序或居民处境，区分宏观安定与个体漂泊。","clue":"生活不如意","myexample":"","contrasts":[{"other":"安居乐业","note":"同属“国家安定与动荡”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"海晏河清","level":"B","group":"第22组","category":"国家安定与动荡","sub":"社会安定","meaning":"晏：平静。黄河水清了，大海没有浪了。比喻天下太平","example":"…效应对腐败手段隐形变异、翻新升级还任重道远，彻底铲除腐败滋生土壤、实现海晏河清还任重道远，清理系统性腐败、化解风险隐患还任重道远。","pdfpage":133,"usage":"描述社会秩序或居民处境，区分宏观安定与个体漂泊。","clue":"社会安定","myexample":"","contrasts":[{"other":"安居乐业","note":"同属“国家安定与动荡”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"背井离乡","level":"B","group":"第22组","category":"国家安定与动荡","sub":"生活不如意","meaning":"背：离开。井：古制八家为井，这里指家宅。指被迫离开家乡，到外地求生。（也指主动离开家乡，到外地生活/工作）","example":"如今，不少老人为了帮忙碌的儿女、照顾年幼的孙辈，背井离乡来到子女工作的大城市。","pdfpage":133,"usage":"描述社会秩序或居民处境，区分宏观安定与个体漂泊。","clue":"生活不如意","myexample":"","contrasts":[{"other":"安居乐业","note":"同属“国家安定与动荡”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"同心同德","level":"B","group":"第23组","category":"国际国内关系","sub":"融洽和谐","meaning":"思想统一，信念一致。形容大家团结一条心","example":"坚持党的全面领导，同心同德共同奋斗，我们坚信，任何困难都阻挡不了中国人民实现梦想的步伐。","pdfpage":137,"usage":"用于合作关系、互助支持、局势变化与负面勾结。","clue":"融洽和谐","myexample":"","contrasts":[{"other":"一衣带水","note":"同属“国际国内关系”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"同流合污","level":"B","group":"第23组","category":"国际国内关系","sub":"坏人坏事","meaning":"原指言行与不良的习俗、世道相合。后指跟坏人一起干坏事","example":"各国在同美国开展安全合作的同时，应当以史为鉴、擦亮眼睛、明辨是非、吸取教训，不搞同流合污、为虎作伥那套，不走对抗较量、零和博弈老路，寻求和深化合作并进、互利共赢的最大公约数，让合作的互信之基、发展之路行稳致远。","pdfpage":142,"usage":"用于合作关系、互助支持、局势变化与负面勾结。","clue":"坏人坏事","myexample":"","contrasts":[{"other":"一衣带水","note":"同属“国际国内关系”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"和衷共济","level":"B","group":"第23组","category":"国际国内关系","sub":"融洽和谐","meaning":"衷：内心。和衷：指同心。大家同心渡过江河。比喻同心协力，渡过难关。现也可比喻齐心协力","example":"在灾难面前，总有一种力量让人感动。超强台风“威马逊”肆虐海南之时，琼岛儿女在风雨中互帮互助，社会各界和衷共济，谱写了一曲感人肺腑的守望相助之歌。","pdfpage":138,"usage":"用于合作关系、互助支持、局势变化与负面勾结。","clue":"融洽和谐","myexample":"","contrasts":[{"other":"一衣带水","note":"同属“国际国内关系”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"唇齿相依","level":"B","group":"第23组","category":"国际国内关系","sub":"和邻居的关系","meaning":"嘴唇与牙齿互相依存。比喻关系极为密切","example":"经济建设与国防建设是唇齿相依的两个方面。","pdfpage":139,"usage":"用于合作关系、互助支持、局势变化与负面勾结。","clue":"和邻居的关系","myexample":"","contrasts":[{"other":"一衣带水","note":"同属“国际国内关系”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"} ","meaning":"恍：仿佛；世：三十年为一世。仿佛隔了一个时代。指一种因人事或景物变化很大而引起的感触","example":"那里山大沟深、破屋烂衫，只能靠天吃饭，“种下一袋子，收上一帽子”。习近平总书记接过照片仔细端详，不由感慨：“今非昔比，恍如隔世啊！”","pdfpage":200,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"变化巨大","myexample":"","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"改弦易辙","level":"B","group":"第32组","category":"改变与不变","sub":"改变","meaning":"改弦：更换琴弦。易：改变。辙：车轮压过的痕迹，指道路。比喻改变方向或做法。同“更弦易辙”“改辕易辙”","example":"他接受了同志们的批评，从此改弦易辙，半年来工作大有起色。","pdfpage":196,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"改变","myexample":"","contrasts":[{"other":"改弦更张","note":"前者常指改革制度、方法；后者常指改变方向、方针或办法。"}]},{"word":"斗转星移","level":"B","group":"第32组","category":"改变与不变","sub":"变化巨大","meaning":"斗：北斗星。表示一夜之间时间的推移。后也指岁月流逝","example":"本次活动将读书现场搬到了新华书店阅览室，面对琳琅满目的书籍，浓厚的读书氛围迎面扑来，干警们在历史长河中感受斗转星移，在社科文学中体味百态人生，在法律知识中思考实践与应用……伴随着书页翻动的沙沙声，共赴一场阅读盛宴。","pdfpage":199,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"变化巨大","myexample":"","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"白云苍狗","level":"B","group":"第32组","category":"改变与不变","sub":"变化巨大","meaning":"苍：青色，泛指青黑色。比喻世事变化无常。也作“白衣苍狗”","example":"白云苍狗，世事无常，悠悠时光看似漫长，不过是白驹过隙，忽然而已。","pdfpage":200,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"变化巨大","myexample":"","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"长盛不衰","level":"B","group":"第32组","category":"改变与不变","sub":"长时间繁荣昌盛","meaning":"长久兴盛而不衰败，比喻长时间保持旺盛的势头","example":"国乒教练组竞聘也已展开，对标奥运5金的战略目标，长盛不衰将是一代代国乒人最大的追求。","pdfpage":198,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"长时间繁荣昌盛","myexample":"","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"因陋就简","level":"B","group":"第33组","category":"顺势造势","sub":"顺势","meaning":"指在条件有限的情况下，利用现有简陋条件将就办事，强调适应环境而非追求完善。该成语褒贬取决于“简”的合理性—灵活务实则褒，降低标准则贬","example":"坑道战、破袭战、掀帘战、地道战、地雷战、堡垒战、自卫队、联防队、工作队、武工队等因陋就简因地制宜的战术战法层出不穷，都是沦陷区民众的发明创造，更属“兵民是胜利之本”的真实体现。","pdfpage":204,"usage":"判断顺应趋势还是助长事态，注意褒贬语境。","clue":"顺势","myexample":"","contrasts":[{"other":"推波助澜","note":"同属“顺势造势”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"天经地义","level":"B","group":"第34组","category":"自然会发生","sub":"事情发生合乎情理","meaning":"指天地间理所当然而不能改变的道理；也指理所当然，不容置疑的问题","example":"解放军维护国家主权和领土完整，开展有关军事行动天经地义。","pdfpage":207,"usage":"区分顺应自然、合乎道理、条件成熟与自然发生。","clue":"事情发生合乎情理","myexample":"","contrasts":[{"other":"理所当然","note":"同属“自然会发生”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"临渴掘井","level":"B","group":"第35组","category":"提早准备和补救","sub":"出现问题进行补救","meaning":"临；接近。感到口渴才挖井。比喻平时没有准备，事到临头才想办法","example":"“临渴掘井”，拖到“问题扎堆”再改革万万要不得。","pdfpage":212,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"出现问题进行补救","myexample":"","contrasts":[{"other":"亡羊补牢","note":"同属“提早准备和补救”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"常备不懈","level":"B","group":"第35组","category":"提早准备和补救","sub":"前期准备","meaning":"意思是时刻准备着，毫不松懈","example":"要改革完善疾病预防控制体系。坚决贯彻预防为主的卫生与健康工作方针，坚持常备不懈，将预防关口前移，避免小病酿成大疫。要健全公共卫生服务体系。","pdfpage":210,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"前期准备","myexample":"","contrasts":[{"other":"亡羊补牢","note":"同属“提早准备和补救”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"江心补漏","level":"B","group":"第35组","category":"提早准备和补救","sub":"出现问题进行补救","meaning":"指船到江心才补漏洞。比喻临到紧急关头才设法补救，为时已晚。偏正式结构；在句中一般作谓语、定语","example":"事态已严重到了这种境地，你再怎么补救也是江心补漏，为时已晚。","pdfpage":212,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"出现问题进行补救","myexample":"","contrasts":[{"other":"亡羊补牢","note":"同属“提早准备和补救”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"各行其是","level":"B","group":"第36组","category":"办公、管理相关","sub":"形容工作开展的局面、形势不好","meaning":"指各人按照自己认为正确的去做","example":"各自为政、各行其是，党就会变成一盘散沙，党的领导就会成为一句空话。","pdfpage":214,"usage":"常与部门协调、任务负责、独立承担等工作情境搭配。","clue":"形容工作开展的局面、形势不好","myexample":"","contrasts":[{"other":"各自为政","note":"同属“办公、管理相关”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"如鱼得水","level":"B","group":"第36组","category":"办公、管理相关","sub":"形容人工作的状态","meaning":"好像鱼得到水一样。比喻得到跟自己非常投合的人或对自己很适合的环境","example":"优化营商环境，让各种类型的经营主体“如鱼得水”。不止在南京，江苏各地积极行动。","pdfpage":215,"usage":"常与部门协调、任务负责、独立承担等工作情境搭配。","clue":"形容人工作的状态","myexample":"","contrasts":[{"other":"各自为政","note":"同属“办公、管理相关”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"无根之木","level":"B","group":"第37组","category":"空谈与虚幻","sub":"不靠谱的做法","meaning":"意思是比喻没有根据或基础的事物","example":"技术源于思想，切断思想，技术就沦为无根之木，非死不可。","pdfpage":217,"usage":"区分不切实际的计划、徒劳行为和只有理论没有实践。","clue":"不靠谱的做法","myexample":"","contrasts":[{"other":"空中楼阁","note":"同属“空谈与虚幻”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"水中捞月","level":"B","group":"第37组","category":"空谈与虚幻","sub":"不靠谱的做法","meaning":"指在水中捞月亮；比喻去做根本做不到的事情，只能徒劳无功。含贬义","example":"美国人眼里只有自身利益，民进党当局想依靠对美军购从根本上改变台军装备匮乏、军力羸弱的局面，不过是画饼充饥、水中捞月。","pdfpage":218,"usage":"区分不切实际的计划、徒劳行为和只有理论没有实践。","clue":"不靠谱的做法","myexample":"","contrasts":[{"other":"空中楼阁","note":"同属“空谈与虚幻”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"不期而遇","level":"B","group":"第38组","category":"来者众多","sub":"偶遇","meaning":"没约定而意外相遇","example":"广大青年不仅是现在的生力军，也是未来的主力军。同向同心，当代青年与最鲜明的时代主题不期而遇。对当代青年来说，这是最大的人生际遇，也是最大的人生考验。","pdfpage":226,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"偶遇","myexample":"","contrasts":[{"other":"无人问津","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"人迹罕至","level":"B","group":"第38组","category":"来者众多","sub":"形容人多、人少","meaning":"罕：少。指偏僻荒凉、少有人到的地方。（侧重偏僻荒凉）","example":"历史上曾人来人往的丝绸古迹，如今已变成人迹罕至的沙漠。","pdfpage":226,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"形容人多、人少","myexample":"","contrasts":[{"other":"无人问津","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"如影随形","level":"B","group":"第38组","category":"来者众多","sub":"一同出现","meaning":"好像影子总是跟着身体一样。比喻两个人关系亲密，常在一起","example":"监督和约束如同行驶中的安全带和登山时的防护索，是一种对党员干部如影随形的爱护。","pdfpage":227,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"一同出现","myexample":"","contrasts":[{"other":"无人问津","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"萍水相逢","level":"B","group":"第38组","category":"来者众多","sub":"偶遇","meaning":"比喻从不认识的人偶然相遇","example":"我所衷心敬佩的人，不是那种什么事都可以找兄弟帮忙、仿佛大半个中国都有他哥们的人，而是那种跟所有萍水相逢的人都友善宽和、时时都在传播着正能量的人。","pdfpage":226,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"偶遇","myexample":"","contrasts":[{"other":"无人问津","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{ b":"形容孤独","meaning":"茕茕：孤单，无依靠。孑立：孤立。形容一个人孤苦伶仃，无依无靠","example":"在恢宏的历史主旋律之外茕茕孑立、喃喃自语，只能被淘汰和淹没。","pdfpage":231,"usage":"区分人多热闹、车马往来与孤身无依。","clue":"形容孤独","myexample":"","contrasts":[{"other":"万人空巷","note":"同属“人多人少”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"车水马龙","level":"B","group":"第39组","category":"人多人少","sub":"形容人多、热闹","meaning":"车像流水，马如游龙。形容车马来来往往的热闹景象。同“马龙车水”","example":"这座沿海城市自从被列为经济开发区之后，一时华盖云集，车水马龙，一派繁忙景象。","pdfpage":230,"usage":"区分人多热闹、车马往来与孤身无依。","clue":"形容人多、热闹","myexample":"","contrasts":[{"other":"万人空巷","note":"同属“人多人少”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"买椟还珠","level":"B","group":"第40组","category":"好坏掺杂","sub":"不分好坏","meaning":"椟：木匣子。还：退还。比喻没有眼光，不识货，取舍失当","example":"很多消费者有这样的经历：花高价购买包装精美的产品，拆开“里三层外三层”的包装，商品本身没多少价值。有人认为，过度包装是现代的“买椟还珠”。","pdfpage":235,"usage":"先判断“程度不齐、好坏混杂、真假掺杂”，性质不一样。","clue":"不分好坏","myexample":"","contrasts":[{"other":"参差不齐","note":"同属“好坏掺杂”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]}],"questions":[{"id":"Q001","word":"博大精深","level":"S","group":"第1组","category":"中华文明传统文化","stem":"一部地方文化史若只罗列节庆名称，就难以展现传统文化内涵之丰富、思想之深刻，更无法让人领略其____的魅力。","clue":"“内涵丰富、思想深刻”要求既广博又精深","options":["连绵不绝","兼收并蓄","博大精深","历久弥新"],"answer":2,"optionReasons":{"连绵不绝":"该词表示“意思是连续而不中断”。虽然可能与正确词相近，但这道题的关键信息是““内涵丰富、思想深刻”要求既广博又精深”，仍以“博大精深”更贴合。","兼收并蓄":"该词通常表示“并：一起。蓄：积聚，储存。对不同的人或事物都能同时收容、保留”，侧重点是“中华文明传统文化”。题干则着重““内涵丰富、思想深刻”要求既广博又精深”，语义指向不同。","历久弥新":"该词表示“弥：更加。指经历长久的时间而更加鲜活，更加有活力，更显价值”。虽然可能与正确词相近，但这道题的关键信息是““内涵丰富、思想深刻”要求既广博又精深”，仍以“博大精深”更贴合。"}},{"id":"Q002","word":"历久弥新","level":"S","group":"第1组","category":"中华文明传统文化","stem":"这项古老的民间技艺并未被时间淘汰，反而因为不断融入现代生活，显得____。","clue":"“年代久远却更有活力”","options":["兼收并蓄","历久弥新","博大精深","连绵不绝"],"answer":1,"optionReasons":{"兼收并蓄":"该词通常表示“并：一起。蓄：积聚，储存。对不同的人或事物都能同时收容、保留”，侧重点是“中华文明传统文化”。题干则着重““年代久远却更有活力””，语义指向不同。","博大精深":"该词表示“博大：广大。精深：精湛深刻。形容学识、思想、理论广博丰富，精湛深刻”。虽然可能与正确词相近，但这道题的关键信息是““年代久远却更有活力””，仍以“历久弥新”更贴合。","连绵不绝":"该词表示“意思是连续而不中断”。虽然可能与正确词相近，但这道题的关键信息是““年代久远却更有活力””，仍以“历久弥新”更贴合。"}},{"id":"Q003","word":"承上启下","level":"S","group":"第2组","category":"文化传承","stem":"报告的第三部分先总结前期探索，再引出下一阶段改革方案，恰好发挥了____的作用。","clue":"“总结前文、引出后文”的连接作用","options":["一脉相承","继往开来","薪火相传","承上启下"],"answer":3,"optionReasons":{"一脉相承":"该词通常表示“一脉：指一个血统或一个派系。相承：相续传承。由一个血统或一个派别世代相传承袭下来。比喻人或事物间的传承关系。也作“一脉相传”“一”，侧重点是“文化传承”。题干则着重““总结前文、引出后文”的连接作用”，语义指向不同。","继往开来":"该词表示“继承前人的事业，开辟未来的道路”。虽然可能与正确词相近，但这道题的关键信息是““总结前文、引出后文”的连接作用”，仍以“承上启下”更贴合。","薪火相传":"该词通常表示“意思是比喻学问和技艺代代相传。比喻师生授受不绝，或种族、血统、文化精神的传承，绵延不尽”，侧重点是“文化传承”。题干则着重““总结前文、引出后文”的连接作用”，语义指向不同。"}},{"id":"Q004","word":"继往开来","level":"S","group":"第2组","category":"文化传承","stem":"新一代研究者既珍惜前辈积累的成果，又主动开拓全新方向，力求在学术道路上____。","clue":"“继承前人并开辟未来”两层意思缺一不可","options":["薪火相传","吐故纳新","继往开来","承上启下"],"answer":2,"optionReasons":{"薪火相传":"该词通常表示“意思是比喻学问和技艺代代相传。比喻师生授受不绝，或种族、血统、文化精神的传承，绵延不尽”，侧重点是“文化传承”。题干则着重““继承前人并开辟未来”两层意思缺一不可”，语义指向不同。","吐故纳新":"该词通常表示“纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻扬弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）”，侧重点是“改良旧的换新的”。题干则着重““继承前人并开辟未来”两层意思缺一不可”，语义指向不同。","承上启下":"该词表示“接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡”。虽然可能与正确词相近，但这道题的关键信息是““继承前人并开辟未来”两层意思缺一不可”，仍以“继往开来”更贴合。"}},{"id":"Q005","word":"吐故纳新","level":"S","group":"第3组","category":"改革创新","stem":"传统产业不能只守着过去的工艺，而应在淘汰落后环节、吸收新技术的过程中不断____。","clue":"“扬弃旧的、吸收新的”","options":["去芜存菁","吐故纳新","革故鼎新","激浊扬清"],"answer":1,"optionReasons":{"去芜存菁":"该词表示“意思是除去杂质、保留精华”。虽然可能与正确词相近，但这道题的关键信息是““扬弃旧的、吸收新的””，仍以“吐故纳新”更贴合。","革故鼎新":"该词表示“革：除去。鼎新：立新。指革除旧的，建立新的。多指改朝换代或重大变革。（多政治角度）”。虽然可能与正确词相近，但这道题的关键信息是““扬弃旧的、吸收新的””，仍以“吐故纳新”更贴合。","激浊扬清":"该词表示“强调通过主动干预清除负面因素并弘扬正面价值，侧重点在于“激”与“扬”的联动作用，既包含对浑浊、消极现象的批判与清除，又包含对清澈”。虽然可能与正确词相近，但这道题的关键信息是““扬弃旧的、吸收新的””，仍以“吐故纳新”更贴合。"}},{"id":"Q006","word":"革故鼎新","level":"S","group":"第3组","category":"改革创新","stem":"面对长期积累的制度性障碍，改革不能仅做局部修补，而需破除旧机制、建立新体系，体现____的决心。","clue":"“旧制度革除、新制度建立”的重大变革","options":["去芜存菁","吐故纳新","革故鼎新","激浊扬清"],"answer":2,"optionReasons":{"去芜存菁":"该词表示“意思是除去杂质、保留精华”。虽然可能与正确词相近，但这道题的关键信息是““旧制度革除、新制度建立”的重大变革”，仍以“革故鼎新”更贴合。","吐故纳新":"该词表示“纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻扬弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）”。虽然可能与正确词相近，但这道题的关键信息是““旧制度革除、新制度建立”的重大变革”，仍以“革故鼎新”更贴合。","激浊扬清":"该词表示“强调通过主动干预清除负面因素并弘扬正面价值，侧重点在于“激”与“扬”的联动作用，既包含对浑浊、消极现象的批判与清除，又包含对清澈”。虽然可能与正确词相近，但这道题的关键信息是““旧制度革除、新制度建立”的重大变革”，仍以“革故鼎新”更贴合。"}},{"id":"Q007","word":"不落窠臼","level":"S","group":"第4组","category":"做法、构思创新","stem":"这部小说没有套用常见的英雄成长模板，叙事结构与人物塑造都____，令人耳目一新。","clue":"“文章艺术不落俗套”的独创性","options":["匠心独运","别出心裁","不落窠臼","标新立异"],"answer":2,"optionReasons":{"匠心独运":"该词通常表示“匠心：精巧的心思。具有独到的创造性。多指文学艺术的创作构思。同“独具匠心”“匠心独运”。（侧重文艺创作的心思巧妙）”，侧重点是“心思独特、创新”。题干则着重““文章艺术不落俗套”的独创性”，语义指向不同。","别出心裁":"该词通常表示“心裁：内心的决断。另外想出与众不同的办法、主意。也作“独出心裁”。（侧重想法构思巧妙）”，侧重点是“心思独特、创新”。题干则着重““文章艺术不落俗套”的独创性”，语义指向不同。","标新立异":"该词通常表示“标：表明。异：独特，与众不同。原意为表明新颖的义理，提出与众不同的见解。后指故意提出新奇的见解，表示自己与众不同。（主观上故意性”，侧重点是“形容创新、独特”。题干则着重““文章艺术不落俗套”的独创性”，语义指向不同。"}},{"id":"Q008","word":"别出心裁","level":"S","group":"第4组","category":"做法、构思创新","stem":"展馆设计师没有照搬传统展柜，而是想到让观众沿着时间轴穿行的展示办法，可谓____。","clue":"“另想出巧妙的办法和构思”","options":["别出心裁","因循守旧","抱残守缺","照本宣科"],"answer":0,"optionReasons":{"因循守旧":"该词通常表示“因循：沿用旧办法。指一直沿用旧办法而不加改变。（侧重新与旧）”，侧重点是“形容守旧不创新”。题干则着重““另想出巧妙的办法和构思””，语义指向不同。","抱残守缺":"该词通常表示“残、缺：不完整。①固守陈旧残缺的东西不放，形容保守，不知改进。②保存虽有残缺但仍有价值的古物”，侧重点是“形容守旧不创新”。题干则着重““另想出巧妙的办法和构思””，语义指向不同。","照本宣科":"该词通常表示“原指照着书本或讲稿逐字宣读。引申为机械执行既定规则或文本内容，完全依赖书面指示而缺乏实际调整，批评其缺乏创造性”，侧重点是“按规矩办事”。题干则着重““另想出巧妙的办法和构思””，语义指向不同。"}},{"id":"Q009","word":"匠心独运","level":"S","group":"第4组","category":"做法、构思创新","stem":"纪录片导演将古画的留白转换为镜头语言，让历史人物仿佛走出画面，艺术构思实在____。","clue":"“艺术创作中的精巧独到心思”","options":["匠心独运","别出心裁","自成一家","不落窠臼"],"answer":0,"optionReasons":{"别出心裁":"该词表示“心裁：内心的决断。另外想出与众不同的办法、主意。也作“独出心裁”。（侧重想法构思巧妙）”。虽然可能与正确词相近，但这道题的关键信息是““艺术创作中的精巧独到心思””，仍以“匠心独运”更贴合。","自成一家":"该词通常表示“意思是指在某一方面的学问或技术有独到的见解或独特的做法，能自成体系”，侧重点是“与众不同”。题干则着重““艺术创作中的精巧独到心思””，语义指向不同。","不落窠臼":"该词通常表示“意为不落俗套，有独创风格（多用于形容文章或艺术作品）”，侧重点是“与众不同”。题干则着重““艺术创作中的精巧独到心思””，语义指向不同。"}},{"id":"Q010","word":"因循守旧","level":"S","group":"第5组","category":"守旧不创新","stem":"技术和用户需求已经改变，这家公司仍然机械沿用二十年前的流程，管理上明显____。","clue":"“沿用旧办法不改变”","options":["因循守旧","固步自封","食古不化","抱残守缺"],"answer":0,"optionReasons":{"固步自封":"该词表示“封：限制在一定的范围内。比喻因循守旧，安于现状，不求创新进取。（侧重开放与封闭）”。虽然可能与正确词相近，但这道题的关键信息是““沿用旧办法不改变””，仍以“因循守旧”更贴合。","食古不化":"该词表示“意思是读书、作画一味学习古人，拘泥陈法，不善于灵活运用。指对所学的古代知识理解得不透，不善于按现在的情况来运用”。虽然可能与正确词相近，但这道题的关键信息是““沿用旧办法不改变””，仍以“因循守旧”更贴合。","抱残守缺":"该词表示“残、缺：不完整。①固守陈旧残缺的东西不放，形容保守，不知改进。②保存虽有残缺但仍有价值的古物”。虽然可能与正确词相近，但这道题的关键信息是““沿用旧办法不改变””，仍以“因循守旧”更贴合。"}},{"id":"Q011","word":"固步自封","level":"S","group":"第5组","category":"守旧不创新","stem":"一个城市若满足于已有优势，拒绝学习外部经验、也不愿开放合作，就会在____中失去活力。","clue":"“安于现状、封闭自己、不求进取”","options":["固步自封","食古不化","抱残守缺","因循守旧"],"answer":0,"optionReasons":{"食古不化":"该词表示“意思是读书、作画一味学习古人，拘泥陈法，不善于灵活运用。指对所学的古代知识理解得不透，不善于按现在的情况来运用”。虽然可能与正确词相近，但这道题的关键信息是““安于现状、封闭自己、不求进取””，仍以“固步自封”更贴合。","抱残守缺":"该词表示“残、缺：不完整。①固守陈旧残缺的东西不放，形容保守，不知改进。②保存虽有残缺但仍有价值的古物”。虽然可能与正确词相近，但这道题的关键信息是““安于现状、封闭自己、不求进取””，仍以“固步自封”更贴合。","因循守旧":"该词表示“因循：沿用旧办法。指一直沿用旧办法而不加改变。（侧重新与旧）”。虽然可能与正确词相近，但这道题的关键信息是““安于现状、封闭自己、不求进取””，仍以“固步自封”更贴合。"}},{"id":"Q012","word":"举步维艰","level":"S","group":"第7组","category":"处境困难","stem":"资金断裂、设备陈旧、人才流失接连发生，这个小团队的转型已是____。","clue":"“整体处境艰难、每一步都困难”","options":["畏葸不前","骑虎难下","进退失据","举步维艰"],"answer":3,"optionReasons":{"畏葸不前":"该词通常表示“畏惧退缩，不敢前进”，侧重点是“不敢前进”。题干则着重““整体处境艰难、每一步都困难””，语义指向不同。","骑虎难下":"该词通常表示“骑在虎背上难以下来。比喻事情遇到困难，迫于形势不能中止，陷入进退两难的境地。（侧重同一件事已经开始了就难以停止）”，侧重点是“不好抉择”。题干则着重““整体处境艰难、每一步都困难””，语义指向不同。","进退失据":"该词通常表示“同“进退失据”“进退两难””，侧重点是“不好抉择”。题干则着重““整体处境艰难、每一步都困难””，语义指向不同。"}},{"id":"Q013","word":"骑虎难下","level":"S","group":"第7组","category":"处境困难","stem":"项目启动后才发现成本远超预算，但退出又要承担巨额违约损失，负责人一时____。","clue":"“已开始而难以停下，进退两难”","options":["裹足不前","举步维艰","骑虎难下","进退维谷"],"answer":2,"optionReasons":{"裹足不前":"该词表示“比喻因心存顾虑而停止行动或不敢向前，与踟蹰不前相比停滞程度更彻底，暗示难以突破”。虽然可能与正确词相近，但这道题的关键信息是““已开始而难以停下，进退两难””，仍以“骑虎难下”更贴合。","举步维艰":"该词通常表示“抬脚行走十分困难。形容已陷入十分艰难的处境”，侧重点是“处境艰难”。题干则着重““已开始而难以停下，进退两难””，语义指向不同。","进退维谷":"该词通常表示“谷：困窘。指前进或后退都处于困难境地。形容进退两难。同“进退两难”“进退失据”。（侧重很难抉择）”，侧重点是“处境困难”。题干则着重““已开始而难以停下，进退两难””，语义指向不同。"}},{"id":"Q014","word":"危在旦夕","level":"S","group":"第8组","category":"形势危险","stem":"暴雨导致山体出现大面积裂缝，附近房屋随时可能被冲毁，居民安全____。","clue":"“危险就在眼前、随时可能发生”","options":["危在旦夕","危如累卵","岌岌可危","风雨飘摇"],"answer":0,"optionReasons":{"危如累卵":"该词通常表示“比喻形势非常危险，如同堆起来的蛋，随时都有塌下打碎的可能”，侧重点是“形势危险”。题干则着重““危险就在眼前、随时可能发生””，语义指向不同。","岌岌可危":"该词通常表示“岌岌：山高陡峭，就要倒下的样子。形容非常危险，快要倾覆或灭亡”，侧重点是“形势危险”。题干则着重““危险就在眼前、随时可能发生””，语义指向不同。","风雨飘摇":"该词通常表示“飘摇：飘荡。在风雨中飘荡不定。比喻局势动荡不安，很不稳定”，侧重点是“形势危险”。题干则着重““危险就在眼前、随时可能发生””，语义指向不同。"}},{"id":"Q015","word":"岌岌可危","level":"S","group":"第8组","category":"形势危险","stem":"长期亏损又失去主要客户后，这家企业的正常经营已经____，稍有冲击就可能崩溃。","clue":"“处于快要倾覆或灭亡的险境”","options":["风雨飘摇","危如累卵","危在旦夕","岌岌可危"],"answer":3,"optionReasons":{"风雨飘摇":"该词表示“飘摇：飘荡。在风雨中飘荡不定。比喻局势动荡不安，很不稳定”。虽然可能与正确词相近，但这道题的关键信息是““处于快要倾覆或灭亡的险境””，仍以“岌岌可危”更贴合。","危如累卵":"该词表示“比喻形势非常危险，如同堆起来的蛋，随时都有塌下打碎的可能”。虽然可能与正确词相近，但这道题的关键信息是““处于快要倾覆或灭亡的险境””，仍以“岌岌可危”更贴合。","危在旦夕":"该词通常表示“旦夕：早晨和晚上，形容时间短。形容危险就在眼前”，侧重点是“侧重时间”。题干则着重““处于快要倾覆或灭亡的险境””，语义指向不同。"}},{"id":"Q016","word":"如火如荼","level":"S","group":"第9组","category":"事物出现、发展、衰落","stem":"全市各校踊跃参与科普活动，讲座、展览和实验体验相继举办，活动开展得____。","clue":"“活动开展热烈、气氛旺盛”","options":["日渐式微","方兴未艾","如火如荼","日新月异"],"answer":2,"optionReasons":{"日渐式微":"该词通常表示“事物逐渐地由兴盛而衰落”，侧重点是“逐渐衰落”。题干则着重““活动开展热烈、气氛旺盛””，语义指向不同。","方兴未艾":"该词通常表示“意思是事物正在发展，尚未达到止境”，侧重点是“出现、萌生”。题干则着重““活动开展热烈、气氛旺盛””，语义指向不同。","日新月异":"该词通常表示“形容发展变化很快，新事物、新气象不断出现”，侧重点是“形容发展迅速”。题干则着重““活动开展热烈、气氛旺盛””，语义指向不同。"}},{"id":"Q017","word":"方兴未艾","level":"S","group":"第9组","category":"事物出现、发展、衰落","stem":"城市更新刚刚形成发展势头，新的服务场景还在不断涌现，相关探索可谓____。","clue":"“正在兴起并持续发展，尚未达到终点”","options":["日渐式微","方兴未艾","如火如荼","如日中天"],"answer":1,"optionReasons":{"日渐式微":"该词通常表示“事物逐渐地由兴盛而衰落”，侧重点是“逐渐衰落”。题干则着重““正在兴起并持续发展，尚未达到终点””，语义指向不同。","如火如荼":"该词通常表示“原比喻军容之盛，现在形容旺盛、热烈或激烈”，侧重点是“发展势头好”。题干则着重““正在兴起并持续发展，尚未达到终点””，语义指向不同。","如日中天":"该词通常表示“像太阳正运行到正午。比喻正发展到最兴盛的阶段”，侧重点是“发展势头好”。题干则着重““正在兴起并持续发展，尚未达到终点””，语义指向不同。"}},{"id":"Q018","word":"日新月异","level":"S","group":"第9组","category":"事物出现、发展、衰落","stem":"近十年，智能制造从单机自动化迈向协同生产，新设备、新工艺不断涌现，技术进步____。","clue":"“天天有新变化，发展变化快”","options":["方兴未艾","日新月异","日渐式微","如火如荼"],"answer":1,"optionReasons":{"方兴未艾":"该词通常表示“意思是事物正在发展，尚未达到止境”，侧重点是“出现、萌生”。题干则着重““天天有新变化，发展变化快””，语义指向不同。","日渐式微":"该词通常表示“事物逐渐地由兴盛而衰落”，侧重点是“逐渐衰落”。题干则着重““天天有新变化，发展变化快””，语义指向不同。","如火如荼":"该词通常表示“原比喻军容之盛，现在形容旺盛、热烈或激烈”，侧重点是“发展势头好”。题干则着重““天天有新变化，发展变化快””，语义指向不同。"}},{"id":"Q019","word":"日渐式微","level":"S","group":"第9组","category":"事物出现、发展、衰落","stem":"随着年轻人转向线上娱乐，曾经热闹的街头录像厅逐步冷清，传统经营模式____。","clue":"“事物由盛到衰、逐渐弱化”","options":["日新月异","雨后春笋","日渐式微","如日中天"],"answer":2,"optionReasons":{"日新月异":"该词通常表示“形容发展变化很快，新事物、新气象不断出现”，侧重点是“形容发展迅速”。题干则着重““事物由盛到衰、逐渐弱化””，语义指向不同。","雨后春笋":"该词通常表示“春天下雨后竹笋长得又多又快，比喻新生事物大量涌现和蓬勃发展。（侧重数量多）”，侧重点是“出现、萌生”。题干则着重““事物由盛到衰、逐渐弱化””，语义指向不同。","如日中天":"该词通常表示“像太阳正运行到正午。比喻正发展到最兴盛的阶段”，侧重点是“发展势头好”。题干则着重““事物由盛到衰、逐渐弱化””，语义指向不同。"}},{"id":"Q020","word":"望尘莫及","level":"S","group":"第10组","category":"竞争比较","stem":"在基础算法领域，后起团队虽然进步明显，但与顶尖机构之间仍有巨大差距，短期内只能____。","clue":"“差距过大，远远追赶不上”","options":["望尘莫及","同日而语","相形见绌","望其项背"],"answer":0,"optionReasons":{"同日而语":"该词通常表示“指相提并论。（侧重于强调时间上的对比，多形容与自身的比较。现有时也有例外）（多用于否定句中）”，侧重点是“同等地位”。题干则着重““差距过大，远远追赶不上””，语义指向不同。","相形见绌":"该词通常表示“形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足”，侧重点是“和别人相比较”。题干则着重““差距过大，远远追赶不上””，语义指向不同。","望其项背":"该词表示“项：脖子的后部。能够看到别人的颈项和脊背。比喻有能力赶得上。（常用于否定句：难以～、无法～、不能～）”。虽然可能与正确词相近，但这道题的关键信息是““差距过大，远远追赶不上””，仍以“望尘莫及”更贴合。"}},{"id":"Q021","word":"相形见绌","level":"S","group":"第10组","category":"竞争比较","stem":"同样面对极端天气，新型预警系统响应迅速，旧设备的处理能力便显得____。","clue":"“与同类事物比较后显出不足”","options":["相形见绌","望尘莫及","出类拔萃","相提并论"],"answer":0,"optionReasons":{"望尘莫及":"该词通常表示“莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦”，侧重点是“赶得上/赶不上”。题干则着重““与同类事物比较后显出不足””，语义指向不同。","出类拔萃":"该词表示“出：超出。类：同类。拔：高出。萃：指聚在一起的人或物。指人的品德才能出众，高出同类之上。（侧重能力或品德）（高于同类）”。虽然可能与正确词相近，但这道题的关键信息是““与同类事物比较后显出不足””，仍以“相形见绌”更贴合。","相提并论":"该词通常表示“把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）”，侧重点是“同等地位”。题干则着重““与同类事物比较后显出不足””，语义指向不同。"}},{"id":"Q022","word":"相提并论","level":"S","group":"第10组","category":"竞争比较","stem":"这两种材料的性能差距悬殊，不能仅凭价格相近就把它们____。","clue":"“差距明显，不能放在同一层次评价”","options":["望尘莫及","出类拔萃","同日而语","相提并论"],"answer":3,"optionReasons":{"望尘莫及":"该词通常表示“莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦”，侧重点是“赶得上/赶不上”。题干则着重““差距明显，不能放在同一层次评价””，语义指向不同。","出类拔萃":"该词通常表示“出：超出。类：同类。拔：高出。萃：指聚在一起的人或物。指人的品德才能出众，高出同类之上。（侧重能力或品德）（高于同类）”，侧重点是“和别人相比较”。题干则着重““差距明显，不能放在同一层次评价””，语义指向不同。","同日而语":"该词表示“指相提并论。（侧重于强调时间上的对比，多形容与自身的比较。现有时也有例外）（多用于否定句中）”。虽然可能与正确词相近，但这道题的关键信息是““差距明显，不能放在同一层次评价””，仍以“相提并论”更贴合。"}},{"id":"Q023","word":"应接不暇","level":"S","group":"第11组","category":"能力不足","stem":"周末博物馆接待量骤增，工作人员要引导观众、答疑并处理预约事务，一时间____。","clue":"“任务太多、忙得应付不过来”","options":["应接不暇","顾此失彼","回天乏术","爱莫能助"],"answer":0,"optionReasons":{"顾此失彼":"该词表示“顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）”。虽然可能与正确词相近，但这道题的关键信息是““任务太多、忙得应付不过来””，仍以“应接不暇”更贴合。","回天乏术":"该词通常表示“回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救”，侧重点是“能力有限”。题干则着重““任务太多、忙得应付不过来””，语义指向不同。","爱莫能助":"该词通常表示“爱：爱惜；莫：不。虽然心中关切同情，却没有力量帮助”，侧重点是“能力有限”。题干则着重““任务太多、忙得应付不过来””，语义指向不同。"}},{"id":"Q024","word":"顾此失彼","level":"S","group":"第11组","category":"能力不足","stem":"设计方案过分追求页面美观，却忽略老年用户的操作便利，难免____。","clue":"“照顾一面、忽略另一面”","options":["一筹莫展","顾此失彼","捉襟见肘","应接不暇"],"answer":1,"optionReasons":{"一筹莫展":"该词通常表示“筹：计策。展：施展。一点计策也施展不出。形容没有一点办法”，侧重点是“没能成功”。题干则着重““照顾一面、忽略另一面””，语义指向不同。","捉襟见肘":"该词通常表示“捉襟：整理衣襟。肘：胳膊肘儿。形容衣裳破旧。也比喻困难很多，应付不过来。（侧重人力、物力等资源有限）”，侧重点是“能力不足”。题干则着重““照顾一面、忽略另一面””，语义指向不同。","应接不暇":"该词表示“暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）”。虽然可能与正确词相近，但这道题的关键信息是““照顾一面、忽略另一面””，仍以“顾此失彼”更贴合。"}},{"id":"Q025","word":"蜻蜓点水","level":"S","group":"第12组","category":"印象和效果","stem":"调研组在每个村只停留几分钟，既不深入访谈也不核实数据，这样____的调查难以发现真问题。","clue":"“接触表面、研究不深入”","options":["融会贯通","走马观花","蜻蜓点水","浮光掠影"],"answer":2,"optionReasons":{"融会贯通":"该词通常表示“融会：融合。贯通：全面透彻地了解。指把各方面的知识、道理融合贯穿，从而获得对事物全面、透彻地理解和领悟。（侧重融合）”，侧重点是“形容学到一点就能推知更多”。题干则着重““接触表面、研究不深入””，语义指向不同。","走马观花":"该词通常表示“走马：骑马快跑。比喻观察事物或者了解情况不深入细致。（侧重于用眼看具体事物的过程）（一般不形容读书）”，侧重点是“印象和效果”。题干则着重““接触表面、研究不深入””，语义指向不同。","浮光掠影":"该词通常表示“浮光：水面上的反光。掠影：一闪而过的影子。比喻因事物很快消逝而使人对它的印象不深。（侧重抽象语境）”，侧重点是“印象和效果”。题干则着重““接触表面、研究不深入””，语义指向不同。"}},{"id":"Q026","word":"融会贯通","level":"S","group":"第12组","category":"印象和效果","stem":"学完统计、编程和经济学以后，他能将三门知识联系起来分析社会现象，真正做到了____。","clue":"“不同知识融合起来并透彻理解”","options":["触类旁通","举一反三","蜻蜓点水","融会贯通"],"answer":3,"optionReasons":{"触类旁通":"该词表示“触：接触。通：通晓。指掌握了某一事物的规律或知识，就能够以此类推，了解同类的其他事物。（侧重于抽象的思维层面。）（侧重类推）”。虽然可能与正确词相近，但这道题的关键信息是““不同知识融合起来并透彻理解””，仍以“融会贯通”更贴合。","举一反三":"该词通常表示“反：类推，推论。指举出一件事，就可以触类旁通，类推出许多同类事物来。（侧重于具象的事物层面。）（侧重类推）”，侧重点是“印象和效果”。题干则着重““不同知识融合起来并透彻理解””，语义指向不同。","蜻蜓点水":"该词通常表示“比喻进行某些动作时只轻轻接触表面。也比喻肤浅不深入”，侧重点是“形容学习粗浅”。题干则着重““不同知识融合起来并透彻理解””，语义指向不同。"}},{"id":"Q027","word":"相得益彰","level":"S","group":"第13组","category":"搭档配合","stem":"传统园林的空间美感和现代灯光的精细设计彼此衬托，让夜游体验更加出色，二者____。","clue":"“两方结合后各自优势更明显”","options":["相辅相成","交相辉映","相得益彰","珠联璧合"],"answer":2,"optionReasons":{"相辅相成":"该词表示“辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可”。虽然可能与正确词相近，但这道题的关键信息是““两方结合后各自优势更明显””，仍以“相得益彰”更贴合。","交相辉映":"该词通常表示“各种光亮、色彩相互照耀、映射。常用语形容美好的景象”，侧重点是“二者都好”。题干则着重““两方结合后各自优势更明显””，语义指向不同。","珠联璧合":"该词表示“珠联：像珍珠一样串在一起。璧合：像碧玉一样合在一起。原指一种日月重合、五星相联的天相。后多比喻美好的人及事物凑在一起。同“珠连璧”。虽然可能与正确词相近，但这道题的关键信息是““两方结合后各自优势更明显””，仍以“相得益彰”更贴合。"}},{"id":"Q028","word":"相辅相成","level":"S","group":"第13组","category":"搭档配合","stem":"提升服务效率需要技术创新，也离不开流程优化，二者彼此促进、缺一不可，应当____。","clue":"“相互帮助、相互促进，缺一不可”","options":["相辅相成","相得益彰","交相辉映","珠联璧合"],"answer":0,"optionReasons":{"相得益彰":"该词表示“相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来”。虽然可能与正确词相近，但这道题的关键信息是““相互帮助、相互促进，缺一不可””，仍以“相辅相成”更贴合。","交相辉映":"该词通常表示“各种光亮、色彩相互照耀、映射。常用语形容美好的景象”，侧重点是“二者都好”。题干则着重““相互帮助、相互促进，缺一不可””，语义指向不同。","珠联璧合":"该词表示“珠联：像珍珠一样串在一起。璧合：像碧玉一样合在一起。原指一种日月重合、五星相联的天相。后多比喻美好的人及事物凑在一起。同“珠连璧”。虽然可能与正确词相近，但这道题的关键信息是““相互帮助、相互促进，缺一不可””，仍以“相辅相成”更贴合。"}},{"id":"Q029","word":"南辕北辙","level":"S","group":"第15组","category":"错误抉择和方向","stem":"政策本想减轻企业负担，却设计出更多重复审批环节，实际措施与既定目标____。","clue":"“行动方向与目标完全相反”","options":["舍本逐末","缘木求鱼","背道而驰","南辕北辙"],"answer":3,"optionReasons":{"舍本逐末":"该词通常表示“舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置”，侧重点是“错误抉择”。题干则着重““行动方向与目标完全相反””，语义指向不同。","缘木求鱼":"该词表示“缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）”。虽然可能与正确词相近，但这道题的关键信息是““行动方向与目标完全相反””，仍以“南辕北辙”更贴合。","背道而驰":"该词通常表示“背：逆着。道：道路。向着相反的道路奔驰。比喻彼此方向目标完全相反。也比喻背离正确的目标，朝相反的方向走”，侧重点是“错误抉择和方向”。题干则着重““行动方向与目标完全相反””，语义指向不同。"}},{"id":"Q030","word":"缘木求鱼","level":"S","group":"第15组","category":"错误抉择和方向","stem":"治堵只增加道路宽度，却不改善公共交通与出行结构，想从根本上缓解拥堵恐怕是____。","clue":"“达到目标的方法方向错误”","options":["缘木求鱼","削足适履","舍本逐末","南辕北辙"],"answer":0,"optionReasons":{"削足适履":"该词通常表示“履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套”，侧重点是“错误做法”。题干则着重““达到目标的方法方向错误””，语义指向不同。","舍本逐末":"该词通常表示“舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置”，侧重点是“错误抉择”。题干则着重““达到目标的方法方向错误””，语义指向不同。","南辕北辙":"该词表示“辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标”。虽然可能与正确词相近，但这道题的关键信息是““达到目标的方法方向错误””，仍以“缘木求鱼”更贴合。"}},{"id":"Q031","word":"舍本逐末","level":"S","group":"第15组","category":"错误抉择和方向","stem":"课堂改革如果只追求花哨的演示效果，却忽略学生是否真正理解知识，便是____。","clue":"“抛开根本、追逐枝节”","options":["南辕北辙","缘木求鱼","舍本逐末","喧宾夺主"],"answer":2,"optionReasons":{"南辕北辙":"该词通常表示“辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标”，侧重点是“相悖、相反”。题干则着重““抛开根本、追逐枝节””，语义指向不同。","缘木求鱼":"该词通常表示“缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）”，侧重点是“相悖、相反”。题干则着重““抛开根本、追逐枝节””，语义指向不同。","喧宾夺主":"该词表示“喧：吵吵嚷嚷。客人的声音压倒了主人的声音。比喻外来的或次要的事物占据了原有的或主要的事物的位置”。虽然可能与正确词相近，但这道题的关键信息是““抛开根本、追逐枝节””，仍以“舍本逐末”更贴合。"}},{"id":"Q032","word":"削足适履","level":"S","group":"第16组","category":"错误做法（寓言故事）","stem":"各地资源条件差异明显，若强令所有地区照搬同一种产业模式，无异于____。","clue":"“不顾实际条件、生搬硬套”","options":["越俎代庖","拔苗助长","削足适履","邯郸学步"],"answer":2,"optionReasons":{"越俎代庖":"该词表示“越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情”。虽然可能与正确词相近，但这道题的关键信息是““不顾实际条件、生搬硬套””，仍以“削足适履”更贴合。","拔苗助长":"该词表示“用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长””。虽然可能与正确词相近，但这道题的关键信息是““不顾实际条件、生搬硬套””，仍以“削足适履”更贴合。","邯郸学步":"该词表示“比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了”。虽然可能与正确词相近，但这道题的关键信息是““不顾实际条件、生搬硬套””，仍以“削足适履”更贴合。"}},{"id":"Q033","word":"越俎代庖","level":"S","group":"第16组","category":"错误做法（寓言故事）","stem":"本应由专业技术人员独立判断的方案，行政部门却越过职责边界直接指定参数，属于____。","clue":"“超越自己的职权替别人办事”","options":["越俎代庖","拔苗助长","削足适履","邯郸学步"],"answer":0,"optionReasons":{"拔苗助长":"该词表示“用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长””。虽然可能与正确词相近，但这道题的关键信息是““超越自己的职权替别人办事””，仍以“越俎代庖”更贴合。","削足适履":"该词表示“履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套”。虽然可能与正确词相近，但这道题的关键信息是““超越自己的职权替别人办事””，仍以“越俎代庖”更贴合。","邯郸学步":"该词表示“比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了”。虽然可能与正确词相近，但这道题的关键信息是““超越自己的职权替别人办事””，仍以“越俎代庖”更贴合。"}},{"id":"Q034","word":"潜移默化","level":"S","group":"第17组","category":"教育影响批评","stem":"每天接触有秩序的公共环境，居民逐渐养成文明排队的习惯，改变在____中发生。","clue":"“长期、无声、渐渐影响人的行为”","options":["耳濡目染","醍醐灌顶","循循善诱","潜移默化"],"answer":3,"optionReasons":{"耳濡目染":"该词表示“濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）”。虽然可能与正确词相近，但这道题的关键信息是““长期、无声、渐渐影响人的行为””，仍以“潜移默化”更贴合。","醍醐灌顶":"该词通常表示“醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快”，侧重点是“醒悟、唤醒”。题干则着重““长期、无声、渐渐影响人的行为””，语义指向不同。","循循善诱":"该词通常表示“循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法”，侧重点是“教育和批评”。题干则着重““长期、无声、渐渐影响人的行为””，语义指向不同。"}},{"id":"Q035","word":"耳濡目染","level":"S","group":"第17组","category":"教育影响批评","stem":"她从小常看父亲修复古籍、听母亲讲文物故事，在家庭环境的____下对文化保护产生兴趣。","clue":"“长期经常看见听见而受影响”","options":["耳濡目染","醍醐灌顶","循循善诱","潜移默化"],"answer":0,"optionReasons":{"醍醐灌顶":"该词通常表示“醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快”，侧重点是“醒悟、唤醒”。题干则着重““长期经常看见听见而受影响””，语义指向不同。","循循善诱":"该词通常表示“循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法”，侧重点是“教育和批评”。题干则着重““长期经常看见听见而受影响””，语义指向不同。","潜移默化":"该词表示“潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）”。虽然可能与正确词相近，但这道题的关键信息是““长期经常看见听见而受影响””，仍以“耳濡目染”更贴合。"}},{"id":"Q036","word":"醍醐灌顶","level":"S","group":"第17组","category":"教育影响批评","stem":"老师用一个简单的反例点明推理漏洞，他才猛然醒悟，顿觉____。","clue":"“一个点拨使人豁然醒悟”","options":["循循善诱","潜移默化","醍醐灌顶","耳濡目染"],"answer":2,"optionReasons":{"循循善诱":"该词通常表示“循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法”，侧重点是“教育和批评”。题干则着重““一个点拨使人豁然醒悟””，语义指向不同。","潜移默化":"该词通常表示“潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）”，侧重点是“影响感化”。题干则着重““一个点拨使人豁然醒悟””，语义指向不同。","耳濡目染":"该词通常表示“濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）”，侧重点是“影响感化”。题干则着重““一个点拨使人豁然醒悟””，语义指向不同。"}},{"id":"Q037","word":"心无旁骛","level":"S","group":"第18组","category":"工作学习状态","stem":"攻关期间，他关闭社交软件，把全部精力都放在关键实验上，真正做到了____。","clue":"“不分心、专注唯一目标”","options":["心无旁骛","殚精竭虑","废寝忘食","孜孜不倦"],"answer":0,"optionReasons":{"殚精竭虑":"该词表示“殚：竭尽。用尽精力和心思”。虽然可能与正确词相近，但这道题的关键信息是““不分心、专注唯一目标””，仍以“心无旁骛”更贴合。","废寝忘食":"该词表示“顾不上睡觉，忘记了吃饭。形容对某事专心致志”。虽然可能与正确词相近，但这道题的关键信息是““不分心、专注唯一目标””，仍以“心无旁骛”更贴合。","孜孜不倦":"该词通常表示“孜孜：勤奋的样子。形容勤奋、不知疲倦”，侧重点是“勤勉不懈怠”。题干则着重““不分心、专注唯一目标””，语义指向不同。"}},{"id":"Q038","word":"殚精竭虑","level":"S","group":"第18组","category":"工作学习状态","stem":"为了找到既安全又经济的解决方案，研究团队反复验证数百种组合，几乎____。","clue":"“耗尽精力与心思”","options":["心无旁骛","殚精竭虑","筚路蓝缕","呕心沥血"],"answer":1,"optionReasons":{"心无旁骛":"该词表示“旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志”。虽然可能与正确词相近，但这道题的关键信息是““耗尽精力与心思””，仍以“殚精竭虑”更贴合。","筚路蓝缕":"该词通常表示“筚路：柴车。蓝缕：又旧又破的衣服。意思是驾着柴车穿着破旧衣服去开辟山林。现用来形容创业的艰难与辛苦。也作“荜路蓝缕”。（词义有拓”，侧重点是“辛苦奔波”。题干则着重““耗尽精力与心思””，语义指向不同。","呕心沥血":"该词表示“呕：吐。沥：滴。形容费尽心思”。虽然可能与正确词相近，但这道题的关键信息是““耗尽精力与心思””，仍以“殚精竭虑”更贴合。"}},{"id":"Q039","word":"筚路蓝缕","level":"S","group":"第18组","category":"工作学习状态","stem":"早期建设者靠简陋工具在荒地上开辟科研基地，回望这段____的创业历程令人敬佩。","clue":"“创业开拓条件艰苦”","options":["心无旁骛","殚精竭虑","呕心沥血","筚路蓝缕"],"answer":3,"optionReasons":{"心无旁骛":"该词通常表示“旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志”，侧重点是“尽心钻研学习”。题干则着重““创业开拓条件艰苦””，语义指向不同。","殚精竭虑":"该词通常表示“殚：竭尽。用尽精力和心思”，侧重点是“尽心钻研学习”。题干则着重““创业开拓条件艰苦””，语义指向不同。","呕心沥血":"该词通常表示“呕：吐。沥：滴。形容费尽心思”，侧重点是“尽心钻研学习”。题干则着重““创业开拓条件艰苦””，语义指向不同。"}},{"id":"Q040","word":"提纲挈领","level":"S","group":"第19组","category":"正确做法","stem":"向新员工讲述复杂业务流程时，负责人先列出最核心的三个环节，讲解便____。","clue":"“抓住要点、简洁统领全局”","options":["纲举目张","义不容辞","博采众长","提纲挈领"],"answer":3,"optionReasons":{"纲举目张":"该词表示“指提起大网的总绳一撒，所有的网眼就都张开。比喻抓住事物的主要环节，就可带动一切”。虽然可能与正确词相近，但这道题的关键信息是““抓住要点、简洁统领全局””，仍以“提纲挈领”更贴合。","义不容辞":"该词通常表示“义：道义。辞：推辞。道义上不容许推辞。指理应接受。（侧重良心、道义上）”，侧重点是“勇于承担责任义务”。题干则着重““抓住要点、简洁统领全局””，语义指向不同。","博采众长":"该词通常表示“博采：广泛搜集采纳。从多方面吸取各家的长处”，侧重点是“向他人学习”。题干则着重““抓住要点、简洁统领全局””，语义指向不同。"}},{"id":"Q041","word":"纲举目张","level":"S","group":"第19组","category":"正确做法","stem":"只要建立清晰的责任体系和评价标准，后续各项工作就能顺势展开，达到____的效果。","clue":"“抓住主要环节从而带动其他”","options":["义不容辞","提纲挈领","博采众长","纲举目张"],"answer":3,"optionReasons":{"义不容辞":"该词通常表示“义：道义。辞：推辞。道义上不容许推辞。指理应接受。（侧重良心、道义上）”，侧重点是“勇于承担责任义务”。题干则着重““抓住主要环节从而带动其他””，语义指向不同。","提纲挈领":"该词表示“意思是抓住事物的关键部分或者核心要点，然后用简洁明了的方式进行概述或表达”。虽然可能与正确词相近，但这道题的关键信息是““抓住主要环节从而带动其他””，仍以“纲举目张”更贴合。","博采众长":"该词通常表示“博采：广泛搜集采纳。从多方面吸取各家的长处”，侧重点是“向他人学习”。题干则着重““抓住主要环节从而带动其他””，语义指向不同。"}},{"id":"Q042","word":"于事无补","level":"S","group":"第20组","category":"错误做法","stem":"系统已经发生数据丢失，此时互相指责____，当务之急是启动备份恢复。","clue":"“某种行为对解决眼前问题没有帮助”","options":["于事无补","过犹不及","有恃无恐","临渊羡鱼"],"answer":0,"optionReasons":{"过犹不及":"该词表示“过：过分。不及：不够。事情做得过了头，就跟做得不够一样，都不合适”。虽然可能与正确词相近，但这道题的关键信息是““某种行为对解决眼前问题没有帮助””，仍以“于事无补”更贴合。","有恃无恐":"该词表示“因有所依仗而毫不害怕”。虽然可能与正确词相近，但这道题的关键信息是““某种行为对解决眼前问题没有帮助””，仍以“于事无补”更贴合。","临渊羡鱼":"该词表示“比喻有欲望想得到某种东西，但却没有实际行动”。虽然可能与正确词相近，但这道题的关键信息是““某种行为对解决眼前问题没有帮助””，仍以“于事无补”更贴合。"}},{"id":"Q043","word":"过犹不及","level":"S","group":"第20组","category":"错误做法","stem":"孩子需要适当引导，但家长若事事包办、管得太多，反倒限制独立能力，可谓____。","clue":"“过度与不足同样不合适”","options":["矫枉过正","因噎废食","因小失大","过犹不及"],"answer":3,"optionReasons":{"矫枉过正":"该词通常表示“矫枉：矫正弯曲。指纠正偏失错误，超过了应有的限度”，侧重点是“错误做法”。题干则着重““过度与不足同样不合适””，语义指向不同。","因噎废食":"该词通常表示“废：停止。比喻因为碰到挫折，连该做的事情也不做了”，侧重点是“错误抉择和方向”。题干则着重““过度与不足同样不合适””，语义指向不同。","因小失大":"该词通常表示“因：为了。指为了小的利益造成大的损失”，侧重点是“错误抉择”。题干则着重““过度与不足同样不合适””，语义指向不同。"}},{"id":"Q044","word":"亦步亦趋","level":"S","group":"第21组","category":"某些国家的错误做法","stem":"这家企业研发从不提出独立思路，只是别人发布什么产品它就立刻模仿，长期____。","clue":"“缺乏主见地跟随别人行动”","options":["坐享其成","袖手旁观","以邻为壑","亦步亦趋"],"answer":3,"optionReasons":{"坐享其成":"该词通常表示“意思为自己不出力而享受别人取得的成果”，侧重点是“旁观、得利”。题干则着重““缺乏主见地跟随别人行动””，语义指向不同。","袖手旁观":"该词通常表示“袖手：把手揣在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）”，侧重点是“旁观、得利”。题干则着重““缺乏主见地跟随别人行动””，语义指向不同。","以邻为壑":"该词表示“壑：深沟。意为把邻国当成排洪水的沟壑。后用来比喻把困难、灾祸推给别人。（多宏观语境，国家、城市、地区等）”。虽然可能与正确词相近，但这道题的关键信息是““缺乏主见地跟随别人行动””，仍以“亦步亦趋”更贴合。"}},{"id":"Q045","word":"以邻为壑","level":"S","group":"第21组","category":"某些国家的错误做法","stem":"上游地区只顾自己排涝，把洪水压力全部转嫁给下游，这种____的做法损害区域合作。","clue":"“把本地困难灾祸转嫁给邻近地区”","options":["独善其身","坐收渔利","以邻为壑","袖手旁观"],"answer":2,"optionReasons":{"独善其身":"该词通常表示“意思是不得志时也要注意自身的修养。后指只顾保持自身修养而不顾他人或全局。（语境要素：个人与外部的对比、保全保护）”，侧重点是“只顾自己、自扫门前雪”。题干则着重““把本地困难灾祸转嫁给邻近地区””，语义指向不同。","坐收渔利":"该词通常表示“比喻利用别人的矛盾而从中获利”，侧重点是“旁观、得利”。题干则着重““把本地困难灾祸转嫁给邻近地区””，语义指向不同。","袖手旁观":"该词通常表示“袖手：把手揣在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）”，侧重点是“旁观、得利”。题干则着重““把本地困难灾祸转嫁给邻近地区””，语义指向不同。"}},{"id":"Q046","word":"袖手旁观","level":"S","group":"第21组","category":"某些国家的错误做法","stem":"面对邻居突发的火情，几位路人明明可以呼救协助却始终____。","clue":"“旁观而不提供帮助”","options":["置身事外","袖手旁观","隔岸观火","坐收渔利"],"answer":1,"optionReasons":{"置身事外":"该词表示“置：安放。把自己放在事情之外。形容毫不关心”。虽然可能与正确词相近，但这道题的关键信息是““旁观而不提供帮助””，仍以“袖手旁观”更贴合。","隔岸观火":"该词表示“指站在对岸观望火灾；用来比喻对别人的急难不加救助，而采取看热闹的态度”。虽然可能与正确词相近，但这道题的关键信息是““旁观而不提供帮助””，仍以“袖手旁观”更贴合。","坐收渔利":"该词表示“比喻利用别人的矛盾而从中获利”。虽然可能与正确词相近，但这道题的关键信息是““旁观而不提供帮助””，仍以“袖手旁观”更贴合。"}},{"id":"Q047","word":"因势利导","level":"S","group":"第24组","category":"政府优秀做法","stem":"面对新技术带来的就业变化，政府没有简单禁止，而是顺着行业发展趋势提供培训、加强引导，体现了____。","clue":"“顺着已存在的趋势加以积极引导”","options":["因势利导","顺水推舟","因地制宜","顺势而为"],"answer":0,"optionReasons":{"顺水推舟":"该词通常表示“舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事”，侧重点是“造势”。题干则着重““顺着已存在的趋势加以积极引导””，语义指向不同。","因地制宜":"该词通常表示“根据不同地方的基本情况，制定相应的办法”，侧重点是“政府优秀做法”。题干则着重““顺着已存在的趋势加以积极引导””，语义指向不同。","顺势而为":"该词通常表示“顺应形势做事情”，侧重点是“顺势”。题干则着重““顺着已存在的趋势加以积极引导””，语义指向不同。"}},{"id":"Q048","word":"正本清源","level":"S","group":"第24组","category":"政府优秀做法","stem":"治理虚假信息不能只删除个别帖子，还要从传播机制和利益链源头整顿，真正做到____。","clue":"“从根本上整顿、从源头清理”","options":["正本清源","对症下药","标本兼治","扬汤止沸"],"answer":0,"optionReasons":{"对症下药":"该词通常表示“医生针对病症开方用药。比喻针对问题所在确定解决方法”，侧重点是“政府优秀做法”。题干则着重““从根本上整顿、从源头清理””，语义指向不同。","标本兼治":"该词通常表示“标本：事物的枝节和根本。从枝节和根本方面都得到治理”，侧重点是“解决问题”。题干则着重““从根本上整顿、从源头清理””，语义指向不同。","扬汤止沸":"该词通常表示“把开水从锅中舀出来，再倒回去，以阻止锅中的水沸腾。比喻不能解决根本问题的做法”，侧重点是“错误做法”。题干则着重““从根本上整顿、从源头清理””，语义指向不同。"}},{"id":"Q049","word":"量体裁衣","level":"S","group":"第24组","category":"政府优秀做法","stem":"为不同规模企业制定扶持方案，必须根据其经营状况和实际需求____，不能统一套用标准。","clue":"“依据具体对象的条件量身制定方案”","options":["因势利导","对症下药","量体裁衣","因地制宜"],"answer":2,"optionReasons":{"因势利导":"该词通常表示“因：顺着。势：趋势。利导：引导。指顺着事物的发展趋势而加以引导。（褒义）”，侧重点是“发挥职能”。题干则着重““依据具体对象的条件量身制定方案””，语义指向不同。","对症下药":"该词通常表示“医生针对病症开方用药。比喻针对问题所在确定解决方法”，侧重点是“政府优秀做法”。题干则着重““依据具体对象的条件量身制定方案””，语义指向不同。","因地制宜":"该词通常表示“根据不同地方的基本情况，制定相应的办法”，侧重点是“政府优秀做法”。题干则着重““依据具体对象的条件量身制定方案””，语义指向不同。"}},{"id":"Q050","word":"一蹴而就","level":"S","group":"第26组","category":"政策措施的评价","stem":"完善基层治理需要长期磨合，不可能靠一次会议就____。","clue":"“一步就成功，常用于否定句”","options":["循序渐进","一蹴而就","功亏一篑","纸上谈兵"],"answer":1,"optionReasons":{"循序渐进":"该词通常表示“循：顺，按照。序：次序。指事物的发展或学习工作等按照一定的步骤逐渐深入或提高”，侧重点是“按规矩办事”。题干则着重““一步就成功，常用于否定句””，语义指向不同。","功亏一篑":"该词通常表示“篑：盛土的筐，指一筐土。后用来比喻做事情只差最后一点而前功尽弃”，侧重点是“没能成功”。题干则着重““一步就成功，常用于否定句””，语义指向不同。","纸上谈兵":"该词通常表示“兵：用兵之道。比喻空谈理论，不能解决实际问题。（侧重只有理论而没有行动）”，侧重点是“不靠谱的做法”。题干则着重““一步就成功，常用于否定句””，语义指向不同。"}},{"id":"Q051","word":"标本兼治","level":"S","group":"第26组","category":"政策措施的评价","stem":"整治河流污染既要清理现有垃圾，又要从源头控制排放，才能做到____。","clue":"“同时治理表面症状和根本原因”","options":["标本兼治","迎刃而解","一蹴而就","一劳永逸"],"answer":0,"optionReasons":{"迎刃而解":"该词表示“刃：刀刃。解：分开。把竹子劈开口，下面的一段竹子就迎着刀刃裂开了。比喻主要问题解决了，其他的问题就很容易解决。（常搭配“问题”）”。虽然可能与正确词相近，但这道题的关键信息是““同时治理表面症状和根本原因””，仍以“标本兼治”更贴合。","一蹴而就":"该词通常表示“蹴：踏；就：成功。踏一步就可以获得成功，比喻事情很容易做。同“一蹴而得”。（多用于否定句中）”，侧重点是“有效果”。题干则着重““同时治理表面症状和根本原因””，语义指向不同。","一劳永逸":"该词通常表示“逸：安逸。指辛苦一次把事情办好，以后就不用费力了”，侧重点是“政策措施的评价”。题干则着重““同时治理表面症状和根本原因””，语义指向不同。"}},{"id":"Q052","word":"迎刃而解","level":"S","group":"第26组","category":"政策措施的评价","stem":"一旦找到网络故障的根本原因，后续看似棘手的连接问题便会____。","clue":"“关键解决后，其余问题很容易化解”","options":["一蹴而就","一劳永逸","标本兼治","迎刃而解"],"answer":3,"optionReasons":{"一蹴而就":"该词通常表示“蹴：踏；就：成功。踏一步就可以获得成功，比喻事情很容易做。同“一蹴而得”。（多用于否定句中）”，侧重点是“有效果”。题干则着重““关键解决后，其余问题很容易化解””，语义指向不同。","一劳永逸":"该词通常表示“逸：安逸。指辛苦一次把事情办好，以后就不用费力了”，侧重点是“政策措施的评价”。题干则着重““关键解决后，其余问题很容易化解””，语义指向不同。","标本兼治":"该词表示“标本：事物的枝节和根本。从枝节和根本方面都得到治理”。虽然可能与正确词相近，但这道题的关键信息是““关键解决后，其余问题很容易化解””，仍以“迎刃而解”更贴合。"}},{"id":"Q053","word":"一筹莫展","level":"S","group":"第27组","category":"成功与失败","stem":"面对从未见过的技术故障，各种常规排查方法都失效，团队一时____。","clue":"“毫无办法、计策施展不出”","options":["一筹莫展","爱莫能助","束手无策","回天乏术"],"answer":0,"optionReasons":{"爱莫能助":"该词通常表示“爱：爱惜；莫：不。虽然心中关切同情，却没有力量帮助”，侧重点是“能力有限”。题干则着重““毫无办法、计策施展不出””，语义指向不同。","束手无策":"该词通常表示“策：办法。手被捆住，无法应对。形容遇到问题没有解决的办法”，侧重点是“成功与失败”。题干则着重““毫无办法、计策施展不出””，语义指向不同。","回天乏术":"该词通常表示“回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救”，侧重点是“能力有限”。题干则着重““毫无办法、计策施展不出””，语义指向不同。"}},{"id":"Q054","word":"功亏一篑","level":"S","group":"第27组","category":"成功与失败","stem":"研发项目已经通过所有测试，却在提交前因备份失误丢失核心数据，最终____。","clue":"“仅差最后一步而前功尽弃”","options":["失之交臂","一筹莫展","一蹴而就","功亏一篑"],"answer":3,"optionReasons":{"失之交臂":"该词表示“交臂：胳膊碰胳膊，指擦肩而过。形容当面错过”。虽然可能与正确词相近，但这道题的关键信息是““仅差最后一步而前功尽弃””，仍以“功亏一篑”更贴合。","一筹莫展":"该词表示“筹：计策。展：施展。一点计策也施展不出。形容没有一点办法”。虽然可能与正确词相近，但这道题的关键信息是““仅差最后一步而前功尽弃””，仍以“功亏一篑”更贴合。","一蹴而就":"该词通常表示“蹴：踏；就：成功。踏一步就可以获得成功，比喻事情很容易做。同“一蹴而得”。（多用于否定句中）”，侧重点是“有效果”。题干则着重““仅差最后一步而前功尽弃””，语义指向不同。"}},{"id":"Q055","word":"一以贯之","level":"S","group":"第28组","category":"领导力","stem":"从青年时期到退休以后，这位医生始终坚持以患者需求为中心，把同一信念____。","clue":"“从始至终坚持同一原则”","options":["深谋远虑","以身作则","高瞻远瞩","一以贯之"],"answer":3,"optionReasons":{"深谋远虑":"该词通常表示“计谋深远，考虑周密”，侧重点是“眼界高考虑全”。题干则着重““从始至终坚持同一原则””，语义指向不同。","以身作则":"该词通常表示“身：自身。则：榜样。自己以行动给大家做出榜样”，侧重点是“以身作则”。题干则着重““从始至终坚持同一原则””，语义指向不同。","高瞻远瞩":"该词通常表示“瞻：望。瞩：注视。登高望远。形容目光远大。（更宏观）”，侧重点是“眼界高考虑全”。题干则着重““从始至终坚持同一原则””，语义指向不同。"}},{"id":"Q056","word":"深谋远虑","level":"S","group":"第28组","category":"领导力","stem":"面对产业链可能出现的长期风险，决策者提前布局基础研究，展现出____的战略考虑。","clue":"“考虑深远且安排周密”","options":["深谋远虑","高瞻远瞩","运筹帷幄","审时度势"],"answer":0,"optionReasons":{"高瞻远瞩":"该词表示“瞻：望。瞩：注视。登高望远。形容目光远大。（更宏观）”。虽然可能与正确词相近，但这道题的关键信息是““考虑深远且安排周密””，仍以“深谋远虑”更贴合。","运筹帷幄":"该词通常表示“筹：谋划。帷幄：古代军队中的帐幕。指在帐幕中谋划计策。后指在后方指挥、筹划”，侧重点是“筹划全面”。题干则着重““考虑深远且安排周密””，语义指向不同。","审时度势":"该词通常表示“审：详查，观察。时：当前情况。度：估计。势：发展趋势。观察时机，估计发展趋势。用来指对形势有洞察力。也作“审时定势”“审几度势””，侧重点是“领导力”。题干则着重““考虑深远且安排周密””，语义指向不同。"}},{"id":"Q057","word":"高瞻远瞩","level":"S","group":"第28组","category":"领导力","stem":"规划城市交通不能只看眼下车流，更要考虑未来几十年的空间结构，需要____的眼光。","clue":"“视野开阔、眼光长远”","options":["深谋远虑","统筹兼顾","高瞻远瞩","运筹帷幄"],"answer":2,"optionReasons":{"深谋远虑":"该词表示“计谋深远，考虑周密”。虽然可能与正确词相近，但这道题的关键信息是““视野开阔、眼光长远””，仍以“高瞻远瞩”更贴合。","统筹兼顾":"该词通常表示“意思是统一筹划，全面照顾”，侧重点是“领导力”。题干则着重““视野开阔、眼光长远””，语义指向不同。","运筹帷幄":"该词通常表示“筹：谋划。帷幄：古代军队中的帐幕。指在帐幕中谋划计策。后指在后方指挥、筹划”，侧重点是“筹划全面”。题干则着重““视野开阔、眼光长远””，语义指向不同。"}},{"id":"Q058","word":"好大喜功","level":"S","group":"第30组","category":"干部易犯错误","stem":"某些地方不顾财政承受能力，热衷铺摊子、造声势，只为显出政绩，是典型的____。","clue":"“不务实、喜欢做大事邀功”","options":["好高骛远","好大喜功","哗众取宠","沽名钓誉"],"answer":1,"optionReasons":{"好高骛远":"该词通常表示“骛：通“务”，追求。指不切实际地追求过高、过远的目标”，侧重点是“干部易犯错误”。题干则着重““不务实、喜欢做大事邀功””，语义指向不同。","哗众取宠":"该词通常表示“用浮夸的言词或做作的行动去迎合群众，以博取好感和支持”，侧重点是“其他错误”。题干则着重““不务实、喜欢做大事邀功””，语义指向不同。","沽名钓誉":"该词表示“比喻故意矫情做作，用手段猎取名声或赞誉”。虽然可能与正确词相近，但这道题的关键信息是““不务实、喜欢做大事邀功””，仍以“好大喜功”更贴合。"}},{"id":"Q059","word":"敷衍塞责","level":"S","group":"第30组","category":"干部易犯错误","stem":"面对群众反映的问题，工作人员只发一份模板回复便草草结案，这种____必须纠正。","clue":"“马虎应付以搪塞责任”","options":["大而化之","敷衍塞责","好大喜功","明哲保身"],"answer":1,"optionReasons":{"大而化之":"该词通常表示“化：感化。原指把真诚、善良、完美的品德发扬光大，使人的思想品德得以完美。后用来形容做事大大咧咧，不谨慎，不细致”，侧重点是“干部易犯错误”。题干则着重““马虎应付以搪塞责任””，语义指向不同。","好大喜功":"该词通常表示“喜欢做大事、立大功。多形容浮夸、不切实际的行为”，侧重点是“爱慕名利不务实”。题干则着重““马虎应付以搪塞责任””，语义指向不同。","明哲保身":"该词通常表示“明哲：聪明有智慧。指聪明有智慧之人，善于趋安避危，保全自身。也指为保全个人利益而回避原则问题的处世态度”，侧重点是“只顾自己、自扫门前雪”。题干则着重““马虎应付以搪塞责任””，语义指向不同。"}},{"id":"Q060","word":"明哲保身","level":"S","group":"第30组","category":"干部易犯错误","stem":"讨论公共安全隐患时，他明知问题严重，却因怕得罪人而保持沉默，只求____。","clue":"“为保护个人利益回避原则问题”","options":["敷衍塞责","明哲保身","袖手旁观","独善其身"],"answer":1,"optionReasons":{"敷衍塞责":"该词通常表示“敷衍：马虎应付。塞责：搪塞责任。做事马虎，应付一下以搪塞责任”，侧重点是“虚伪敷衍谄媚”。题干则着重““为保护个人利益回避原则问题””，语义指向不同。","袖手旁观":"该词通常表示“袖手：把手揣在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）”，侧重点是“旁观、得利”。题干则着重““为保护个人利益回避原则问题””，语义指向不同。","独善其身":"该词表示“意思是不得志时也要注意自身的修养。后指只顾保持自身修养而不顾他人或全局。（语境要素：个人与外部的对比、保全保护）”。虽然可能与正确词相近，但这道题的关键信息是““为保护个人利益回避原则问题””，仍以“明哲保身”更贴合。"}},{"id":"Q061","word":"文过饰非","level":"S","group":"第31组","category":"对待错误的态度","stem":"出现管理失误后，负责人没有承认错误，反而用漂亮话掩饰责任，试图____。","clue":"“用言辞掩盖自身过错”","options":["文过饰非","敷衍塞责","欲盖弥彰","改头换面"],"answer":0,"optionReasons":{"敷衍塞责":"该词通常表示“敷衍：马虎应付。塞责：搪塞责任。做事马虎，应付一下以搪塞责任”，侧重点是“虚伪敷衍谄媚”。题干则着重““用言辞掩盖自身过错””，语义指向不同。","欲盖弥彰":"该词表示“盖：遮掩；弥：更加；彰：明显。想掩盖坏事的真相，结果反而更明显地暴露出来”。虽然可能与正确词相近，但这道题的关键信息是““用言辞掩盖自身过错””，仍以“文过饰非”更贴合。","改头换面":"该词通常表示“①原为佛教语。指众生在轮回中形变神不变。②指改变面目。③指改正错误。④比喻只改变形式，而内容、实质不变”，侧重点是“彻底改变”。题干则着重““用言辞掩盖自身过错””，语义指向不同。"}},{"id":"Q062","word":"欲盖弥彰","level":"S","group":"第31组","category":"对待错误的态度","stem":"企业越是删除公开记录、阻止记者提问，越让公众怀疑其存在问题，真是____。","clue":"“掩盖真相反而暴露得更明显”","options":["文过饰非","欲盖弥彰","闻过则喜","从谏如流"],"answer":1,"optionReasons":{"文过饰非":"该词表示“文、饰：掩饰；过、非：错误。用漂亮的言辞掩饰自己的过失和错误”。虽然可能与正确词相近，但这道题的关键信息是““掩盖真相反而暴露得更明显””，仍以“欲盖弥彰”更贴合。","闻过则喜":"该词通常表示“过：过失；则：就。听到别人批评自己的缺点或错误，表示欢迎和高兴。指虚心接受意见”，侧重点是“谦虚接受建议”。题干则着重““掩盖真相反而暴露得更明显””，语义指向不同。","从谏如流":"该词通常表示“谏：直言规劝。听从规劝像流水一样自然。形容乐于接受别人的批评意见”，侧重点是“谦虚接受建议”。题干则着重““掩盖真相反而暴露得更明显””，语义指向不同。"}},{"id":"Q063","word":"闻过则喜","level":"S","group":"第31组","category":"对待错误的态度","stem":"面对同事的尖锐批评，他不仅没有不悦，反而认真感谢并改进，做到了____。","clue":"“听到别人指出错误反而高兴”","options":["文过饰非","从谏如流","闻过则喜","固执己见"],"answer":2,"optionReasons":{"文过饰非":"该词通常表示“文、饰：掩饰；过、非：错误。用漂亮的言辞掩饰自己的过失和错误”，侧重点是“遮掩错误”。题干则着重““听到别人指出错误反而高兴””，语义指向不同。","从谏如流":"该词表示“谏：直言规劝。听从规劝像流水一样自然。形容乐于接受别人的批评意见”。虽然可能与正确词相近，但这道题的关键信息是““听到别人指出错误反而高兴””，仍以“闻过则喜”更贴合。","固执己见":"该词通常表示“顽固地坚持自己的意见，不肯改变”，侧重点是“不考虑别人建议”。题干则着重““听到别人指出错误反而高兴””，语义指向不同。"}},{"id":"Q064","word":"改弦更张","level":"S","group":"第32组","category":"改变与不变","stem":"旧考核体系已不适合新岗位要求，管理部门决定重新调整评价方法、全面更换制度，可谓____。","clue":"“改变旧制度或计划、方法”","options":["沧海桑田","根深蒂固","改弦更张","时过境迁"],"answer":2,"optionReasons":{"沧海桑田":"该词通常表示“沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大”，侧重点是“变化巨大”。题干则着重““改变旧制度或计划、方法””，语义指向不同。","根深蒂固":"该词通常表示“蒂：草木之根。比喻基础稳固。（中性）（侧重深）”，侧重点是“难以改变”。题干则着重““改变旧制度或计划、方法””，语义指向不同。","时过境迁":"该词通常表示“境：环境。迁：变迁。时间过去了，环境或情况也随之改变了”，侧重点是“变化巨大”。题干则着重““改变旧制度或计划、方法””，语义指向不同。"}},{"id":"Q065","word":"根深蒂固","level":"S","group":"第32组","category":"改变与不变","stem":"长期形成的浪费观念深植部分人的日常习惯，仅靠一次宣传很难撼动，可见其____。","clue":"“根基深、难以轻易改变”","options":["根深蒂固","时过境迁","改弦更张","沧海桑田"],"answer":0,"optionReasons":{"时过境迁":"该词通常表示“境：环境。迁：变迁。时间过去了，环境或情况也随之改变了”，侧重点是“变化巨大”。题干则着重““根基深、难以轻易改变””，语义指向不同。","改弦更张":"该词通常表示“更：改换；张：给乐器上弦。改换、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法”，侧重点是“改变”。题干则着重““根基深、难以轻易改变””，语义指向不同。","沧海桑田":"该词通常表示“沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大”，侧重点是“变化巨大”。题干则着重““根基深、难以轻易改变””，语义指向不同。"}},{"id":"Q066","word":"沧海桑田","level":"S","group":"第32组","category":"改变与不变","stem":"几十年前的荒漠如今已成为绿洲，见证当地生态面貌____般的巨变。","clue":"“长时间带来的巨大变化”","options":["改弦更张","时过境迁","根深蒂固","沧海桑田"],"answer":3,"optionReasons":{"改弦更张":"该词通常表示“更：改换；张：给乐器上弦。改换、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法”，侧重点是“改变”。题干则着重““长时间带来的巨大变化””，语义指向不同。","时过境迁":"该词表示“境：环境。迁：变迁。时间过去了，环境或情况也随之改变了”。虽然可能与正确词相近，但这道题的关键信息是““长时间带来的巨大变化””，仍以“沧海桑田”更贴合。","根深蒂固":"该词通常表示“蒂：草木之根。比喻基础稳固。（中性）（侧重深）”，侧重点是“难以改变”。题干则着重““长时间带来的巨大变化””，语义指向不同。"}},{"id":"Q067","word":"推波助澜","level":"S","group":"第33组","category":"顺势造势","stem":"一些自媒体不断传播未经核实的消息，使原本不大的争议迅速升级，客观上起了____的作用。","clue":"“进一步推动已有声势或发展”","options":["推波助澜","顺水推舟","顺势而为","势在必行"],"answer":0,"optionReasons":{"顺水推舟":"该词表示“舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事”。虽然可能与正确词相近，但这道题的关键信息是““进一步推动已有声势或发展””，仍以“推波助澜”更贴合。","顺势而为":"该词通常表示“顺应形势做事情”，侧重点是“顺势”。题干则着重““进一步推动已有声势或发展””，语义指向不同。","势在必行":"该词通常表示“势：形势。客观形势决定必须这样做”，侧重点是“顺势”。题干则着重““进一步推动已有声势或发展””，语义指向不同。"}},{"id":"Q068","word":"顺势而为","level":"S","group":"第33组","category":"顺势造势","stem":"消费者越来越重视节能，企业及时调整产品布局，沿着市场趋势____。","clue":"“顺应既有形势采取行动”","options":["势在必行","顺势而为","推波助澜","顺水推舟"],"answer":1,"optionReasons":{"势在必行":"该词表示“势：形势。客观形势决定必须这样做”。虽然可能与正确词相近，但这道题的关键信息是““顺应既有形势采取行动””，仍以“顺势而为”更贴合。","推波助澜":"该词通常表示“澜：大的波浪。比喻推动、助长事物的声势及发展。（中性词）”，侧重点是“造势”。题干则着重““顺应既有形势采取行动””，语义指向不同。","顺水推舟":"该词通常表示“舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事”，侧重点是“造势”。题干则着重““顺应既有形势采取行动””，语义指向不同。"}},{"id":"Q069","word":"亡羊补牢","level":"S","group":"第35组","category":"提早准备和补救","stem":"发现数据访问权限设置不合理后，团队立即修复漏洞，以免再次泄露，也算____。","clue":"“问题已经发生，再及时补救”","options":["亡羊补牢","未雨绸缪","防患未然","临渴掘井"],"answer":0,"optionReasons":{"未雨绸缪":"该词通常表示“绸缪：缠绕，引申指修缮。比喻事先做好防备工作”，侧重点是“前期准备”。题干则着重““问题已经发生，再及时补救””，语义指向不同。","防患未然":"该词通常表示“患：灾祸。未然：没有这样，指没有发生。在祸患还没有发生之前就进行防备”，侧重点是“前期准备”。题干则着重““问题已经发生，再及时补救””，语义指向不同。","临渴掘井":"该词表示“临；接近。感到口渴才挖井。比喻平时没有准备，事到临头才想办法”。虽然可能与正确词相近，但这道题的关键信息是““问题已经发生，再及时补救””，仍以“亡羊补牢”更贴合。"}},{"id":"Q070","word":"未雨绸缪","level":"S","group":"第35组","category":"提早准备和补救","stem":"汛期尚未来临，社区已经清理排水沟并储备应急物资，体现出____的意识。","clue":"“事先准备、以防将来”","options":["未雨绸缪","临渴掘井","江心补漏","亡羊补牢"],"answer":0,"optionReasons":{"临渴掘井":"该词通常表示“临；接近。感到口渴才挖井。比喻平时没有准备，事到临头才想办法”，侧重点是“出现问题进行补救”。题干则着重““事先准备、以防将来””，语义指向不同。","江心补漏":"该词通常表示“指船到江心才补漏洞。比喻临到紧急关头才设法补救，为时已晚。偏正式结构；在句中一般作谓语、定语”，侧重点是“出现问题进行补救”。题干则着重““事先准备、以防将来””，语义指向不同。","亡羊补牢":"该词通常表示“意指丢失了再去修补羊圈，还不算晚。后用来比喻出了问题以后及时想法补救，以免继续受损失。也指出了问题才想法补救，已经太晚了”，侧重点是“出现问题进行补救”。题干则着重““事先准备、以防将来””，语义指向不同。"}},{"id":"Q071","word":"防患未然","level":"S","group":"第35组","category":"提早准备和补救","stem":"为了避免电池过热导致事故，工程师在设计阶段设置多重温度保护机制，力争____。","clue":"“危险尚未发生前预防它”","options":["临渴掘井","防患未然","亡羊补牢","高枕无忧"],"answer":1,"optionReasons":{"临渴掘井":"该词通常表示“临；接近。感到口渴才挖井。比喻平时没有准备，事到临头才想办法”，侧重点是“出现问题进行补救”。题干则着重““危险尚未发生前预防它””，语义指向不同。","亡羊补牢":"该词通常表示“意指丢失了再去修补羊圈，还不算晚。后用来比喻出了问题以后及时想法补救，以免继续受损失。也指出了问题才想法补救，已经太晚了”，侧重点是“出现问题进行补救”。题干则着重““危险尚未发生前预防它””，语义指向不同。","高枕无忧":"该词通常表示“垫高枕头睡觉，无所忧虑”，侧重点是“准备得当没有忧虑”。题干则着重““危险尚未发生前预防它””，语义指向不同。"}},{"id":"Q072","word":"各自为政","level":"S","group":"第36组","category":"办公、管理相关","stem":"多部门只按自己的想法推进系统建设，接口、标准互不兼容，形成____的局面。","clue":"“各部门按自己的主张独立办事，缺少统一”","options":["各自为政","各行其是","如鱼得水","独当一面"],"answer":0,"optionReasons":{"各行其是":"该词表示“指各人按照自己认为正确的去做”。虽然可能与正确词相近，但这道题的关键信息是““各部门按自己的主张独立办事，缺少统一””，仍以“各自为政”更贴合。","如鱼得水":"该词通常表示“好像鱼得到水一样。比喻得到跟自己非常投合的人或对自己很适合的环境”，侧重点是“形容人工作的状态”。题干则着重““各部门按自己的主张独立办事，缺少统一””，语义指向不同。","独当一面":"该词通常表示“意思是指单独负责一个方面的工作或任务”，侧重点是“形容人工作的状态”。题干则着重““各部门按自己的主张独立办事，缺少统一””，语义指向不同。"}},{"id":"Q073","word":"空中楼阁","level":"S","group":"第37组","category":"空谈与虚幻","stem":"没有数据、资金和实施路径支持的宏大规划，只是一座缺乏现实基础的____。","clue":"“缺少实际基础的空想”","options":["画饼充饥","镜花水月","纸上谈兵","空中楼阁"],"answer":3,"optionReasons":{"画饼充饥":"该词通常表示“画个饼子来解饿。本比喻徒有虚名而于实际无好处。后多用来比喻以空想来安慰自己”，侧重点是“不靠谱的做法”。题干则着重““缺少实际基础的空想””，语义指向不同。","镜花水月":"该词表示“镜子里的花，水里的月亮。比喻虚幻的东西”。虽然可能与正确词相近，但这道题的关键信息是““缺少实际基础的空想””，仍以“空中楼阁”更贴合。","纸上谈兵":"该词通常表示“兵：用兵之道。比喻空谈理论，不能解决实际问题。（侧重只有理论而没有行动）”，侧重点是“不靠谱的做法”。题干则着重““缺少实际基础的空想””，语义指向不同。"}},{"id":"Q074","word":"纸上谈兵","level":"S","group":"第37组","category":"空谈与虚幻","stem":"他能把管理理论讲得头头是道，却从未尝试处理真实业务，容易陷入____。","clue":"“只有理论讨论而缺乏实际行动”","options":["坐而论道","空中楼阁","纸上谈兵","画饼充饥"],"answer":2,"optionReasons":{"坐而论道":"该词通常表示“意思是坐着空谈大道理。指口头说说，不见行动”，侧重点是“空谈与虚幻”。题干则着重““只有理论讨论而缺乏实际行动””，语义指向不同。","空中楼阁":"该词通常表示“悬在空中的楼阁。比喻崇高通达。后多用来比喻虚构的事物或脱离实际的空想”，侧重点是“实现不了”。题干则着重““只有理论讨论而缺乏实际行动””，语义指向不同。","画饼充饥":"该词表示“画个饼子来解饿。本比喻徒有虚名而于实际无好处。后多用来比喻以空想来安慰自己”。虽然可能与正确词相近，但这道题的关键信息是““只有理论讨论而缺乏实际行动””，仍以“纸上谈兵”更贴合。"}},{"id":"Q075","word":"无人问津","level":"S","group":"第38组","category":"来者众多","stem":"展会结束后，那款产品长期卖不出去，连咨询的顾客也没有，几乎____。","clue":"“被冷落、无人过问”","options":["无人问津","门可罗雀","络绎不绝","蜂拥而至"],"answer":0,"optionReasons":{"门可罗雀":"该词表示“罗：张网捕捉。大门之前可以张起网来捕麻雀。形容十分冷落，宾客稀少”。虽然可能与正确词相近，但这道题的关键信息是““被冷落、无人过问””，仍以“无人问津”更贴合。","络绎不绝":"该词通常表示“络绎：前后相接、连续不断的样子。形容车船人马等前后相接，往来不断”，侧重点是“形容到来”。题干则着重““被冷落、无人过问””，语义指向不同。","蜂拥而至":"该词通常表示“像一窝蜂似地一拥而来。形容很多人乱哄哄地朝一个地方聚拢”，侧重点是“形容到来”。题干则着重““被冷落、无人过问””，语义指向不同。"}},{"id":"Q076","word":"络绎不绝","level":"S","group":"第38组","category":"来者众多","stem":"新开通的非遗展馆很受欢迎，前来参观的游客前后相接、接连不断，可谓____。","clue":"“人群往来不断、前后相接”","options":["无人问津","蜂拥而至","络绎不绝","门可罗雀"],"answer":2,"optionReasons":{"无人问津":"该词通常表示“津：渡口。没有人来询问渡口。比喻没人过问、受到冷落。（形容某事物受冷落、无人理睬。程度较重）”，侧重点是“形容人多、人少”。题干则着重““人群往来不断、前后相接””，语义指向不同。","蜂拥而至":"该词表示“像一窝蜂似地一拥而来。形容很多人乱哄哄地朝一个地方聚拢”。虽然可能与正确词相近，但这道题的关键信息是““人群往来不断、前后相接””，仍以“络绎不绝”更贴合。","门可罗雀":"该词通常表示“罗：张网捕捉。大门之前可以张起网来捕麻雀。形容十分冷落，宾客稀少”，侧重点是“形容人多、人少”。题干则着重““人群往来不断、前后相接””，语义指向不同。"}},{"id":"Q077","word":"万人空巷","level":"S","group":"第39组","category":"人多人少","stem":"夺冠队伍凯旋时，全城居民纷纷走出家门涌向街头迎接，形成____的盛况。","clue":"“人们从家中出来聚到街上庆祝”","options":["人山人海","万人空巷","川流不息","孑然一身"],"answer":1,"optionReasons":{"人山人海":"该词表示“形容聚集的人非常多”。虽然可能与正确词相近，但这道题的关键信息是““人们从家中出来聚到街上庆祝””，仍以“万人空巷”更贴合。","川流不息":"该词表示“形容行人、车马很多，像水流一样连续不断”。虽然可能与正确词相近，但这道题的关键信息是““人们从家中出来聚到街上庆祝””，仍以“万人空巷”更贴合。","孑然一身":"该词通常表示“孑然：孤单的样子。指孤身一人。（常用褒义，形容追寻事业或理想）”，侧重点是“形容孤独”。题干则着重““人们从家中出来聚到街上庆祝””，语义指向不同。"}},{"id":"Q078","word":"参差不齐","level":"S","group":"第40组","category":"好坏掺杂","stem":"各地基层平台信息化基础差异很大，数据质量也____，需要分类指导。","clue":"“水平、质量高低不一致”","options":["良莠不齐","泥沙俱下","参差不齐","鱼龙混杂"],"answer":2,"optionReasons":{"良莠不齐":"该词表示“莠：狗尾草，比喻坏人。指好人、坏人混在一起。同“良莠不一”。（现在用法不只形容人，也可形容事物）”。虽然可能与正确词相近，但这道题的关键信息是““水平、质量高低不一致””，仍以“参差不齐”更贴合。","泥沙俱下":"该词表示“俱：都。泥土和沙子一同随水冲了下来。比喻人或事物好坏混杂在一起。（侧重量大且好坏都有）”。虽然可能与正确词相近，但这道题的关键信息是““水平、质量高低不一致””，仍以“参差不齐”更贴合。","鱼龙混杂":"该词表示“比喻坏人和好人混在一起。同“龙蛇混杂”。（现在用法不只形容人，也可形容事物）”。虽然可能与正确词相近，但这道题的关键信息是““水平、质量高低不一致””，仍以“参差不齐”更贴合。"}},{"id":"Q079","word":"良莠不齐","level":"S","group":"第40组","category":"好坏掺杂","stem":"进入培训行业的机构有真心教学的，也有欺骗消费者的，行业主体____。","clue":"“好与坏混在一起，尤其好人与坏人”","options":["固步自封","鱼目混珠","参差不齐","良莠不齐"],"answer":3,"optionReasons":{"固步自封":"该词通常表示“封：限制在一定的范围内。比喻因循守旧，安于现状，不求创新进取。（侧重开放与封闭）”，侧重点是“形容守旧不创新”。题干则着重““好与坏混在一起，尤其好人与坏人””，语义指向不同。","鱼目混珠":"该词表示“用鱼眼睛假冒珍珠。比喻以假乱真。（也可指以次充好）”。虽然可能与正确词相近，但这道题的关键信息是““好与坏混在一起，尤其好人与坏人””，仍以“良莠不齐”更贴合。","参差不齐":"该词表示“参差：高低、长短、大小不齐的样子。形容不一致、有差别。（多搭配水平、质量、进展等）”。虽然可能与正确词相近，但这道题的关键信息是““好与坏混在一起，尤其好人与坏人””，仍以“良莠不齐”更贴合。"}},{"id":"Q080","word":"鱼龙混杂","level":"S","group":"第40组","category":"好坏掺杂","stem":"开放式交流群缺乏审核，专业人士与诈骗分子都能进入，参与者____。","clue":"“好人坏人混在一起”","options":["参差不齐","泥沙俱下","鱼龙混杂","鱼目混珠"],"answer":2,"optionReasons":{"参差不齐":"该词表示“参差：高低、长短、大小不齐的样子。形容不一致、有差别。（多搭配水平、质量、进展等）”。虽然可能与正确词相近，但这道题的关键信息是““好人坏人混在一起””，仍以“鱼龙混杂”更贴合。","泥沙俱下":"该词表示“俱：都。泥土和沙子一同随水冲了下来。比喻人或事物好坏混杂在一起。（侧重量大且好坏都有）”。虽然可能与正确词相近，但这道题的关键信息是““好人坏人混在一起””，仍以“鱼龙混杂”更贴合。","鱼目混珠":"该词表示“用鱼眼睛假冒珍珠。比喻以假乱真。（也可指以次充好）”。虽然可能与正确词相近，但这道题的关键信息是““好人坏人混在一起””，仍以“鱼龙混杂”更贴合。"}},{"id":"Q081","word":"连绵不绝","level":"A","group":"第1组","category":"中华文明传统文化","stem":"古道沿山脊伸展，远望群峰一座接一座，起伏____，仿佛没有尽头。","clue":"“连续而不中断”","options":["历久弥新","博大精深","连绵不绝","兼收并蓄"],"answer":2,"optionReasons":{"历久弥新":"该词表示“弥：更加。指经历长久的时间而更加鲜活，更加有活力，更显价值”。虽然可能与正确词相近，但这道题的关键信息是““连续而不中断””，仍以“连绵不绝”更贴合。","博大精深":"该词表示“博大：广大。精深：精湛深刻。形容学识、思想、理论广博丰富，精湛深刻”。虽然可能与正确词相近，但这道题的关键信息是““连续而不中断””，仍以“连绵不绝”更贴合。","兼收并蓄":"该词通常表示“并：一起。蓄：积聚，储存。对不同的人或事物都能同时收容、保留”，侧重点是“中华文明传统文化”。题干则着重““连续而不中断””，语义指向不同。"}},{"id":"Q082","word":"不绝如缕","level":"A","group":"第2组","category":"文化传承","stem":"这门传统唱腔如今只剩两三位高龄艺人掌握，传承已____，随时可能断绝。","clue":"“像细线将断未断，处境危急”","options":["连绵不绝","薪火相传","不绝如缕","难以为继"],"answer":2,"optionReasons":{"连绵不绝":"该词通常表示“意思是连续而不中断”，侧重点是“形容中华文化”。题干则着重““像细线将断未断，处境危急””，语义指向不同。","薪火相传":"该词通常表示“意思是比喻学问和技艺代代相传。比喻师生授受不绝，或种族、血统、文化精神的传承，绵延不尽”，侧重点是“文化传承”。题干则着重““像细线将断未断，处境危急””，语义指向不同。","难以为继":"该词通常表示“难以继续下去”，侧重点是“文化传承”。题干则着重““像细线将断未断，处境危急””，语义指向不同。"}},{"id":"Q083","word":"口耳相传","level":"A","group":"第2组","category":"文化传承","stem":"在尚无文字记录的年代，祖辈通过亲口讲述、晚辈亲耳听受，将山歌____下来。","clue":"“口说耳听，代代传授”","options":["承上启下","口耳相传","继往开来","不绝如缕"],"answer":1,"optionReasons":{"承上启下":"该词表示“接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡”。虽然可能与正确词相近，但这道题的关键信息是““口说耳听，代代传授””，仍以“口耳相传”更贴合。","继往开来":"该词表示“继承前人的事业，开辟未来的道路”。虽然可能与正确词相近，但这道题的关键信息是““口说耳听，代代传授””，仍以“口耳相传”更贴合。","不绝如缕":"该词通常表示“绝：断。缕：细线。像一根细线那样，似断非断。也作“不绝若线”。比喻情势危急”，侧重点是“传承不间断”。题干则着重““口说耳听，代代传授””，语义指向不同。"}},{"id":"Q084","word":"去芜存菁","level":"A","group":"第3组","category":"改革创新","stem":"整理地方志时，研究者删去无据传闻，留下真实可靠的材料，努力____。","clue":"“去除杂质、保留精华”","options":["激浊扬清","吐故纳新","革故鼎新","去芜存菁"],"answer":3,"optionReasons":{"激浊扬清":"该词表示“强调通过主动干预清除负面因素并弘扬正面价值，侧重点在于“激”与“扬”的联动作用，既包含对浑浊、消极现象的批判与清除，又包含对清澈”。虽然可能与正确词相近，但这道题的关键信息是““去除杂质、保留精华””，仍以“去芜存菁”更贴合。","吐故纳新":"该词表示“纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻扬弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）”。虽然可能与正确词相近，但这道题的关键信息是““去除杂质、保留精华””，仍以“去芜存菁”更贴合。","革故鼎新":"该词表示“革：除去。鼎新：立新。指革除旧的，建立新的。多指改朝换代或重大变革。（多政治角度）”。虽然可能与正确词相近，但这道题的关键信息是““去除杂质、保留精华””，仍以“去芜存菁”更贴合。"}},{"id":"Q085","word":"激浊扬清","level":"A","group":"第3组","category":"改革创新","stem":"整治行业乱象既要批评不正之风，也要表彰诚信企业，用制度____。","clue":"“抑制不良、弘扬正面风气”","options":["吐故纳新","革故鼎新","激浊扬清","去芜存菁"],"answer":2,"optionReasons":{"吐故纳新":"该词表示“纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻扬弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）”。虽然可能与正确词相近，但这道题的关键信息是““抑制不良、弘扬正面风气””，仍以“激浊扬清”更贴合。","革故鼎新":"该词表示“革：除去。鼎新：立新。指革除旧的，建立新的。多指改朝换代或重大变革。（多政治角度）”。虽然可能与正确词相近，但这道题的关键信息是““抑制不良、弘扬正面风气””，仍以“激浊扬清”更贴合。","去芜存菁":"该词表示“意思是除去杂质、保留精华”。虽然可能与正确词相近，但这道题的关键信息是““抑制不良、弘扬正面风气””，仍以“激浊扬清”更贴合。"}},{"id":"Q086","word":"除旧布新","level":"A","group":"第3组","category":"改革创新","stem":"老厂区改造不仅拆除落后设施，还建设新的公共空间，体现城市更新中____的思路。","clue":"“清除旧事物、建立新事物”","options":["去芜存菁","除旧布新","吐故纳新","革故鼎新"],"answer":1,"optionReasons":{"去芜存菁":"该词表示“意思是除去杂质、保留精华”。虽然可能与正确词相近，但这道题的关键信息是““清除旧事物、建立新 升。比喻事物随着它所凭借的基础而增长”，侧重点是“其他”。题干则着重““情况持续走向衰落””，语义指向不同。","日渐式微":"该词表示“事物逐渐地由兴盛而衰落”。虽然可能与正确词相近，但这道题的关键信息是““情况持续走向衰落””，仍以“江河日下”更贴合。"}},{"id":"Q103","word":"突飞猛进","level":"A","group":"第9组","category":"事物出现、发展、衰落","stem":"经过关键算法突破，语音识别准确率在短期内大幅提升，技术水平____。","clue":"“短期进步十分迅速”","options":["日新月异","突飞猛进","方兴未艾","如火如荼"],"answer":1,"optionReasons":{"日新月异":"该词通常表示“形容发展变化很快，新事物、新气象不断出现”，侧重点是“形容发展迅速”。题干则着重““短期进步十分迅速””，语义指向不同。","方兴未艾":"该词通常表示“意思是事物正在发展，尚未达到止境”，侧重点是“出现、萌生”。题干则着重““短期进步十分迅速””，语义指向不同。","如火如荼":"该词表示“原比喻军容之盛，现在形容旺盛、热烈或激烈”。虽然可能与正确词相近，但这道题的关键信息是““短期进步十分迅速””，仍以“突飞猛进”更贴合。"}},{"id":"Q104","word":"雨后春笋","level":"A","group":"第9组","category":"事物出现、发展、衰落","stem":"乡村电商扶持政策实施后，农产品直播团队在各地大量出现，如同____。","clue":"“新事物大量、迅速涌现”","options":["雨后春笋","应运而生","方兴未艾","层出不穷"],"answer":0,"optionReasons":{"应运而生":"该词通常表示“应运：应天命。指顺应天命而降生。后泛指顺应时机而产生”，侧重点是“事物出现、发展、衰落”。题干则着重““新事物大量、迅速涌现””，语义指向不同。","方兴未艾":"该词表示“意思是事物正在发展，尚未达到止境”。虽然可能与正确词相近，但这道题的关键信息是““新事物大量、迅速涌现””，仍以“雨后春笋”更贴合。","层出不穷":"该词通常表示“层出：接连出现。穷：尽。接连出现，没有穷尽。（主语是事物）”，侧重点是“事物出现、发展、衰落”。题干则着重““新事物大量、迅速涌现””，语义指向不同。"}},{"id":"Q105","word":"出类拔萃","level":"A","group":"第10组","category":"竞争比较","stem":"在同批青年科研人员中，她既有扎实的专业能力，又有突出的创新成果，表现____。","clue":"“人的品德或才能高出同类”","options":["崭露头角","出类拔萃","无与伦比","望尘莫及"],"answer":1,"optionReasons":{"崭露头角":"该词通常表示“崭：高出。比喻突出地显露出才能。（侧重能力）”，侧重点是“表现突出”。题干则着重““人的品德或才能高出同类””，语义指向不同。","无与伦比":"该词表示“意思是指事物非常完美，没有能够与它相比的同类的东西”。虽然可能与正确词相近，但这道题的关键信息是““人的品德或才能高出同类””，仍以“出类拔萃”更贴合。","望尘莫及":"该词通常表示“莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦”，侧重点是“赶得上/赶不上”。题干则着重““人的品德或才能高出同类””，语义指向不同。"}},{"id":"Q106","word":"同日而语","level":"A","group":"第10组","category":"竞争比较","stem":"十年前的处理器性能远不能与今天的同类产品____，两者在运算能力上差别巨大。","clue":"“不同时期的事物不可相比较”","options":["相提并论","同日而语","等量齐观","无与伦比"],"answer":1,"optionReasons":{"相提并论":"该词表示“把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）”。虽然可能与正确词相近，但这道题的关键信息是““不同时期的事物不可相比较””，仍以“同日而语”更贴合。","等量齐观":"该词通常表示“等：同等。齐：一样。把不同的事物一律同等看待”，侧重点是“竞争比较”。题干则着重““不同时期的事物不可相比较””，语义指向不同。","无与伦比":"该词通常表示“意思是指事物非常完美，没有能够与它相比的同类的东西”，侧重点是“和别人相比较”。题干则着重““不同时期的事物不可相比较””，语义指向不同。"}},{"id":"Q107","word":"无与伦比","level":"A","group":"第10组","category":"竞争比较","stem":"这座古桥的工艺精度和艺术表现力非常独特，在同类建筑中几乎____。","clue":"“同类中几乎没有能够相比的”","options":["无与伦比","相形见绌","相提并论","望尘莫及"],"answer":0,"optionReasons":{"相形见绌":"该词表示“形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足”。虽然可能与正确词相近，但这道题的关键信息是““同类中几乎没有能够相比的””，仍以“无与伦比”更贴合。","相提并论":"该词通常表示“把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）”，侧重点是“同等地位”。题干则着重““同类中几乎没有能够相比的””，语义指向不同。","望尘莫及":"该词通常表示“莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦”，侧重点是“赶得上/赶不上”。题干则着重““同类中几乎没有能够相比的””，语义指向不同。"}},{"id":"Q108","word":"回天乏术","level":"A","group":"第11组","category":"能力不足","stem":"患者送医时病情已极端危急，多种抢救措施均无法挽救，医生最终也____。","clue":"“事态严重到无法挽回”","options":["爱莫能助","顾此失彼","应接不暇","回天乏术"],"answer":3,"optionReasons":{"爱莫能助":"该词表示“爱：爱惜；莫：不。虽然心中关切同情，却没有力量帮助”。虽然可能与正确词相近，但这道题的关键信息是““事态严重到无法挽回””，仍以“回天乏术”更贴合。","顾此失彼":"该词通常表示“顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）”，侧重点是“应付不了”。题干则着重““事态严重到无法挽回””，语义指向不同。","应接不暇":"该词通常表示“暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）”，侧重点是“应付不了”。题干则着重““事态严重到无法挽回””，语义指向不同。"}},{"id":"Q109","word":"爱莫能助","level":"A","group":"第11组","category":"能力不足","stem":"我非常希望提供资金支持，但项目经费已全部锁定，此事只能____。","clue":"“想帮却没有能力帮”","options":["爱莫能助","回天乏术","顾此失彼","应接不暇"],"answer":0,"optionReasons":{"回天乏术":"该词表示“回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救”。虽然可能与正确词相近，但这道题的关键信息是““想帮却没有能力帮””，仍以“爱莫能助”更贴合。","顾此失彼":"该词通常表示“顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）”，侧重点是“应付不了”。题干则着重““想帮却没有能力帮””，语义指向不同。","应接不暇":"该词通常表示“暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）”，侧重点是“应付不了”。题干则着重““想帮却没有能力帮””，语义指向不同。"}},{"id":"Q110","word":"独木难支","level":"A","group":"第11组","category":"能力不足","stem":"基层服务窗口只有一名工作人员承担所有事务，即使再努力也____。","clue":"“个人力量不足以支撑全局”","options":["回天乏术","独木难支","应接不暇","顾此失彼"],"answer":1,"optionReasons":{"回天乏术":"该词通常表示“回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救”，侧重点是“能力有限”。题干则着重““个人力量不足以支撑全局””，语义指向不同。","应接不暇":"该词表示“暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）”。虽然可能与正确词相近，但这道题的关键信息是““个人力量不足以支撑全局””，仍以“独木难支”更贴合。","顾此失彼":"该词表示“顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）”。虽然可能与正确词相近，但这道题的关键信息是““个人力量不足以支撑全局””，仍以“独木难支”更贴合。"}},{"id":"Q111","word":"触类旁通","level":"A","group":"第12组","category":"印象和效果","stem":"掌握了一种网络协议的基本设计规律后，他能举一反三理解其他相近协议，达到了____。","clue":"“掌握一种规律后类推同类知识”","options":["蜻蜓点水","触类旁通","融会贯通","博采众长"],"answer":1,"optionReasons":{"蜻蜓点水":"该词通常表示“比喻进行某些动作时只轻轻接触表面。也比喻肤浅不深入”，侧重点是“形容学习粗浅”。题干则着重““掌握一种规律后类推同类知识””，语义指向不同。","融会贯通":"该词表示“融会：融合。贯通：全面透彻地了解。指把各方面的知识、道理融合贯穿，从而获得对事物全面、透彻地理解和领悟。（侧重融合）”。虽然可能与正确词相近，但这道题的关键信息是““掌握一种规律后类推同类知识””，仍以“触类旁通”更贴合。","博采众长":"该词通常表示“博采：广泛搜集采纳。从多方面吸取各家的长处”，侧重点是“向他人学习”。题干则着重““掌握一种规律后类推同类知识””，语义指向不同。"}},{"id":"Q112","word":"交相辉映","level":"A","group":"第13组","category":"搭档配合","stem":"夜幕下，古城墙与现代光影装置相互照耀，绚丽色彩____，景致迷人。","clue":"“美好景物彼此照耀衬托”","options":["相得益彰","相辅相成","交相辉映","珠联璧合"],"answer":2,"optionReasons":{"相得益彰":"该词通常表示“相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来”，侧重点是“合作配合”。题干则着重““美好景物彼此照耀衬托””，语义指向不同。","相辅相成":"该词通常表示“辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可”，侧重点是“合作配合”。题干则着重““美好景物彼此照耀衬托””，语义指向不同。","珠联璧合":"该词通常表示“珠联：像珍珠一样串在一起。璧合：像碧玉一样合在一起。原指一种日月重合、五星相联的天相。后多比喻美好的人及事物凑在一起。同“珠连璧”，侧重点是“合作配合”。题干则着重““美好景物彼此照耀衬托””，语义指向不同。"}},{"id":"Q113","word":"珠联璧合","level":"A","group":"第13组","category":"搭档配合","stem":"优秀编剧与杰出演员合作，文学表达和舞台呈现都达到很高水准，可称____。","clue":"“美好的人或事物结合在一起”","options":["珠联璧合","相得益彰","相辅相成","交相辉映"],"answer":0,"optionReasons":{"相得益彰":"该词表示“相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来”。虽然可能与正确词相近，但这道题的关键信息是““美好的人或事物结合在一起””，仍以“珠联璧合”更贴合。","相辅相成":"该词表示“辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可”。虽然可能与正确词相近，但这道题的关键信息是““美好的人或事物结合在一起””，仍以“珠联璧合”更贴合。","交相辉映":"该词通常表示“各种光亮、色彩相互照耀、映射。常用语形容美好的景象”，侧重点是“二者都好”。题干则着重““美好的人或事物结合在一起””，语义指向不同。"}},{"id":"Q114","word":"并驾齐驱","level":"A","group":"第14组","category":"工作开展顺序","stem":"两家科研机构在基础研究和成果转化方面实力相近，长期____，难分高下。","clue":"“双方实力差不多，不相上下”","options":["并行不悖","并驾齐驱","双管齐下","齐头并进"],"answer":1,"optionReasons":{"并行不悖":"该词表示“悖：违反，违背。指同时进行而互相不违背”。虽然可能与正确词相近，但这道题的关键信息是““双方实力差不多，不相上下””，仍以“并驾齐驱”更贴合。","双管齐下":"该词表示“管：笔管。比喻一件事同时采用两种办法或两件事同时进行”。虽然可能与正确词相近，但这道题的关键信息是““双方实力差不多，不相上下””，仍以“并驾齐驱”更贴合。","齐头并进":"该词表示“指几方面同时前进”。虽然可能与正确词相近，但这道题的关键信息是““双方实力差不多，不相上下””，仍以“并驾齐驱”更贴合。"}},{"id":"Q115","word":"喧宾夺主","level":"A","group":"第15组","category":"错误抉择和方向","stem":"影片本来讲述人物成长，复杂的特效却抢走了叙事主体的位置，难免____。","clue":"“次要内容占据主要地位”","options":["本末倒置","舍本逐末","喧宾夺主","因小失大"],"answer":2,"optionReasons":{"本末倒置":"该词通常表示“本：树根。末：树梢。比喻把事情的轻重主次颠倒了过来”，侧重点是“错误抉择和方向”。题干则着重““次要内容占据主要地位””，语义指向不同。","舍本逐末":"该词表示“舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置”。虽然可能与正确词相近，但这道题的关键信息是““次要内容占据主要地位””，仍以“喧宾夺主”更贴合。","因小失大":"该词表示“因：为了。指为了小的利益造成大的损失”。虽然可能与正确词相近，但这道题的关键信息是““次要内容占据主要地位””，仍以“喧宾夺主”更贴合。"}},{"id":"Q116","word":"因小失大","level":"A","group":"第15组","category":"错误抉择和方向","stem":"为了省下一笔必要的设备维护费而造成整条产线停工，实在是____。","clue":"“贪小利益而造成更大的损失”","options":["南辕北辙","因小失大","缘木求鱼","舍本逐末"],"answer":1,"optionReasons":{"南辕北辙":"该词通常表示“辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标”，侧重点是“相悖、相反”。题干则着重““贪小利益而造成更大的损失””，语义指向不同。","缘木求鱼":"该词通常表示“缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）”，侧重点是“相悖、相反”。题干则着重““贪小利益而造成更大的损失””，语义指向不同。","舍本逐末":"该词表示“舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置”。虽然可能与正确词相近，但这道题的关键信息是““贪小利益而造成更大的损失””，仍以“因小失大”更贴合。"}},{"id":"Q117","word":"拔苗助长","level":"A","group":"第16组","category":"错误做法（寓言故事）","stem":"孩子尚未掌握基础概念就被要求完成高难度训练，急于求成的做法无异于____。","clue":"“违背成长规律、急于求成反坏事”","options":["拔苗助长","越俎代庖","邯郸学步","削足适履"],"answer":0,"optionReasons":{"越俎代庖":"该词表示“越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情”。虽然可能与正确词相近，但这道题的关键信息是““违背成长规律、急于求成反坏事””，仍以“拔苗助长”更贴合。","邯郸学步":"该词表示“比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了”。虽然可能与正确词相近，但这道题的关键信息是““违背成长规律、急于求成反坏事””，仍以“拔苗助长”更贴合。","削足适履":"该词表示“履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套”。虽然可能与正确词相近，但这道题的关键信息是““违背成长规律、急于求成反坏事””，仍以“拔苗助长”更贴合。"}},{"id":"Q118","word":"邯郸学步","level":"A","group":"第16组","category":"错误做法（寓言故事）","stem":"一些小店生搬照抄网红品牌的经营模式，原来的服务特色反而丢了，结果____。","clue":"“模仿别人不成，还丢掉原本技能”","options":["削足适履","越俎代庖","拔苗助长","邯郸学步"],"answer":3,"optionReasons":{"削足适履":"该词表示“履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套”。虽然可能与正确词相近，但这道题的关键信息是““模仿别人不成，还丢掉原本技能””，仍以“邯郸学步”更贴合。","越俎代庖":"该词表示“越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情”。虽然可能与正确词相近，但这道题的关键信息是““模仿别人不成，还丢掉原本技能””，仍以“邯郸学步”更贴合。","拔苗助长":"该词表示“用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长””。虽然可能与正确词相近，但这道题的关键信息是““模仿别人不成，还丢掉原本技能””，仍以“邯郸学步”更贴合。"}},{"id":"Q119","word":"循循善诱","level":"A","group":"第17组","category":"教育影响批评","stem":"面对学生的困惑，老师按照难易顺序逐步提问，引导他们自己发现答案，堪称____。","clue":"“教育时有步骤地耐心引导”","options":["循循善诱","潜移默化","耳濡目染","醍醐灌顶"],"answer":0,"optionReasons":{"潜移默化":"该词通常表示“潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）”，侧重点是“影响感化”。题干则着重““教育时有步骤地耐心引导””，语义指向不同。","耳濡目染":"该词通常表示“濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）”，侧重点是“影响感化”。题干则着重““教育时有步骤地耐心引导””，语义指向不同。","醍醐灌顶":"该词通常表示“醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快”，侧重点是“醒悟、唤醒”。题干则着重““教育时有步骤地耐心引导””，语义指向不同。"}},{"id":"Q120","word":"春风化雨","level":"A","group":"第17组","category":"教育影响批评","stem":"乡村教师多年来用温和细致的陪伴影响孩子，教育的力量如同____。","clue":"“良好教育温柔而持续地感化”","options":["潜移默化","耳濡目染","润物无声","春风化雨"],"answer":3,"optionReasons":{"潜移默化":"该词通常表示“潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）”，侧重点是“影响感化”。题干则着重““良好教育温柔而持续地感化””，语义指向不同。","耳濡目染":"该词通常表示“濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）”，侧重点是“影响感化”。题干则着重““良好教育温柔而持续地感化””，语义指向不同。","润物无声":"该词通常表示“指有大胸怀者，做了贡献而不张扬，默默奉献。（也指文化教育等对人的潜移默化的影响）”，侧重点是“影响感化”。题干则着重““良好教育温柔而持续地感化””，语义指向不同。"}},{"id":"Q121","word":"耳提面命","level":"A","group":"第17组","category":"教育影响批评","stem":"临行前，导师多次当面叮嘱实验安全细节，言辞恳切，真可谓____。","clue":"“长辈或师长面对面恳切教导”","options":["循循善诱","耳提面命","苦口婆心","如沐春风"],"answer":1,"optionReasons":{"循循善诱":"该词表示“循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法”。虽然可能与正确词相近，但这道题的关键信息是““长辈或师长面对面恳切教导””，仍以“耳提面命”更贴合。","苦口婆心":"该词表示“用来形容一个人善意且耐心地反复劝导他人”。虽然可能与正确词相近，但这道题的关键信息是““长辈或师长面对面恳切教导””，仍以“耳提面命”更贴合。","如沐春风":"该词通常表示“通常用来形容人感到非常舒适和愉悦。它的意思是像沐浴在春风里一样，感受到舒适的感觉”，侧重点是“影响感化”。题干则着重““长辈或师长面对面恳切教导””，语义指向不同。"}},{"id":"Q122","word":"呕心沥血","level":"A","group":"第18组","category":"工作学习状态","stem":"他为这套辞典耗费十余年心血，不断查证校勘，几乎____。","clue":"“长期费尽心思并投入心血”","options":["心无旁骛","筚路蓝缕","呕心沥血","殚精竭虑"],"answer":2,"optionReasons":{"心无旁骛":"该词表示“旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志”。虽然可能与正确词相近，但这道题的关键信息是““长期费尽心思并投入心血””，仍以“呕心沥血”更贴合。","筚路蓝缕":"该词通常表示“筚路：柴车。蓝缕：又旧又破的衣服。意思是驾着柴车穿着破旧衣服去开辟山林。现用来形容创业的艰难与辛苦。也作“荜路蓝缕”。（词义有拓”，侧重点是“辛苦奔波”。题干则着重““长期费尽心思并投入心血””，语义指向不同。","殚精竭虑":"该词表示“殚：竭尽。用尽精力和心思”。虽然可能与正确词相近，但这道题的关键信息是““长期费尽心思并投入心血””，仍以“呕心沥血”更贴合。"}},{"id":"Q123","word":"孜孜不倦","level":"A","group":"第18组","category":"工作学习状态","stem":"退休后，这位教师仍坚持阅读文献、指导学生，学习与教学____。","clue":"“勤奋努力且不知疲倦”","options":["焚膏继晷","孜孜以求","呕心沥血","孜孜不倦"],"answer":3,"optionReasons":{"焚膏继晷":"该词通常表示“焚：点燃；膏：灯油或蜡烛；继：接续；晷：日影、日光。意思是点燃灯烛来接替日光照明，形容夜以继日地用功读书或努力工作”，侧重点是“抓紧时间、勤奋”。题干则着重““勤奋努力且不知疲倦””，语义指向不同。","孜孜以求":"该词表示“孜孜：勤勉的样子。意思是不知疲倦地探求”。虽然可能与正确词相近，但这道题的关键信息是““勤奋努力且不知疲倦””，仍以“孜孜不倦”更贴合。","呕心沥血":"该词通常表示“呕：吐。沥：滴。形容费尽心思”，侧重点是“尽心钻研学习”。题干则着重““勤奋努力且不知疲倦””，语义指向不同。"}},{"id":"Q124","word":"孜孜以求","level":"A","group":"第18组","category":"工作学习状态","stem":"对于尚未解决的科学难题，他十年间不断试验，始终____。","clue":"“不倦地探求某一目标”","options":["殚精竭虑","心无旁骛","孜孜以求","孜孜不倦"],"answer":2,"optionReasons":{"殚精竭虑":"该词通常表示“殚：竭尽。用尽精力和心思”，侧重点是“尽心钻研学习”。题干则着重““不倦地探求某一目标””，语义指向不同。","心无旁骛":"该词通常表示“旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志”，侧重点是“尽心钻研学习”。题干则着重““不倦地探求某一目标””，语义指向不同。","孜孜不倦":"该词表示“孜孜：勤奋的样子。形容勤奋、不知疲倦”。虽然可能与正确词相近，但这道题的关键信息是““不倦地探求某一目标””，仍以“孜孜以求”更贴合。"}},{"id":"Q125","word":"焚膏继晷","level":"A","group":"第18组","category":"工作学习状态","stem":"为了在期限前完成古籍整理，研究团队白天工作、夜里点灯校勘，常常____。","clue":"“夜以继日、刻苦工作”","options":["心无旁骛","焚膏继晷","殚精竭虑","筚路蓝缕"],"answer":1,"optionReasons":{"心无旁骛":"该词通常表示“旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志”，侧重点是“尽心钻研学习”。题干则着重““夜以继日、刻苦工作””，语义指向不同。","殚精竭虑":"该词通常表示“殚：竭尽。用尽精力和心思”，侧重点是“尽心钻研学习”。题干则着重““夜以继日、刻苦工作””，语义指向不同。","筚路蓝缕":"该词通常表示“筚路：柴车。蓝缕：又旧又破的衣服。意思是驾着柴车穿着破旧衣服去开辟山林。现用来形容创业的艰难与辛苦。也作“荜路蓝缕”。（词义有拓”，侧重点是“辛苦奔波”。题干则着重““夜以继日、刻苦工作””，语义指向不同。"}},{"id":"Q126","word":"义不容辞","level":"A","group":"第19组","category":"正确做法","stem":"灾区急需专业救援人员，作为有经验的队员，他认为投入救援____。","clue":"“出于道义不能推辞”","options":["博采众长","义不容辞","提纲挈领","纲举目张"],"answer":1,"optionReasons":{"博采众长":"该词通常表示“博采：广泛搜集采纳。从多方面吸取各家的长处”，侧重点是“向他人学习”。题干则着重““出于道义不能推辞””，语义指向不同。","提纲挈领":"该词通常表示“意思是抓住事物的关键部分或者核心要点，然后用简洁明了的方式进行概 "该词表示“袖手：把手揣在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）”。虽然可能与正确词相近，但这道题的关键信息是““他人遇到危急，自己只旁观看热闹””，仍以“隔岸观火”更贴合。","亦步亦趋":"该词通常表示“步：走。趋：快走。比喻因缺乏主见，任何事都模仿、追随他人。（侧重行动）”，侧重点是“不能这样做”。题干则着重““他人遇到危急，自己只旁观看热闹””，语义指向不同。"}},{"id":"Q135","word":"安居乐业","level":"A","group":"第22组","category":"国家安定与动荡","stem":"搬迁安置区学校、医院和产业配套不断完善，居民终于能够____，生活稳定。","clue":"“生活安定、工作安心”","options":["安居乐业","国泰民安","安土重迁","颠沛流离"],"answer":0,"optionReasons":{"国泰民安":"该词表示“泰：太平。国家太平，人民生活安定。形容社会安定，人民生活幸福”。虽然可能与正确词相近，但这道题的关键信息是““生活安定、工作安心””，仍以“安居乐业”更贴合。","安土重迁":"该词通常表示“土：乡土；重：看得重，不轻易。安于本乡本土，不愿轻易迁移”，侧重点是“国人习惯”。题干则着重““生活安定、工作安心””，语义指向不同。","颠沛流离":"该词通常表示“颠沛：跌倒，比喻困顿，受挫折。流离：流转离散。形容生活困苦，流落异乡，无安身之所。（可指人，也可指物）”，侧重点是“生活不如意”。题干则着重““生活安定、工作安心””，语义指向不同。"}},{"id":"Q136","word":"颠沛流离","level":"A","group":"第22组","category":"国家安定与动荡","stem":"战乱迫使不少家庭辗转多个地区，饱受艰辛，过着____的生活。","clue":"“生活困苦、四处流转漂泊”","options":["国泰民安","颠沛流离","安居乐业","安土重迁"],"answer":1,"optionReasons":{"国泰民安":"该词通常表示“泰：太平。国家太平，人民生活安定。形容社会安定，人民生活幸福”，侧重点是“社会安定”。题干则着重““生活困苦、四处流转漂泊””，语义指向不同。","安居乐业":"该词通常表示“安：安定；乐：喜爱，愉快；业：职业。指安定愉快地生活和劳动”，侧重点是“社会安定”。题干则着重““生活困苦、四处流转漂泊””，语义指向不同。","安土重迁":"该词通常表示“土：乡土；重：看得重，不轻易。安于本乡本土，不愿轻易迁移”，侧重点是“国人习惯”。题干则着重““生活困苦、四处流转漂泊””，语义指向不同。"}},{"id":"Q137","word":"一衣带水","level":"A","group":"第23组","category":"国际国内关系","stem":"两座港口城市仅有一条狭窄海峡相隔，可谓____，经贸往来十分密切。","clue":"“隔水相望，地理位置非常近”","options":["休戚与共","同舟共济","同心同德","一衣带水"],"answer":3,"optionReasons":{"休戚与共":"该词通常表示“休：欢乐，吉庆。戚：忧愁，悲哀。指忧喜祸福彼此共同承担。形容关系密切同甘共苦”，侧重点是“同呼吸共命运”。题干则着重““隔水相望，地理位置非常近””，语义指向不同。","同舟共济":"该词通常表示“济：渡过。同乘一条船过河。比喻齐心协力渡过困难”，侧重点是“融洽和谐”。题干则着重““隔水相望，地理位置非常近””，语义指向不同。","同心同德":"该词通常表示“思想统一，信念一致。形容大家团结一条心”，侧重点是“融洽和谐”。题干则着重““隔水相望，地理位置非常近””，语义指向不同。"}},{"id":"Q138","word":"休戚与共","level":"A","group":"第23组","category":"国际国内关系","stem":"面对产业链波动，上下游企业利益相连、风险共担，彼此____。","clue":"“欢乐忧愁和利害祸福共同承担”","options":["休戚与共","唇齿相依","相濡以沫","同舟共济"],"answer":0,"optionReasons":{"唇齿相依":"该词通常表示“嘴唇与牙齿互相依存。比喻关系极为密切”，侧重点是“和邻居的关系”。题干则着重““欢乐忧愁和利害祸福共同承担””，语义指向不同。","相濡以沫":"该词通常表示“濡：沾湿，浸润。沫：唾沫。意为泉水干涸，鱼用唾沫相互湿润。后比喻在困境中用微薄的力量相互帮助”，侧重点是“融洽和谐”。题 :"“靠讨好恭维的话取悦别人”","options":["明哲保身","敷衍塞责","阿谀奉承","好大喜功"],"answer":2,"optionReasons":{"明哲保身":"该词通常表示“明哲：聪明有智慧。指聪明有智慧之人，善于趋安避危，保全自身。也指为保全个人利益而回避原则问题的处世态度”，侧重点是“只顾自己、自扫门前雪”。题干则着重““靠讨好恭维的话取悦别人””，语义指向不同。","敷衍塞责":"该词表示“敷衍：马虎应付。塞责：搪塞责任。做事马虎，应付一下以搪塞责任”。虽然可能与正确词相近，但这道题的关键信息是““靠讨好恭维的话取悦别人””，仍以“阿谀奉承”更贴合。","好大喜功":"该词通常表示“喜欢做大事、立大功。多形容浮夸、不切实际的行为”，侧重点是“爱慕名利不务实”。题干则着重““靠讨好恭维的话取悦别人””，语义指向不同。"}},{"id":"Q152","word":"从谏如流","level":"A","group":"第31组","category":"对待错误的态度","stem":"面对下属指出的流程问题，负责人立即采纳并调整安排，真可谓____。","clue":"“乐于接受直言规劝，像流水般自然”","options":["文过饰非","从谏如流","闻过则喜","欲盖弥彰"],"answer":1,"optionReasons":{"文过饰非":"该词通常表示“文、饰：掩饰；过、非：错误。用漂亮的言辞掩饰自己的过失和错误”，侧重点是“遮掩错误”。题干则着重““乐于接受直言规劝，像流水般自然””，语义指向不同。","闻过则喜":"该词表示“过：过失；则：就。听到别人批评自己的缺点或错误，表示欢迎和高兴。指虚心接受意见”。虽然可能与正确词相近，但这道题的关键信息是““乐于接受直言规劝，像流水般自然””，仍以“从谏如流”更贴合。","欲盖弥彰":"该词通常表示“盖：遮掩；弥：更加；彰：明显。想掩盖坏事的真相，结果反而更明显地暴露出来”，侧重点是“遮掩错误”。题干则着重““乐于接受直言规劝，像流水般自然””，语义指向不同。"}},{"id":"Q153","word":"固执己见","level":"A","group":"第31组","category":"对待错误的态度","stem":"充分讨论后，新证据已经推翻旧方案，他仍不肯改变观点，继续____。","clue":"“顽固坚持个人看法”","options":["文过饰非","闻过则喜","欲盖弥彰","固执己见"],"answer":3,"optionReasons":{"文过饰非":"该词通常表示“文、饰：掩饰；过、非：错误。用漂亮的言辞掩饰自己的过失和错误”，侧重点是“遮掩错误”。题干则着重““顽固坚持个人看法””，语义指向不同。","闻过则喜":"该词通常表示“过：过失；则：就。听到别人批评自己的缺点或错误，表示欢迎和高兴。指虚心接受意见”，侧重点是“谦虚接受建议”。题干则着重““顽固坚持个人看法””，语义指向不同。","欲盖弥彰":"该词通常表示“盖：遮掩；弥：更加；彰：明显。想掩盖坏事的真相，结果反而更明显地暴露出来”，侧重点是“遮掩错误”。题干则着重““顽固坚持个人看法””，语义指向不同。"}},{"id":"Q154","word":"时过境迁","level":"A","group":"第32组","category":"改变与不变","stem":"十多年后回到故乡，工厂变成公园，邻居也搬走了，许多往事已____。","clue":"“时间过去、环境情况改变”","options":["时过境迁","改弦更张","根深蒂固","沧海桑田"],"answer":0,"optionReasons":{"改弦更张":"该词通常表示“更：改换；张：给乐器上弦。改换、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法”，侧重点是“改变”。题干则着重““时间过去、环境情况改变””，语义指向不同。","根深蒂固":"该词通常表示“蒂：草木之根。比喻基础稳固。（中性）（侧重深）”，侧重点是“难以改变”。题干则着重““时间过去、环境情况改变””，语义指向不同。","沧海桑田":"该词表示“沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大”。虽然可能与正确词相近，但这道题的关键信息是““时间过去、环境情况改变””，仍以“时过境迁”更贴合。"}},{"id":"Q155","word":"积习难改","level":"A","group":"第32组","category":"改变与不变","stem":"长期拖延的工作习惯已经形成多年，即使制定计划也反复出现，真是____。","clue":"“多年养成的习惯难以改变”","options":["改弦更张","积习难改","根深蒂固","沧海桑田"],"answer":1,"optionReasons":{"改弦更张":"该词通常表示“更：改换；张：给乐器上弦。改换、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法”，侧重点是“改变”。题干则着重““多年养成的习惯难以改变””，语义指向不同。","根深蒂固":"该词表示“蒂：草木之根。比喻基础稳固。（中性）（侧重深）”。虽然可能与正确词相近，但这道题的关键信息是““多年养成的习惯难以改变””，仍以“积习难改”更贴合。","沧海桑田":"该词通常表示“沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大”，侧重点是“变化巨大”。题干则着重““多年养成的习惯难以改变””，语义指向不同。"}},{"id":"Q156","word":"势在必行","level":"A","group":"第33组","category":"顺势造势","stem":"随着老龄人口增加，完善无障碍设施已经不是可选项，而是____。","clue":"“客观形势决定必须去做”","options":["势在必行","推波助澜","顺势而为","顺水推舟"],"answer":0,"optionReasons":{"推波助澜":"该词通常表示“澜：大的波浪。比喻推动、助长事物的声势及发展。（中性词）”，侧重点是“造势”。题干则着重““客观形势决定必须去做””，语义指向不同。","顺势而为":"该词表示“顺应形势做事情”。虽然可能与正确词相近，但这道题的关键信息是““客观形势决定必须去做””，仍以“势在必行”更贴合。","顺水推舟":"该词通常表示“舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事”，侧重点是“造势”。题干则着重““客观形势决定必须去做””，语义指向不同。"}},{"id":"Q157","word":"顺水推舟","level":"A","group":"第33组","category":"顺势造势","stem":"听到双方已有合作意向，协调员便____提出联合试点建议，促成项目落地。","clue":"“顺应既有趋势推动事情成功”","options":["顺水推舟","势在必行","顺势而为","推波助澜"],"answer":0,"optionReasons":{"势在必行":"该词通常表示“势：形势。客观形势决定必须这样做”，侧重点是“顺势”。题干则着重““顺应既有趋势推动事情成功””，语义指向不同。","顺势而为":"该词通常表示“顺应形势做事情”，侧重点是“顺势”。题干则着重““顺应既有趋势推动事情成功””，语义指向不同。","推波助澜":"该词表示“澜：大的波浪。比喻推动、助长事物的声势及发展。（中性词）”。虽然可能与正确词相近，但这道题的关键信息是““顺应既有趋势推动事情成功””，仍以“顺水推舟”更贴合。"}},{"id":"Q158","word":"理所当然","level":"A","group":"第34组","category":"自然会发生","stem":"公共资源应当公平向公众开放，这是从基本原则出发____的要求。","clue":"“从道理上说本应如此”","options":["水到渠成","顺其自然","理所当然","天经地义"],"answer":2,"optionReasons":{"水到渠成":"该词通常表示“意思是当水流到某处时，自然会形成一条水道。这个成语用来比喻当条件成熟时，事情会自然成功，并不需要强求”，侧重点是“自然会发生”。题干则着重““从道理上说本应如此””，语义指向不同。","顺其自然":"该词表示“意思是顺着事物本来的性质自然发展”。虽然可能与正确词相近，但这道题的关键信息是““从道理上说本应如此””，仍以“理所当然”更贴合。","天经地义":"该词表示“指天地间理所当然而不能改变的道理；也指理所当然，不容置疑的问题”。虽然可能与正确词相近，但这道题的关键信息是““从道理上说本应如此””，仍以“理所当然”更贴合。"}},{"id":"Q159","word":"顺其自然","level":"A","group":"第34组","category":"自然会发生","stem":"孩子需要兴趣探索的空间，不必替他安排好每一项选择，有时不妨____。","clue":"“尊重自然发展而不强行干预”","options":["顺其自然","顺水推舟","顺势而为","理所当然"],"answer":0,"optionReasons":{"顺水推舟":"该词通常表示“舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事”，侧重点是“造势”。题干则着重““尊重自然发展而不强行干预””，语义指向不同。","顺势而为":"该词通常表示“顺应形势做事情”，侧重点是“顺势”。题干则着重““尊重自然发展而不强行干预””，语义指向不同。","理所当然":"该词表示“指从道理上讲，应该如此”。虽然可能与正确词相近，但这道题的关键信息是““尊重自然发展而不强行干预””，仍以“顺其自然”更贴合。"}},{"id":"Q160","word":"后继无人","level":"B","group":"第2组","category":"文化传承","stem":"许多老工匠相继退休，年轻人又不愿学艺，这项濒危技艺正面临____的难题。","clue":"“传承事业找不到接班人”","options":["不绝如缕","继往开来","承上启下","后继无人"],"answer":3,"optionReasons":{"不绝如缕":"该词通常表示“绝：断。缕：细线。像一根细线那样，似断非断。也作“不绝若线”。比喻情势危急”，侧重点是“传承不间断”。题干则着重““传承事业找不到接班人””，语义指向不同。","继往开来":"该词表示“继承前人的事业，开辟未来的道路”。虽然可能与正确词相近，但这道题的关键信息是““传承事业找不到接班人””，仍以“后继无人”更贴合。","承上启下":"该词表示“接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡”。虽然可能与正确词相近，但这道题的关键信息是““传承事业找不到接班人””，仍以“后继无人”更贴合。"}},{"id":"Q161","word":"血脉相通","level":"B","group":"第2组","category":"文化传承","stem":"两地民众虽相隔千里，却拥有深厚的历史渊源和共同文化记忆，情感上____。","clue":"“关系深厚、像同一血脉一样亲近”","options":["血脉相通","承上启下","不绝如缕","继往开来"],"answer":0,"optionReasons":{"承上启下":"该词通常表示“接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡”，侧重点是“传承方式”。题干则着重““关系深厚、像同一血脉一样亲近””，语义指向不同。","不绝如缕":"该词表示“绝：断。缕：细线。像一根细线那样，似断非断。也作“不绝若线”。比喻情势危急”。虽然可能与正确词相近，但这道题的关键信息是““关系深厚、像同一血脉一样亲近””，仍以“血脉相通”更贴合。","继往开来":"该词通常表示“继承前人的事业，开辟未来的道路”，侧重点是“传承方式”。题干则着重““关系深厚、像同一血脉一样亲近””，语义指向不同。"}},{"id":"Q162","word":"陈陈相因","level":"B","group":"第2组","category":"文化传承","stem":"这套教材十年不作更新，年年照搬旧内容，讲法越来越____。","clue":"“沿袭老一套，没有改进”","options":["承上启下","陈陈相因","继往开来","不绝如缕"],"answer":1,"optionReasons":{"承上启下":"该词通常表示“接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡”，侧重点是“传承方式”。题干则着重““沿袭老一套，没有改进””，语义指向不同。","继往开来":"该词通常表示“继承前人的事业，开辟未来的道路”，侧重点是“传承方式”。题干则着重““沿袭老一套，没有改进””，语义指向不同。","不绝如缕":"该词表示“绝：断。缕：细线。像一根细线那样，似断非断。也作“不绝若线”。比喻情势危急”。虽然可能与正确词相近，但这道题的关键信息是““沿袭老一套，没有改进””，仍以“陈陈相因”更贴合。"}},{"id":"Q163","word":"弃旧图新","level":"B","group":"第3组","category":"改革创新","stem":"面对过去的错误经营理念，企业终于决定彻底舍弃旧路、另谋新生，开始____。","clue":"“抛弃旧东西，转向新的道路”","options":["吐故纳新","革故鼎新","弃旧图新","去芜存菁"],"answer":2,"optionReasons":{"吐故纳新":"该词表示“纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻扬弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）”。虽然可能与正确词相近，但这道题的关键信息是““抛弃旧东西，转向新的道路””，仍以“弃旧图新”更贴合。","革故鼎新":"该词表示“革：除去。鼎新：立新。指革除旧的，建立新的。多指改朝换代或重大变革。（多政治
