</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brandlogo">习</div><strong>语境词卡</strong><small>国考逻辑填空 · 本地学习版</small></div><div class="nav-title">LEARNING SPACE</div><nav id="nav"></nav><div class="side-foot">四海公考40组分类｜教材释义｜200道原创语境练习<br>数据仅保存在本机浏览器。</div></aside><div class="main"><div class="topline"><span>国考 · 言语理解 · 逻辑填空</span><span id="today"></span></div><div id="content"></div><div class="footnote">资料依据：用户提供的《四海高频成语实词1000词（上册）》及2021—2026年六套国考副省级网友回忆版试卷。词条释义依据教材进行整理；语境练习为本项目原创，不是官方真题，也不代表预测必考。教材中不支持的旧表误收录词已剔除。</div></div></div><div id="modal-root"></div><nav class="sticky-mobile" id="mobile-nav"></nav>
<script>const DATA={"vocab":[{"word":"博大精深","level":"S","group":"第1组","category":"中华文明传统文化","sub":"形容中华文化","meaning":"博大：广大。精深：精湛深刻。形容学识、思想、理论广博丰富，精湛深刻","example":"有人惊叹，祖国的语言文字博大精深，过去却知之不多，真是惭愧。","pdfpage":10,"usage":"常用于描述文化、思想、知识体系的历史、深度和包容性。","clue":"“内涵丰富、思想深刻”要求既广博又精深","myexample":"一部地方文化史若只罗列节庆名称，就难以展现传统文化内涵之丰富、思想之深刻，更无法让人领略其博大精深的魅力。","contrasts":[{"other":"历久弥新","note":"同属“中华文明传统文化”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"历久弥新","level":"S","group":"第1组","category":"中华文明传统文化","sub":"形容中华文化","meaning":"弥：更加。指经历长久的时间而更加鲜活，更加有活力，更显价值","example":"富强作为一种价值追求，不仅为当代中国社会普遍认同，而且深深积淀在中华传统文化中，堪称历久弥新。","pdfpage":10,"usage":"常用于描述文化、思想、知识体系的历史、深度和包容性。","clue":"“年代久远却更有活力”","myexample":"这项古老的民间技艺并未被时间淘汰，反而因为不断融入现代生活，显得历久弥新。","contrasts":[{"other":"博大精深","note":"同属“中华文明传统文化”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"承上启下","level":"S","group":"第2组","category":"文化传承","sub":"传承方式","meaning":"接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡","example":"在这篇论文中，第三章起到了承上启下的作用，它总结了前两章的研究成果，并为后续章节的深入讨论打下了坚实的基础。","pdfpage":15,"usage":"关注“传承是否连续、采用何种传承方式、能否继续”三个层次。","clue":"“总结前文、引出后文”的连接作用","myexample":"报告的第三部分先总结前期探索，再引出下一阶段改革方案，恰好发挥了承上启下的作用。","contrasts":[{"other":"继往开来","note":"同属“文化传承”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"继往开来","level":"S","group":"第2组","category":"文化传承","sub":"传承方式","meaning":"继承前人的事业，开辟未来的道路","example":"林剑说，在中欧建交50周年这一承上启下的重要时间点，中方期待欧方同中方一道，秉持建交初心，坚持伙伴定位，加强对话合作，妥处分歧差异，推动中欧关系继往开来，书写更多更加精彩成功的中欧合作故事。","pdfpage":15,"usage":"关注“传承是否连续、采用何种传承方式、能否继续”三个层次。","clue":"“继承前人并开辟未来”两层意思缺一不可","myexample":"新一代研究者既珍惜前辈积累的成果，又主动开拓全新方向，力求在学术道路上继往开来。","contrasts":[{"other":"承上启下","note":"同属“文化传承”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"吐故纳新","level":"S","group":"第3组","category":"改革创新","sub":"改良旧的换新的","meaning":"纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻扬弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）","example":"换届，就要吐故纳新，换出新精神，新思路和新气象。","pdfpage":17,"usage":"重点区分除旧、创新、筛选精华与制度变革的对象。","clue":"“扬弃旧的、吸收新的”","myexample":"传统产业不能只守着过去的工艺，而应在淘汰落后环节、吸收新技术的过程中不断吐故纳新。","contrasts":[{"other":"革故鼎新","note":"同属“改革创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"革故鼎新","level":"S","group":"第3组","category":"改革创新","sub":"改良旧的换新的","meaning":"革：除去。鼎新：立新。指革除旧的，建立新的。多指改朝换代或重大变革。（多政治角度）","example":"太平天国定都南京后，革故鼎新，颁布《天朝田亩制》。","pdfpage":18,"usage":"重点区分除旧、创新、筛选精华与制度变革的对象。","clue":"“旧制度革除、新制度建立”的重大变革","myexample":"面对长期积累的制度性障碍，改革不能仅做局部修补，而需破除旧机制、建立新体系，体现革故鼎新的决心。","contrasts":[{"other":"推陈出新","note":"前者侧重去旧取新、创造新内容；后者更强调改革旧弊、建立新局面。"}]},{"word":"不落窠臼","level":"S","group":"第4组","category":"做法、构思创新","sub":"与众不同","meaning":"意为不落俗套，有独创风格（多用于形容文章或艺术作品）","example":"可以说，周思辉对何其芳新月时期、京派时期思想和艺术的研究有着自己独特的分析，他的见解总是不落窠臼，论述中时见新意，这是非常难得的。","pdfpage":26,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“文章艺术不落俗套”的独创性","myexample":"这部小说没有套用常见的英雄成长模板，叙事结构与人物塑造都不落窠臼，令人耳目一新。","contrasts":[{"other":"别出心裁","note":"前者强调突破旧套式；后者强调构思新巧。"}]},{"word":"别出心裁","level":"S","group":"第4组","category":"做法、构思创新","sub":"心思独特、创新","meaning":"心裁：内心的决断。另外想出与众不同的办法、主意。也作“独出心裁”。（侧重想法构思巧妙）","example":"6月16日上午，在国网庆城县供电公司组织的“安全月”宣传活动中，一份别出心裁的安全宣传“资料”吸引了广大群众前来围观。","pdfpage":24,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“另想出巧妙的办法和构思”","myexample":"展馆设计师没有照搬传统展柜，而是想到让观众沿着时间轴穿行的展示办法，可谓别出心裁。","contrasts":[{"other":"不落窠臼","note":"前者强调突破旧套式；后者强调构思新巧。"}]},{"word":"匠心独运","level":"S","group":"第4组","category":"做法、构思创新","sub":"心思独特、创新","meaning":"匠心：精巧的心思。具有独到的创造性。多指文学艺术的创作构思。同“独具匠心”“匠心独运”。（侧重文艺创作的心思巧妙）","example":"博物馆任意门、博物馆翻翻看、文物卷轴……“龙江博物馆文物旅行箱”以匠心独运的形式将各类互动创新体验与龙江文化相结合，通过自然、历史和艺术三个板块诠释龙江精品。","pdfpage":24,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“艺术创作中的精巧独到心思”","myexample":"纪录片导演将古画的留白转换为镜头语言，让历史人物仿佛走出画面，艺术构思实在匠心独运。","contrasts":[{"other":"不落窠臼","note":"同属“做法、构思创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"因循守旧","level":"S","group":"第5组","category":"守旧不创新","sub":"形容守旧不创新","meaning":"因循：沿用旧办法。指一直沿用旧办法而不加改变。（侧重新与旧）","example":"调整改革后，面对“小机关、大部队”的新体制，如何走出因循守旧的“老套路”，打破守旧、守常、守成等习惯性思维的“旧束缚”，真正迎来部队建设的大发展、大突破？","pdfpage":28,"usage":"评价机械沿用旧办法、固守传统的行为，语境多含批评。","clue":"“沿用旧办法不改变”","myexample":"技术和用户需求已经改变，这家公司仍然机械沿用二十年前的流程，管理上明显因循守旧。","contrasts":[{"other":"墨守成规","note":"前者固守现成规章不肯改变；后者沿袭旧做法，不求创新。"}]},{"word":"固步自封","level":"S","group":"第5组","category":"守旧不创新","sub":"形容守旧不创新","meaning":"封：限制在一定的范围内。比喻因循守旧，安于现状，不求创新进取。（侧重开放与封闭）","example":"他们非常注意世界科学的新动向，紧紧跟上科学发展的步伐，决不固步自封。","pdfpage":29,"usage":"评价机械沿用旧办法、固守传统的行为，语境多含批评。","clue":"“安于现状、封闭自己、不求进取”","myexample":"一个城市若满足于已有优势，拒绝学习外部经验、也不愿开放合作，就会在固步自封中失去活力。","contrasts":[{"other":"因循守旧","note":"同属“守旧不创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"举步维艰","level":"S","group":"第7组","category":"处境困难","sub":"处境艰难","meaning":"抬脚行走十分困难。形容已陷入十分艰难的处境","example":"同时，我们也要看到，世界经济下行风险和不确定性在同步上升，多边贸易谈判举步维艰，《巴黎协定》落实遭遇阻力。","pdfpage":38,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“整体处境艰难、每一步都困难”","myexample":"资金断裂、设备陈旧、人才流失接连发生，这个小团队的转型已是举步维艰。","contrasts":[{"other":"骑虎难下","note":"前者形容推进艰难；后者形容事情开始后难以停止、进退两难。"}]},{"word":"骑虎难下","level":"S","group":"第7组","category":"处境困难","sub":"不好抉择","meaning":"骑在虎背上难以下来。比喻事情遇到困难，迫于形势不能中止，陷入进退两难的境地。（侧重同一件事已经开始了就难以停止）","example":"因为当初没人，我勉强承担这个活，到现在已是骑虎难下了。","pdfpage":36,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“已开始而难以停下，进退两难”","myexample":"项目启动后才发现成本远超预算，但退出又要承担巨额违约损失，负责人一时骑虎难下。","contrasts":[{"other":"举步维艰","note":"前者形容推进艰难；后者形容事情开始后难以停止、进退两难。"}]},{"word":"危在旦夕","level":"S","group":"第8组","category":"形势危险","sub":"侧重时间","meaning":"旦夕：早晨和晚上，形容时间短。形容危险就在眼前","example":"李先生（化名）在单位突发心梗晕倒，被发现后就近送往萧县人民医院抢救，当时患者已错过最佳抢救时间，心脏出现多次停跳，生命危在旦夕。","pdfpage":44,"usage":"先判断是生命危险、局势动荡，还是时间紧迫。","clue":"“危险就在眼前、随时可能发生”","myexample":"暴雨导致山体出现大面积裂缝，附近房屋随时可能被冲毁，居民安全危在旦夕。","contrasts":[{"other":"岌岌可危","note":"同属“形势危险”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"岌岌可危","level":"S","group":"第8组","category":"形势危险","sub":"形势危险","meaning":"岌岌：山高陡峭，就要倒下的样子。形容非常危险，快要倾覆或灭亡","example":"古特雷斯当天在位于纽约的美国自然历史博物馆发表讲话说，2024年5月是有记录以来最热的5月，全球单月平均气温已连续12个月刷新同期最高值，将长期气候变暖限制在1.5摄氏度以内的目标已经岌岌可危。","pdfpage":41,"usage":"先判断是生命危险、局势动荡，还是时间紧迫。","clue":"“处于快要倾覆或灭亡的险境”","myexample":"长期亏损又失去主要客户后，这家企业的正常经营已经岌岌可危，稍有冲击就可能崩溃。","contrasts":[{"other":"危在旦夕","note":"同属“形势危险”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"如火如荼","level":"S","group":"第9组","category":"事物出现、发展、衰落","sub":"发展势头好","meaning":"原比喻军容之盛，现在形容旺盛、热烈或激烈","example":"放眼北疆各大项目现场，处处呈现出如火如荼的建设场面。","pdfpage":50,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“活动开展热烈、气氛旺盛”","myexample":"全市各校踊跃参与科普活动，讲座、展览和实验体验相继举办，活动开展得如火如荼。","contrasts":[{"other":"方兴未艾","note":"前者强调正在兴起、尚未停止；后者强调气势旺盛、场面热烈。"}]},{"word":"方兴未艾","level":"S","group":"第9组","category":"事物出现、发展、衰落","sub":"出现、萌生","meaning":"意思是事物正在发展，尚未达到止境","example":"随着大数据、人工智能等数字技术在农业领域的广泛应用，智慧农业在许多国家方兴未艾。","pdfpage":48,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“正在兴起并持续发展，尚未达到终点”","myexample":"城市更新刚刚形成发展势头，新的服务场景还在不断涌现，相关探索可谓方兴未艾。","contrasts":[{"other":"如火如荼","note":"前者强调正在兴起、尚未停止；后者强调气势旺盛、场面热烈。"}]},{"word":"日新月异","level":"S","group":"第9组","category":"事物出现、发展、衰落","sub":"形容发展迅速","meaning":"形容发展变化很快，新事物、新气象不断出现","example":"我工作的地方，如今建起了高楼大厦，马路变宽了，环境变美了，城市面貌日新月异的变化令人振奋。","pdfpage":52,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“天天有新变化，发展变化快”","myexample":"近十年，智能制造从单机自动化迈向协同生产，新设备、新工艺不断涌现，技术进步日新月异。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"日渐式微","level":"S","group":"第9组","category":"事物出现、发展、衰落","sub":"逐渐衰落","meaning":"事物逐渐地由兴盛而衰落","example":"牛墟鼎盛时日交易量上千头，牛客来自全国各地，如今随着时代变迁，日渐式微。","pdfpage":53,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“事物由盛到衰、逐渐弱化”","myexample":"随着年轻人转向线上娱乐，曾经热闹的街头录像厅逐步冷清，传统经营模式日渐式微。","contrasts":[{"other":"江河日下","note":"前者侧重逐渐衰落；后者强调情况不断恶化、向下发展。"}]},{"word":"望尘莫及","level":"S","group":"第10组","category":"竞争比较","sub":"赶得上/赶不上","meaning":"莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦","example":"中国移动一骑绝尘，联通和电信望尘莫及，这或许是对三家运营商4G用户发展最形象的描述。","pdfpage":64,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“差距过大，远远追赶不上”","myexample":"在基础算法领域，后起团队虽然进步明显，但与顶尖机构之间仍有巨大差距，短期内只能望尘莫及。","contrasts":[{"other":"相形见绌","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"相形见绌","level":"S","group":"第10组","category":"竞争比较","sub":"和别人相比较","meaning":"形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足","example":"与中国的西进战略比起来，西澳大利亚州吸引东部诸州人口的努力相形见绌。","pdfpage":59,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“与同类事物比较后显出不足”","myexample":"同样面对极端天气，新型预警系统响应迅速，旧设备的处理能力便显得相形见绌。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"相提并论","level":"S","group":"第10组","category":"竞争比较","sub":"同等地位","meaning":"把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）","example":"他们两人差别太大，怎么可以相提并论。","pdfpage":65,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“差距明显，不能放在同一层次评价”","myexample":"这两种材料的性能差距悬殊，不能仅凭价格相近就把它们相提并论。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"应接不暇","level":"S","group":"第11组","category":"能力不足","sub":"应付不了","meaning":"暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）","example":"火车站的问事处挤满了人，工作人员应接不暇。","pdfpage":73,"usage":"区分有心无力、忙不过来、资源短缺与无计可施。","clue":"“任务太多、忙得应付不过来”","myexample":"周末博物馆接待量骤增，工作人员要引导观众、答疑并处理预约事务，一时间应接不暇。","contrasts":[{"other":"顾此失彼","note":"同属“能力不足”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"顾此失彼","level":"S","group":"第11组","category":"能力不足","sub":"应付不了","meaning":"顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）","example":"保障粮食安全、促进农民增收、推进农业可持续发展等，都是我国农业支持政策要实现的重要目标，不能顾此失彼甚至对立起来。","pdfpage":72,"usage":"区分有心无力、忙不过来、资源短缺与无计可施。","clue":"“照顾一面、忽略另一面”","myexample":"设计方案过分追求页面美观，却忽略老年用户的操作便利，难免顾此失彼。","contrasts":[{"other":"捉襟见肘","note":"前者是资源或能力不足以应付；后者是顾一头、失另一头。"}]},{"word":"蜻蜓点水","level":"S","group":"第12组","category":"印象和效果","sub":"形容学习粗浅","meaning":"比喻进行某些动作时只轻轻接触表面。也比喻肤浅不深入","example":"治标不治本、蜻蜓点水式的清理，最终只能是“换汤不换药”。","pdfpage":77,"usage":"辨别浅层接触、理解不深、综合掌握与类推能力。","clue":"“接触表面、研究不深入”","myexample":"调研组在每个村只停留几分钟，既不深入访谈也不核实数据，这样蜻蜓点水的调查难以发现真问题。","contrasts":[{"other":"走马观花","note":"前者侧重粗略观察；后者侧重做事或学习不深入。"}]},{"word":"融会贯通","level":"S","group":"第12组","category":"印象和效果","sub":"形容学到一点就能推知更多","meaning":"融会：融合。贯通：全面透彻地了解。指把各方面的知识、道理融合贯穿，从而获得对事物全面、透彻地理解和领悟。（侧重融合）","example":"如何做到在讲好中国故事的同时与世界对话，把我们的好东西介绍到国外，把国外好的东西引进来，洋为中用，做到中西合璧、融会贯通，是文学工作者必须破解的难题。","pdfpage":78,"usage":"辨别浅层接触、理解不深、综合掌握与类推能力。","clue":"“不同知识融合起来并透彻理解”","myexample":"学完统计、编程和经济学以后，他能将三门知识联系起来分析社会现象，真正做到了融会贯通。","contrasts":[{"other":"触类旁通","note":"前者强调把知识融合理解并贯通；后者强调由一种知识推知类似知识。"}]},{"word":"相得益彰","level":"S","group":"第13组","category":"搭档配合","sub":"合作配合","meaning":"相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来","example":"小王的男中音和老张的手风琴伴奏相得益彰，更富有艺术感染力。","pdfpage":80,"usage":"看两者是相互促进、互补协调，还是彼此映衬。","clue":"“两方结合后各自优势更明显”","myexample":"传统园林的空间美感和现代灯光的精细设计彼此衬托，让夜游体验更加出色，二者相得益彰。","contrasts":[{"other":"相辅相成","note":"前者相互辅助、促进；后者相互配合使各自优点更加显著。"}]},{"word":"相辅相成","level":"S","group":"第13组","category":"搭档配合","sub":"合作配合","meaning":"辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可","example":"丰富的知识和健康的身体是事业成功的基础，二者相辅相成，缺一不可。","pdfpage":80,"usage":"看两者是相互促进、互补协调，还是彼此映衬。","clue":"“相互帮助、相互促进，缺一不可”","myexample":"提升服务效率需要技术创新，也离不开流程优化，二者彼此促进、缺一不可，应当相辅相成。","contrasts":[{"other":"相得益彰","note":"前者相互辅助、促进；后者相互配合使各自优点更加显著。"}]},{"word":"南辕北辙","level":"S","group":"第15组","category":"错误抉择和方向","sub":"相悖、相反","meaning":"辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标与做法相反）","example":"如果一方面盼望有功于“世道人心”的文艺，而同时又不许文艺作品带着强心和清泻的药品，这何异南辕北辙？","pdfpage":88,"usage":"判定错在目标方向、主次关系，还是方式方法。","clue":"“行动方向与目标完全相反”","myexample":"政策本想减轻企业负担，却设计出更多重复审批环节，实际措施与既定目标南辕北辙。","contrasts":[{"other":"缘木求鱼","note":"前者做法根本不可能达到目的；后者行动方向与目标相反。"}]},{"word":"缘木求鱼","level":"S","group":"第15组","category":"错误抉择和方向","sub":"相悖、相反","meaning":"缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）","example":"脱离经济发展抓环境保护是“缘木求鱼”，离开环境保护搞经济发展是“竭泽而渔”，正确的经济政策就是正确的环境政策。","pdfpage":89,"usage":"判定错在目标方向、主次关系，还是方式方法。","clue":"“达到目标的方法方向错误”","myexample":"治堵只增加道路宽度，却不改善公共交通与出行结构，想从根本上缓解拥堵恐怕是缘木求鱼。","contrasts":[{"other":"南辕北辙","note":"前者做法根本不可能达到目的；后者行动方向与目标相反。"}]},{"word":"舍本逐末","level":"S","group":"第15组","category":"错误抉择和方向","sub":"错误抉择","meaning":"舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置","example":"这样的分析和议论，选择性忽视了两个赞助对于体育事业发展的裨益，而纠结于所谓的营销效果，属于舍本逐末的“跑偏”。","pdfpage":86,"usage":"判定错在目标方向、主次关系，还是方式方法。","clue":"“抛开根本、追逐枝节”","myexample":"课堂改革如果只追求花哨的演示效果，却忽略学生是否真正理解知识，便是舍本逐末。","contrasts":[{"other":"南辕北辙","note":"同属“错误抉择和方向”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"削足适履","level":"S","group":"第16组","category":"错误做法（寓言故事）","sub":"错误做法","meaning":"履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套","example":"倘若作者如此牺牲了书写的自由，即使极小部分，也无异于削足适履。","pdfpage":91,"usage":"错误行为通常由具体寓言引申，注意事件结构。","clue":"“不顾实际条件、生搬硬套”","myexample":"各地资源条件差异明显，若强令所有地区照搬同一种产业模式，无异于削足适履。","contrasts":[{"other":"越俎代庖","note":"同属“错误做法（寓言故事）”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"越俎代庖","level":"S","group":"第16组","category":"错误做法（寓言故事）","sub":"错误做法","meaning":"越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情","example":"孩子能做的事，父母不要越俎代庖。","pdfpage":90,"usage":"错误行为通常由具体寓言引申，注意事件结构。","clue":"“超越自己的职权替别人办事”","myexample":"本应由专业技术人员独立判断的方案，行政部门却越过职责边界直接指定参数，属于越俎代庖。","contrasts":[{"other":"削足适履","note":"同属“错误做法（寓言故事）”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"潜移默化","level":"S","group":"第17组","category":"教育影响批评","sub":"影响感化","meaning":"潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）","example":"精神文明建设关键要认真抓、切实干，做到潜移默化、春风化雨，引导群众树立文明观念、争当文明公民。","pdfpage":94,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“长期、无声、渐渐影响人的行为”","myexample":"每天接触有秩序的公共环境，居民逐渐养成文明排队的习惯，改变在潜移默化中发生。","contrasts":[{"other":"耳濡目染","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"耳濡目染","level":"S","group":"第17组","category":"教育影响批评","sub":"影响感化","meaning":"濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）","example":"环保行为的养成仅靠大道理还不够，还需要家庭的耳濡目染和社会的良好氛围。","pdfpage":94,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“长期经常看见听见而受影响”","myexample":"她从小常看父亲修复古籍、听母亲讲文物故事，在家庭环境的耳濡目染下对文化保护产生兴趣。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"醍醐灌顶","level":"S","group":"第17组","category":"教育影响批评","sub":"醒悟、唤醒","meaning":"醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快","example":"母亲漫不经心说出的一句“有钱难买回头看”，让我顿时有一种醍醐灌顶的顿悟和追悔莫及的反思。","pdfpage":98,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“一个点拨使人豁然醒悟”","myexample":"老师用一个简单的反例点明推理漏洞，他才猛然醒悟，顿觉醍醐灌顶。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"心无旁骛","level":"S","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志","example":"只有逐步建立与现实对接的待遇增长机制，才能让我们的干部干事创业心无旁骛、后顾无忧。","pdfpage":103,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“不分心、专注唯一目标”","myexample":"攻关期间，他关闭社交软件，把全部精力都放在关键实验上，真正做到了心无旁骛。","contrasts":[{"other":"殚精竭虑","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"殚精竭虑","level":"S","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"殚：竭尽。用尽精力和心思","example":"王教授为了钻研这个课题，殚精竭虑，废寝忘食。","pdfpage":101,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“耗尽精力与心思”","myexample":"为了找到既安全又经济的解决方案，研究团队反复验证数百种组合，几乎殚精竭虑。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"筚路蓝缕","level":"S","group":"第18组","category":"工作学习状态","sub":"辛苦奔波","meaning":"筚路：柴车。蓝缕：又旧又破的衣服。意思是驾着柴车穿着破旧衣服去开辟山林。现用来形容创业的艰难与辛苦。也作“荜路蓝缕”。（词义有拓展，也可形容事情发展的初期阶段）","example":"台湾是经过一代代中国人筚路蓝缕辛勤开发，才有今天的建设成就。赖清德为了其“台独”妄想，企图泯灭岛内青少年和民众的中华民族意识，把荷兰殖民者抢占台湾的1624年，当作“开启台湾全球化的开端”。","pdfpage":107,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“创业开拓条件艰苦”","myexample":"早期建设者靠简陋工具在荒地上开辟科研基地，回望这段筚路蓝缕的创业历程令人敬佩。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"提纲挈领","level":"S","group":"第19组","category":"正确做法","sub":"抓住问题关键","meaning":"意思是抓住事物的关键部分或者核心要点，然后用简洁明了的方式进行概述或表达","example":"面对错综复杂的矛盾问题，要善于抓住主要矛盾，做到提纲挈领，才能精准聚焦、迎刃而解。","pdfpage":113,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"“抓住要点、简洁统领全局”","myexample":"向新员工讲述复杂业务流程时，负责人先列出最核心的三个环节，讲解便提纲挈领。","contrasts":[{"other":"纲举目张","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"纲举目张","level":"S","group":"第19组","category":"正确做法","sub":"抓住问题关键","meaning":"指提起大网的总绳一撒，所有的网眼就都张开。比喻抓住事物的主要环节，就可带动一切","example":"在中央经济工作会议上，习近平总书记强调：“明年经济工作千头万绪，要从战略全局出发，抓主要矛盾，从改善社会心理预期、提振发展信心入手，抓住重大关键环节，纲举目张做好工作。”","pdfpage":112,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"“抓住主要环节从而带动其他”","myexample":"只要建立清晰的责任体系和评价标准，后续各项工作就能顺势展开，达到纲举目张的效果。","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"于事无补","level":"S","group":"第20组","category":"错误做法","sub":"不能这样做","meaning":"指某种言行对于解决问题没有帮助","example":"一些企业经常提及追赶“新赛道”，什么火就转做什么，认为只有追赶新风口，业绩才能起飞；如果赛道老旧，那么企业再努力也于事无补。","pdfpage":119,"usage":"多含批评，要注意错误做法造成的具体后果。","clue":"“某种行为对解决眼前问题没有帮助”","myexample":"系统已经发生数据丢失，此时互相指责于事无补，当务之急是启动备份恢复。","contrasts":[{"other":"过犹不及","note":"同属“错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"过犹不及","level":"S","group":"第20组","category":"错误做法","sub":"不能这样做","meaning":"过：过分。不及：不够。事情做得过了头，就跟做得不够一样，都不合适","example":"偶尔、适量的召回，可被看作车企责任感的体现。然而，过犹不及，如若因为有召回制度的存在，便放松对于质量的要求，将召回当饭吃、当枪使，则绝非一个负责任的车企该有的态度。","pdfpage":118,"usage":"多含批评，要注意错误做法造成的具体后果。","clue":"“过度与不足同样不合适”","myexample":"孩子需要适当引导，但家长若事事包办、管得太多，反倒限制独立能力，可谓过犹不及。","contrasts":[{"other":"于事无补","note":"同属“错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"亦步亦趋","level":"S","group":"第21组","category":"某些国家的错误做法","sub":"不能这样做","meaning":"步：走。趋：快走。比喻因缺乏主见，任何事都模仿、追随他人。（侧重行动）","example":"没有一个民族和国家可以通过依赖外部力量、跟在他人后面亦步亦趋实现强大和振兴。","pdfpage":126,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"“缺乏主见地跟随别人行动”","myexample":"这家企业研发从不提出独立思路，只是别人发布什么产品它就立刻模仿，长期亦步亦趋。","contrasts":[{"other":"以邻为壑","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"以邻为壑","level":"S","group":"第21组","category":"某些国家的错误做法","sub":"不能这样做","meaning":"壑：深沟。意为把邻国当成排洪水的沟壑。后用来比喻把困难、灾祸推给别人。（多宏观语境，国家、城市、地区等）","example":"全球化时代，以邻为壑的利己主义做法换不来独善其身，惟有秉持科学、理性和负责任的态度，加强国际合作，携手应对挑战。","pdfpage":125,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"“把本地困难灾祸转嫁给邻近地区”","myexample":"上游地区只顾自己排涝，把洪水压力全部转嫁给下游，这种以邻为壑的做法损害区域合作。","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"袖手旁观","level":"S","group":"第21组","category":"某些国家的错误做法","sub":"旁观、得利","meaning":"袖手：把手揣在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）","example":"绝不在朋友落难时袖手旁观，绝不在伸出援手时夹杂私利，这就是中国之义。","pdfpage":127,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"“旁观而不提供帮助”","myexample":"面对邻居突发的火情，几位路人明明可以呼救协助却始终袖手旁观。","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"因势利导","level":"S","group":"第24组","category":"政府优秀做法","sub":"发挥职能","meaning":"因：顺着。势：趋势。利导：引导。指顺着事物的发展趋势而加以引导。（褒义）","example":"红寺堡区近年来采取大禹治水的办法，变堵为疏，因势利导，对一个个群众反映强烈的信访硬案采取“软着陆”的方式，实现了群体上访和信访积案双下降。","pdfpage":145,"usage":"“有针对性、发挥职能、集纳意见”是三类常见线索。","clue":"“顺着已存在的趋势加以积极引导”","myexample":"面对新技术带来的就业变化，政府没有简单禁止，而是顺着行业发展趋势提供培训、加强引导，体现了因势利导。","contrasts":[{"other":"正本清源","note":"同属“政府优秀做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"正本清源","level":"S","group":"第24组","category":"政府优秀做法","sub":"正确做法","meaning":"正本：从根本上整顿；清源：从源头上清理。从根本上整顿，从源头上清理。比喻从根本上加以整顿清理","example":"山东大学儒学高等研究院教授、孔子研究院原院长杨朝明讲述了他用数十年来的研究，为孔子、为儒学“正本清源”的心路历程。","pdfpage":147,"usage":"“有针对性、发挥职能、集纳意见”是三类常见线索。","clue":"“从根本上整顿、从源头清理”","myexample":"治理虚假信息不能只删除个别帖子，还要从传播机制和利益链源头整顿，真正做到正本清源。","contrasts":[{"other":"因势利导","note":"同属“政府优秀做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"量体裁衣","level":"S","group":"第24组","category":"政府优秀做法","sub":"有针对性","meaning":"按身材裁剪衣服。也比与按实际情况办事","example":"大企业是经济发展的顶梁柱，往往也存在着跨区域、多税种的复杂涉税诉求，这就更需要我们聚焦精细服务，做到量体裁衣。","pdfpage":143,"usage":"“有针对性、发挥职能、集纳意见”是三类常见线索。","clue":"“依据具体对象的条件量身制定方案”","myexample":"为不同规模企业制定扶持方案，必须根据其经营状况和实际需求量体裁衣，不能统一套用标准。","contrasts":[{"other":"因地制宜","note":"前者按地区环境因地施策；后者按具体对象、实际情况定办法。"}]},{"word":"一蹴而就","level":"S","group":"第26组","category":"政策措施的评价","sub":"有效果","meaning":"蹴：踏；就：成功。踏一步就可以获得成功，比喻事情很容易做。同“一蹴而得”。（多用于否定句中）","example":"他们认为胜利不能一蹴而就，必须用持久战。","pdfpage":154,"usage":"区分见效速度、长久有效、解决难题与根本治理。","clue":"“一步就成功，常用于否定句”","myexample":"完善基层治理需要长期磨合，不可能靠一次会议就一蹴而就。","contrasts":[{"other":"循序渐进","note":"前者强调逐步推进；后者强调一下子完成，常用于“不可能一蹴而就”。"}]},{"word":"标本兼治","level":"S","group":"第26组","category":"政策措施的评价","sub":"解决问题","meaning":"标本：事物的枝节和根本。从枝节和根本方面都得到治理","example":"必须对非法“灵修”类活动保持高压严打，深挖背后利益链条，寻求标本兼治。","pdfpage":155,"usage":"区分见效速度、长久有效、解决难题与根本治理。","clue":"“同时治理表面症状和根本原因”","myexample":"整治河流污染既要清理现有垃圾，又要从源头控制排放，才能做到标本兼治。","contrasts":[{"other":"对症下药","note":"前者针对具体问题采取有效对策；后者既治表象也治根源。"}]},{"word":"迎刃而解","level":"S","group":"第26组","category":"政策措施的评价","sub":"解决问题","meaning":"刃：刀刃。解：分开。把竹子劈开口，下面的一段竹子就迎着刀刃裂开了。比喻主要问题解决了，其他的问题就很容易解决。（常搭配“问题”）","example":"笔者以为，现在《解释》的出台，将使以上“三大难题”迎刃而解。","pdfpage":154,"usage":"区分见效速度、长久有效、解决难题与根本治理。","clue":"“关键解决后，其余问题很容易化解”","myexample":"一旦找到网络故障的根本原因，后续看似棘手的连接问题便会迎刃而解。","contrasts":[{"other":"立竿见影","note":"前者侧重效果立即出现；后者侧重问题解决顺利。"}]},{"word":"一筹莫展","level":"S","group":"第27组","category":"成功与失败","sub":"没能成功","meaning":"筹：计策。展：施展。一点计策也施展不出。形容没有一点办法","example":"几个农民要搞科研，想解决专家都一筹莫展的难题，谈何容易。","pdfpage":160,"usage":"区分轻松完成、临门失败、彻底无策与意外错失。","clue":"“毫无办法、计策施展不出”","myexample":"面对从未见过的技术故障，各种常规排查方法都失效，团队一时一筹莫展。","contrasts":[{"other":"功亏一篑","note":"同属“成功与失败”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"功亏一篑","level":"S","group":"第27组","category":"成功与失败","sub":"没能成功","meaning":"篑：盛土的筐，指一筐土。后用来比喻做事情只差最后一点而前功尽弃","example":"目前已到冲刺阶段，须防功亏一篑。","pdfpage":161,"usage":"区分轻松完成、临门失败、彻底无策与意外错失。","clue":"“仅差最后一步而前功尽弃”","myexample":"研发项目已经通过所有测试，却在提交前因备份失误丢失核心数据，最终功亏一篑。","contrasts":[{"other":"功败垂成","note":"都指接近成功时失败；功亏一篑更强调最后一点没完成。"}]},{"word":"一以贯之","level":"S","group":"第28组","category":"领导力","sub":"始终坚持","meaning":"指做人做事，按照一个道理，从始至终都不会改变。贯：一直，习惯","example":"加强纪律建设是全面从严治党的治本之策，必须把加强党的纪律建设作为永恒课题，把严的基调、严的措施、严的氛围长期坚持下去，推动管党治党一以贯之、一刻不停、一严到底。","pdfpage":168,"usage":"关注视野、统筹、带头践行和始终坚持等侧重点。","clue":"“从始至终坚持同一原则”","myexample":"从青年时期到退休以后，这位医生始终坚持以患者需求为中心，把同一信念一以贯之。","contrasts":[{"other":"一成不变","note":"前者是原则贯彻始终，未必贬义；后者指没有变化，语境常带批评。"}]},{"word":"深谋远虑","level":"S","group":"第28组","category":"领导力","sub":"眼界高考虑全","meaning":"计谋深远，考虑周密","example":"综合国力竞争说到底是人才竞争。人才是衡量一个国家综合国力的重要指标。这是一项深谋远虑的重大改革。","pdfpage":164,"usage":"关注视野、统筹、带头践行和始终坚持等侧重点。","clue":"“考虑深远且安排周密”","myexample":"面对产业链可能出现的长期风险，决策者提前布局基础研究，展现出深谋远虑的战略考虑。","contrasts":[{"other":"一以贯之","note":"同属“领导力”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"高瞻远瞩","level":"S","group":"第28组","category":"领导力","sub":"眼界高考虑全","meaning":"瞻：望。瞩：注视。登高望远。形容目光远大。（更宏观）","example":"亚投行、“一带一路”等宏大计划，显示出习近平的高瞻远瞩，也凸显了中国作为负责任大国的国际担当。","pdfpage":163,"usage":"关注视野、统筹、带头践行和始终坚持等侧重点。","clue":"“视野开阔、眼光长远”","myexample":"规划城市交通不能只看眼下车流，更要考虑未来几十年的空间结构，需要高瞻远瞩的眼光。","contrasts":[{"other":"一以贯之","note":"同属“领导力”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"好大喜功","level":"S","group":"第30组","category":"干部易犯错误","sub":"爱慕名利不务实","meaning":"喜欢做大事、立大功。多形容浮夸、不切实际的行为","example":"在现实生活中，有少数领导干部好大喜功，乐于做面子工程、政绩工程，喜欢“作秀”或者工作上务虚不务实，“雷声大、雨点小”。","pdfpage":177,"usage":"常见机关工作语境，关注浮夸、敷衍、逢迎、自保。","clue":"“不务实、喜欢做大事邀功”","myexample":"某些地方不顾财政承受能力，热衷铺摊子、造声势，只为显出政绩，是典型的好大喜功。","contrasts":[{"other":"好高骛远","note":"前者追求过高、不切实际的目标；后者一心追求大功劳。"}]},{"word":"敷衍塞责","level":"S","group":"第30组","category":"干部易犯错误","sub":"虚伪敷衍谄媚","meaning":"敷衍：马虎应付。塞责：搪塞责任。做事马虎，应付一下以搪塞责任","example":"严禁拒不执行组织决定和安排，严禁敷衍塞责、临危退缩等违反纪律行为，要积极主动参与救援，全力搜救失联人员，切实解决灾害处置中的困难问题。","pdfpage":179,"usage":"常见机关工作语境，关注浮夸、敷衍、逢迎、自保。","clue":"“马虎应付以搪塞责任”","myexample":"面对群众反映的问题，工作人员只发一份模板回复便草草结案，这种敷衍塞责必须纠正。","contrasts":[{"other":"好大喜功","note":"同属“干部易犯错误”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"明哲保身","level":"S","group":"第30组","category":"干部易犯错误","sub":"只顾自己、自扫门前雪","meaning":"明哲：聪明有智慧。指聪明有智慧之人，善于趋安避危，保全自身。也指为保全个人利益而回避原则问题的处世态度","example":"科研只能实事求是，不能明哲保身，否则受害的将是患者。","pdfpage":178,"usage":"常见机关工作语境，关注浮夸、敷衍、逢迎、自保。","clue":"“为保护个人利益回避原则问题”","myexample":"讨论公共安全隐患时，他明知问题严重，却因怕得罪人而保持沉默，只求明哲保身。","contrasts":[{"other":"好大喜功","note":"同属“干部易犯错误”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"文过饰非","level":"S","group":"第31组","category":"对待错误的态度","sub":"遮掩错误","meaning":"文、饰：掩饰；过、非：错误。用漂亮的言辞掩饰自己的过失和错误","example":"只要我们党牢牢坚持立党为公、执政为民，牢牢坚持为中国人民谋幸福、为中华民族谋复兴，不断检视自己，不掩饰缺点，不文过饰非，坚决同一切弱化党的先进性和纯洁性、危害党的肌体健康的现象作斗争，就一定能够始终立于不败之地。","pdfpage":189,"usage":"注意承认错误还是遮掩错误、是否愿意听取建议。","clue":"“用言辞掩盖自身过错”","myexample":"出现管理失误后，负责人没有承认错误，反而用漂亮话掩饰责任，试图文过饰非。","contrasts":[{"other":"欲盖弥彰","note":"前者强调掩饰过错；后者强调越掩饰越暴露。"}]},{"word":"欲盖弥彰","level":"S","group":"第31组","category":"对待错误的态度","sub":"遮掩错误","meaning":"盖：遮掩；弥：更加；彰：明显。想掩盖坏事的真相，结果反而更明显地暴露出来","example":"经济工作有自身不可违背的客观规律，舆论引导不能说空话、说假话、说外行话，否则会适得其反，必须坚持实事求是，是成绩就是成绩，是问题就是问题，承认问题并分析清楚、提出解决思路是市场利好，遮遮掩掩反而欲盖弥彰。","pdfpage":190,"usage":"注意承认错误还是遮掩错误、是否愿意听取建议。","clue":"“掩盖真相反而暴露得更明显”","myexample":"企业越是删除公开记录、阻止记者提问，越让公众怀疑其存在问题，真是欲盖弥彰。","contrasts":[{"other":"文过饰非","note":"前者强调掩饰过错；后者强调越掩饰越暴露。"}]},{"word":"闻过则喜","level":"S","group":"第31组","category":"对待错误的态度","sub":"谦虚接受建议","meaning":"过：过失；则：就。听到别人批评自己的缺点或错误，表示欢迎和高兴。指虚心接受意见","example":"对各种意见和批评，只要坚持党的基本理论、基本路线、基本方略，就要让大家讲，哪怕刺耳、尖锐一些，我们也要采取闻过则喜的态度，做到有则改之、无则加勉。","pdfpage":188,"usage":"注意承认错误还是遮掩错误、是否愿意听取建议。","clue":"“听到别人指出错误反而高兴”","myexample":"面对同事的尖锐批评，他不仅没有不悦，反而认真感谢并改进，做到了闻过则喜。","contrasts":[{"other":"文过饰非","note":"同属“对待错误的态度”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"改弦更张","level":"S","group":"第32组","category":"改变与不变","sub":"改变","meaning":"更：改换；张：给乐器上弦。改换、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法","example":"中国特色社会主义道路，开拓于中国人民共同奋斗，扎根于中华大地，是给中国人民带来幸福安宁的正确道路。无论遇到什么风浪，在坚持中国特色社会主义道路这个根本问题上都要一以贯之，决不因各种杂音噪音而改弦更张。","pdfpage":196,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"“改变旧制度或计划、方法”","myexample":"旧考核体系已不适合新岗位要求，管理部门决定重新调整评价方法、全面更换制度，可谓改弦更张。","contrasts":[{"other":"改弦易辙","note":"前者常指改革制度、方法；后者常指改变方向、方针或办法。"}]},{"word":"根深蒂固","level":"S","group":"第32组","category":"改变与不变","sub":"难以改变","meaning":"蒂：草木之根。比喻基础稳固。（中性）（侧重深）","example":"美国执法领域存在着根深蒂固的种族偏见。","pdfpage":200,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"“根基深、难以轻易改变”","myexample":"长期形成的浪费观念深植部分人的日常习惯，仅靠一次宣传很难撼动，可见其根深蒂固。","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"沧海桑田","level":"S","group":"第32组","category":"改变与不变","sub":"变化巨大","meaning":"沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大","example":"多年来，从无到有，从有到优，他们亲眼见证了一片又一片的大居发生了沧海桑田、翻天覆地的巨大变化。","pdfpage":199,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"“长时间带来的巨大变化”","myexample":"几十年前的荒漠如今已成为绿洲，见证当地生态面貌沧海桑田般的巨变。","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"推波助澜","level":"S","group":"第33组","category":"顺势造势","sub":"造势","meaning":"澜：大的波浪。比喻推动、助长事物的声势及发展。（中性词）","example":"在经济利益的驱动下，借助于网络、手机、微博等新媒体的推波助澜，各式广告无孔不入。","pdfpage":205,"usage":"判断顺应趋势还是助长事态，注意褒贬语境。","clue":"“进一步推动已有声势或发展”","myexample":"一些自媒体不断传播未经核实的消息，使原本不大的争议迅速升级，客观上起了推波助澜的作用。","contrasts":[{"other":"顺势而为","note":"同属“顺势造势”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"顺势而为","level":"S","group":"第33组","category":"顺势造势","sub":"顺势","meaning":"顺应形势做事情","example":"我们要因势而谋、应势而动、顺势而为，加快推动媒体融合发展，使主流媒体具有强大传播力、引导力、影响力、公信力。","pdfpage":203,"usage":"判断顺应趋势还是助长事态，注意褒贬语境。","clue":"“顺应既有形势采取行动”","myexample":"消费者越来越重视节能，企业及时调整产品布局，沿着市场趋势顺势而为。","contrasts":[{"other":"推波助澜","note":"同属“顺势造势”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"亡羊补牢","level":"S","group":"第35组","category":"提早准备和补救","sub":"出现问题进行补救","meaning":"意指丢失了再去修补羊圈，还不算晚。后用来比喻出了问题以后及时想法补救，以免继续受损失。也指出了问题才想法补救，已经太晚了","example":"纠正也好，改进也罢，都是“亡羊补牢”。说出口的话犹如泼出去的水，即便马上收回，可能已造成严重的影响。","pdfpage":212,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"“问题已经发生，再及时补救”","myexample":"发现数据访问权限设置不合理后，团队立即修复漏洞，以免再次泄露，也算亡羊补牢。","contrasts":[{"other":"防微杜渐","note":"前者防在出事之前；后者是已经遭受损失后补救。"}]},{"word":"未雨绸缪","level":"S","group":"第35组","category":"提早准备和补救","sub":"前期准备","meaning":"绸缪：缠绕，引申指修缮。比喻事先做好防备工作","example":"面对错综复杂的宏观经济环境，我们既要看到推动经济发展的有利条件，坚定信心，积极作为，又要充分估计影响经济发展的不利因素，未雨绸缪，防范风险。","pdfpage":209,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"“事先准备、以防将来”","myexample":"汛期尚未来临，社区已经清理排水沟并储备应急物资，体现出未雨绸缪的意识。","contrasts":[{"other":"防微杜渐","note":"前者是发现小苗头就制止恶化；后者是事情未发生时预先准备。"}]},{"word":"防患未然","level":"S","group":"第35组","category":"提早准备和补救","sub":"前期准备","meaning":"患：灾祸。未然：没有这样，指没有发生。在祸患还没有发生之前就进行防备","example":"治理宰客还应防患未然。","pdfpage":210,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"“危险尚未发生前预防它”","myexample":"为了避免电池过热导致事故，工程师在设计阶段设置多重温度保护机制，力争防患未然。","contrasts":[{"other":"亡羊补牢","note":"同属“提早准备和补救”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"各自为政","level":"S","group":"第36组","category":"办公、管理相关","sub":"形容工作开展的局面、形势不好","meaning":"各人按自己的主张办事。（多用来形容工作，单位之间、部门之间）","example":"各部门互相协作，互相支援，消除了过去一定程度上存在的各自为政的现象。","pdfpage":215,"usage":"常与部门协调、任务负责、独立承担等工作情境搭配。","clue":"“各部门按自己的主张独立办事，缺少统一”","myexample":"多部门只按自己的想法推进系统建设，接口、标准互不兼容，形成各自为政的局面。","contrasts":[{"other":"独当一面","note":"同属“办公、管理相关”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"空中楼阁","level":"S","group":"第37组","category":"空谈与虚幻","sub":"实现不了","meaning":"悬在空中的楼阁。比喻崇高通达。后多用来比喻虚构的事物或脱离实际的空想","example":"反观今天的中国篮球、足球等大球项目，关注职业联赛的“球评家”遍地，多是空中楼阁、纸上谈兵，真正呕心沥血致力于基层普及和幼苗培养的人寥寥无几。","pdfpage":219,"usage":"区分不切实际的计划、徒劳行为和只有理论没有实践。","clue":"“缺少实际基础的空想”","myexample":"没有数据、资金和实施路径支持的宏大规划，只是一座缺乏现实基础的空中楼阁。","contrasts":[{"other":"纸上谈兵","note":"同属“空谈与虚幻”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"纸上谈兵","level":"S","group":"第37组","category":"空谈与虚幻","sub":"不靠谱的做法","meaning":"兵：用兵之道。比喻空谈理论，不能解决实际问题。（侧重只有理论而没有行动）","example":"书生都喜欢纸上谈兵，只说而不去实行。","pdfpage":217,"usage":"区分不切实际的计划、徒劳行为和只有理论没有实践。","clue":"“只有理论讨论而缺乏实际行动”","myexample":"他能把管理理论讲得头头是道，却从未尝试处理真实业务，容易陷入纸上谈兵。","contrasts":[{"other":"坐而论道","note":"前者突出空谈理论不解决实际；后者侧重坐而空谈道理。"}]},{"word":"无人问津","level":"S","group":"第38组","category":"来者众多","sub":"形容人多、人少","meaning":"津：渡口。没有人来询问渡口。比喻没人过问、受到冷落。（形容某事物受冷落、无人理睬。程度较重）","example":"那些书皮五光十色的侠怪小说，渐渐变得无人问津。","pdfpage":225,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"“被冷落、无人过问”","myexample":"展会结束后，那款产品长期卖不出去，连咨询的顾客也没有，几乎无人问津。","contrasts":[{"other":"络绎不绝","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"络绎不绝","level":"S","group":"第38组","category":"来者众多","sub":"形容到来","meaning":"络绎：前后相接、连续不断的样子。形容车船人马等前后相接，往来不断","example":"每年到了这时候，从全国各地，跋山涉水特意来韶山参观的人都络绎不绝。","pdfpage":223,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"“人群往来不断、前后相接”","myexample":"新开通的非遗展馆很受欢迎，前来参观的游客前后相接、接连不断，可谓络绎不绝。","contrasts":[{"other":"无人问津","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"万人空巷","level":"S","group":"第39组","category":"人多人少","sub":"形容人多、热闹","meaning":"空巷：街道里弄里的人全部走空。指家家户户的人都从巷里出来了。多形容庆祝、欢迎等盛况","example":"1974年，北京电影制片厂译制的影片《瓦尔特保卫萨拉热窝》放映，万人空巷。一年后，又一部南斯拉夫影片《桥》在中国上映，其主题曲《啊，朋友再见》即便今天的00后也耳熟能详。","pdfpage":230,"usage":"区分人多热闹、车马往来与孤身无依。","clue":"“人们从家中出来聚到街上庆祝”","myexample":"夺冠队伍凯旋时，全城居民纷纷走出家门涌向街头迎接，形成万人空巷的盛况。","contrasts":[{"other":"人山人海","note":"同属“人多人少”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"参差不齐","level":"S","group":"第40组","category":"好坏掺杂","sub":"好坏都有","meaning":"参差：高低、长短、大小不齐的样子。形容不一致、有差别。（多搭配水平、质量、进展等）","example":"记者发现，虽说众多政府机构和部门都已开通了微博，但政务微博的运营情况良莠不齐，影响力参差不齐。","pdfpage":233,"usage":"先判断“程度不齐、好坏混杂、真假掺杂”，性质不一样。","clue":"“水平、质量高低不一致”","myexample":"各地基层平台信息化基础差异很大，数据质量也参差不齐，需要分类指导。","contrasts":[{"other":"良莠不齐","note":"前者多用于人的品质有好有坏；后者侧重水平、大小、整齐程度不同。"}]},{"word":"良莠不齐","level":"S","group":"第40组","category":"好坏掺杂","sub":"好坏都有","meaning":"莠：狗尾草，比喻坏人。指好人、坏人混在一起。同“良莠不一”。（现在用法不只形容人，也可形容事物）","example":"目前，处在发展初期的微短剧内容良莠不齐，在带来大流量的同时，也存在剧情套路化、部分内容低俗化的问题。","pdfpage":234,"usage":"先判断“程度不齐、好坏混杂、真假掺杂”，性质不一样。","clue":"“好与坏混在一起，尤其好人与坏人”","myexample":"进入培训行业的机构有真心教学的，也有欺骗消费者的，行业主体良莠不齐。","contrasts":[{"other":"参差不齐","note":"前者多用于人的品质有好有坏；后者侧重水平、大小、整齐程度不同。"}]},{"word":"鱼龙混杂","level":"S","group":"第40组","category":"好坏掺杂","sub":"好坏都有","meaning":"比喻坏人和好人混在一起。同“龙蛇混杂”。（现在用法不只形容人，也可形容事物）","example":"以前的艺术批评，地位非常高，也很自律；现在的批评界则是鱼龙混杂、门槛太低。","pdfpage":234,"usage":"先判断“程度不齐、好坏混杂、真假掺杂”，性质不一样。","clue":"“好人坏人混在一起”","myexample":"开放式交流群缺乏审核，专业人士与诈骗分子都能进入，参与者鱼龙混杂。","contrasts":[{"other":"鱼目混珠","note":"前者好坏人物混在一起；后者以假充真。"}]},{"word":"连绵不绝","level":"A","group":"第1组","category":"中华文明传统文化","sub":"形容中华文化","meaning":"意思是连续而不中断","example":"中华民族精神之所以连绵不绝、代代相传、历久弥新，是因为其有着深厚的历史土壤和文化根脉。","pdfpage":9,"usage":"常用于描述文化、思想、知识体系的历史、深度和包容性。","clue":"“连续而不中断”","myexample":"古道沿山脊伸展，远望群峰一座接一座，起伏连绵不绝，仿佛没有尽头。","contrasts":[{"other":"博大精深","note":"同属“中华文明传统文化”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"不绝如缕","level":"A","group":"第2组","category":"文化传承","sub":"传承不间断","meaning":"绝：断。缕：细线。像一根细线那样，似断非断。也作“不绝若线”。比喻情势危急","example":"许多古老的民间艺术，代代有传人，不绝如缕。","pdfpage":13,"usage":"关注“传承是否连续、采用何种传承方式、能否继续”三个层次。","clue":"“像细线将断未断，处境危急”","myexample":"这门传统唱腔如今只剩两三位高龄艺人掌握，传承已不绝如缕，随时可能断绝。","contrasts":[{"other":"承上启下","note":"同属“文化传承”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"口耳相传","level":"A","group":"第2组","category":"文化传承","sub":"传承方式","meaning":"口说耳听，递相传授","example":"据《南郑县志》记载，汉中编织业历史悠久。当地民间口耳相传，藤编可追溯至汉代，楚汉相争的关键一环“明修栈道，暗度陈仓”，汉军便用到了藤编。明清之际，汉中货栈业兴起…","pdfpage":14,"usage":"关注“传承是否连续、采用何种传承方式、能否继续”三个层次。","clue":"“口说耳听，代代传授”","myexample":"在尚无文字记录的年代，祖辈通过亲口讲述、晚辈亲耳听受，将山歌口耳相传下来。","contrasts":[{"other":"承上启下","note":"同属“文化传承”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"去芜存菁","level":"A","group":"第3组","category":"改革创新","sub":"改良旧的换新的","meaning":"意思是除去杂质、保留精华","example":"从石库门到天安门，从兴业路到复兴路，党的百年奋斗是一座去芜存菁的历史熔炉，是一条大浪淘沙的时间长河。坚持自我革命，这是中国共产党历经百年沧桑而青春依旧、长成参天巨树还岁岁发新的基本逻辑。","pdfpage":18,"usage":"重点区分除旧、创新、筛选精华与制度变革的对象。","clue":"“去除杂质、保留精华”","myexample":"整理地方志时，研究者删去无据传闻，留下真实可靠的材料，努力去芜存菁。","contrasts":[{"other":"吐故纳新","note":"同属“改革创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"激浊扬清","level":"A","group":"第3组","category":"改革创新","sub":"改良旧的换新的","meaning":"强调通过主动干预清除负面因素并弘扬正面价值，侧重点在于“激”与“扬”的联动作用，既包含对浑浊、消极现象的批判与清除，又包含对清澈、积极价值的彰显与推广","example":"党的十八大以来，我们深入贯彻中央八项规定精神，遏制“舌尖上的浪费”，整治“会所中的歪风”，刹住“车轮上的铺张”，管住了那些以往有的党员干部习以为常、容易忽视的小事小节，迎来了一场激浊扬清的风气巨变。","pdfpage":19,"usage":"重点区分除旧、创新、筛选精华与制度变革的对象。","clue":"“抑制不良、弘扬正面风气”","myexample":"整治行业乱象既要批评不正之风，也要表彰诚信企业，用制度激浊扬清。","contrasts":[{"other":"吐故纳新","note":"同属“改革创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"除旧布新","level":"A","group":"第3组","category":"改革创新","sub":"改良旧的换新的","meaning":"意思是清除旧的，建立新的；以新的代替旧的","example":"一座城市就和一个人一样有新陈代谢，需要除旧布新，要梳洗打扮才能面目清新。","pdfpage":19,"usage":"重点区分除旧、创新、筛选精华与制度变革的对象。","clue":"“清除旧事物、建立新事物”","myexample":"老厂区改造不仅拆除落后设施，还建设新的公共空间，体现城市更新中除旧布新的思路。","contrasts":[{"other":"吐故纳新","note":"同属“改革创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"不拘一格","level":"A","group":"第4组","category":"做法、构思创新","sub":"形容创新、独特","meaning":"不拘一格指不拘泥于一种规格、方式，比喻打破常规","example":"近年来，南京破除“论资排辈”“以帽取人”，不拘一格评才荐才。从创业支持到企业成长，从人才落户安居到家属就医求学，南京以顶格诚意广邀“创新合伙人”。千金买骨，良驹自来。","pdfpage":22,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“不局限于单一方式和规格”","myexample":"选拔创新人才不能只凭学历和资历，而要不拘一格，让不同背景的人有机会。","contrasts":[{"other":"不落窠臼","note":"同属“做法、构思创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"别开生面","level":"A","group":"第4组","category":"做法、构思创新","sub":"与众不同","meaning":"比喻另外开创新的局面或新的形式","example":"日前，湖北体彩武汉分中心围绕“年度报告”和“责任彩票”在会议室召开一场别开生面的责任彩票座谈会。","pdfpage":25,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“创造新的局面或形式”","myexample":"这次展览把考古现场搬进沉浸式剧场，为文物展示别开生面，开辟全新的形式。","contrasts":[{"other":"不落窠臼","note":"同属“做法、构思创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"标新立异","level":"A","group":"第4组","category":"做法、构思创新","sub":"形容创新、独特","meaning":"标：表明。异：独特，与众不同。原意为表明新颖的义理，提出与众不同的见解。后指故意提出新奇的见解，表示自己与众不同。（主观上故意性；辨析感情色彩）","example":"大舅母的话也不对，若是没有人标新立异，世界上哪还有进步？","pdfpage":21,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“刻意提出新奇见解以显示不同”","myexample":"他提出的方案并非基于实际需要，只为了显得与众不同而刻意求新，有些标新立异。","contrasts":[{"other":"不落窠臼","note":"同属“做法、构思创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"自成一家","level":"A","group":"第4组","category":"做法、构思创新","sub":"与众不同","meaning":"意思是指在某一方面的学问或技术有独到的见解或独特的做法，能自成体系","example":"90年代，石齐正式提出自己的三象合一艺术创作理念，自成一家。","pdfpage":25,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“形成有自身特色的独立体系”","myexample":"经过长期探索，这位学者提出一套完整而独特的分析体系，在本领域逐渐自成一家。","contrasts":[{"other":"不落窠臼","note":"同属“做法、构思创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"抱残守缺","level":"A","group":"第5组","category":"守旧不创新","sub":"形容守旧不创新","meaning":"残、缺：不完整。①固守陈旧残缺的东西不放，形容保守，不知改进。②保存虽有残缺但仍有价值的古物","example":"在一切学术领域里，都需要参考、借鉴外国的成就，抱残守缺、固步自封是不行的。","pdfpage":28,"usage":"评价机械沿用旧办法、固守传统的行为，语境多含批评。","clue":"“守着旧的残缺东西不放”","myexample":"面对新业务，管理者宁愿抓住已过时的制度不放，也不肯改进，颇有抱残守缺之态。","contrasts":[{"other":"因循守旧","note":"同属“守旧不创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"食古不化","level":"A","group":"第5组","category":"守旧不创新","sub":"形容守旧不创新","meaning":"意思是读书、作画一味学习古人，拘泥陈法，不善于灵活运用。指对所学的古代知识理解得不透，不善于按现在的情况来运用","example":"坚持植根历史文化沃土发展马克思主义，不是食古不化，简单复兴传统文化，更不是以中华优秀传统文化替代马克思主义，而是要以古人之规矩，开自己之生面，坚持古为今用、推陈出新。","pdfpage":29,"usage":"评价机械沿用旧办法、固守传统的行为，语境多含批评。","clue":"“学习古人却不懂灵活运用”","myexample":"研究古典文学不能把古人的句式生搬到现代写作中，否则容易食古不化。","contrasts":[{"other":"因循守旧","note":"同属“守旧不创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"寸步难行","level":"A","group":"第7组","category":"处境困难","sub":"处境艰难","meaning":"寸步：很短的距离。一步也难以行走。形容行走十分困难。也形容陷入困难境地，无法进行活动。（程度较重）","example":"停电停水，原料缺乏，市场困难，真是寸步难行。","pdfpage":38,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“处境十分困难，活动难以推进”","myexample":"没有许可证、设备也无法通关，试点项目在当地几乎寸步难行。","contrasts":[{"other":"举步维艰","note":"同属“处境困难”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"裹足不前","level":"A","group":"第7组","category":"处境困难","sub":"不好抉择","meaning":"比喻因心存顾虑而停止行动或不敢向前，与踟蹰不前相比停滞程度更彻底，暗示难以突破","example":"某型装备操作手于继旺告诉记者，转岗之初，他曾因信心不足，很长一段时间裹足不前。中队干部鼓励他结合自己的特长大胆尝试、勇敢探索，扎扎实实打基础、长本领。一次大项任务中，他凭借优异表现，赢得上下好评。","pdfpage":37,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“顾虑太多而停止前进”","myexample":"虽然方案已经论证充分，但负责人总担心担责，迟迟不敢迈出第一步，长期裹足不前。","contrasts":[{"other":"举步维艰","note":"同属“处境困难”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"进退失据","level":"A","group":"第7组","category":"处境困难","sub":"不好抉择","meaning":"同“进退失据”“进退两难”","example":"实践证明，抓落实不能仅凭一腔热情，若没有行之有效的方法，就会陷入进退失据、劳而无功的境地。因而，要想增强抓落实的质效，必须讲究工作方法，着力解决好“抓什么、怎么抓”的问题。","pdfpage":36,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“进退两难、失去处置依据”","myexample":"遇到突发舆情，他既不敢及时解释，也不敢保持沉默，一时进退失据。","contrasts":[{"other":"举步维艰","note":"同属“处境困难”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"危如累卵","level":"A","group":"第8组","category":"形势危险","sub":"形势危险","meaning":"比喻形势非常危险，如同堆起来的蛋，随时都有塌下打碎的可能","example":"10月4日，降雨如注，洪水滔滔，位于黄土山沟中的大宁县向阳社区永和圪洞居民区危如累卵，随时有房屋坍塌和发生泥石流的风险。","pdfpage":41,"usage":"先判断是生命危险、局势动荡，还是时间紧迫。","clue":"“像堆叠的鸡蛋一样危险”","myexample":"企业债务层层叠加，现金储备又几近枯竭，资金链危如累卵，随时可能断裂。","contrasts":[{"other":"危在旦夕","note":"同属“形势危险”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"风雨飘摇","level":"A","group":"第8组","category":"形势危险","sub":"形势危险","meaning":"飘摇：飘荡。在风雨中飘荡不定。比喻局势动荡不安，很不稳定","example":"3亩茶叶地，一个瘦小的身体，谢婆婆就这样苦苦支撑着这个风雨飘摇的家庭。“真的太苦太难了。”事实上，除了长期的照顾和干农活，病情更重的孙儿伟伟时常发病，无法控制的行为更让谢婆婆心力交瘁。","pdfpage":42,"usage":"先判断是生命危险、局势动荡，还是时间紧迫。","clue":"“局势动荡不安、难以稳定”","myexample":"在连续冲突与金融危机冲击下，该地区政治秩序极不稳定，长期处于风雨飘摇之中。","contrasts":[{"other":"危在旦夕","note":"同属“形势危险”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"一日千里","level":"A","group":"第9组","category":"事物出现、发展、衰落","sub":"形容发展迅速","meaning":"一天跑一千里。也比喻进步、发展很快","example":"从时代的大趋势看，无论世界还是中国的发展都好像有一种加速度，真是日新月异、一日千里，新情况新问题格外多。","pdfpage":52,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“发展进步极快”","myexample":"高性能计算不断突破瓶颈，模拟速度与处理规模飞速提升，可谓一日千里。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"势如破竹","level":"A","group":"第9组","category":"事物出现、发展、衰落","sub":"发展势头好","meaning":"势：形势。破竹：劈开竹子。形势如同劈竹子一样，劈开头上几节，下面各节就顺着刀口裂开了。后用来形容节节胜利，毫无阻碍","example":"尽管《私人订制》在上映后遭遇恶评，但无论是在排片上还是票房上都势如破竹。","pdfpage":50,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“接连取胜、阻力很小”","myexample":"球队连续攻克多支强队，随后几轮比赛几乎未遇阻力，晋级过程势如破竹。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"如日中天","level":"A","group":"第9组","category":"事物出现、发展、衰落","sub":"发展势头好","meaning":"像太阳正运行到正午。比喻正发展到最兴盛的阶段","example":"2013年热播的《徐悲鸿》更是让他的演艺事业如日中天。","pdfpage":50,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“已经发展到鼎盛阶段”","myexample":"这家企业的市场份额与品牌影响力双双达到顶峰，正处在如日中天的发展阶段。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"水涨船高","level":"A","group":"第9组","category":"事物出现、发展、衰落","sub":"其他","meaning":"水位上涨，船体也随着上升。比喻事物随着它所凭借的基础而增长","example":"人民网发表评论文章《明星片酬为啥屡“限”屡高？》，文章指出，市场认明星，有人认有人买单，明星片酬自然就水涨船高。","pdfpage":54,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“随着所依托的基础提高而提高”","myexample":"当地旅游发展后，民宿需求增加，周边服务人员的收入也随之水涨船高。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"江河日下","level":"A","group":"第9组","category":"事物出现、发展、衰落","sub":"逐渐衰落","meaning":"长江大河的水，日夜流向下游而不止。比喻事物日趋衰落，情况一天不如一天。（多指国势等事物发展趋势）","example":"历史上，诸葛亮长于谋事短于谋人，最后造成蜀国江河日下，走向衰落。","pdfpage":54,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“情况持续走向衰落”","myexample":"老旧平台长年不更新、用户不断流失，服务质量和市场口碑都江河日下。","contrasts":[{"other":"日渐式微","note":"前者侧重逐渐衰落；后者强调情况不断恶化、向下发展。"}]},{"word":"突飞猛进","level":"A","group":"第9组","category":"事物出现、发展、衰落","sub":"发展势头好","meaning":"形容发展十分迅速","example":"我可以肯定地认为，中国会继续实现突飞猛进的发展。","pdfpage":51,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“短期进步十分迅速”","myexample":"经过关键算法突破，语音识别准确率在短期内大幅提升，技术水平突飞猛进。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"雨后春笋","level":"A","group":"第9组","category":"事物出现、发展、衰落","sub":"出现、萌生","meaning":"春天下雨后竹笋长得又多又快，比喻新生事物大量涌现和蓬勃发展。（侧重数量多）","example":"十余年来，各式各样的创意产业园在广州如雨后春笋，蓬勃生长。","pdfpage":48,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“新事物大量、迅速涌现”","myexample":"乡村电商扶持政策实施后，农产品直播团队在各地大量出现，如同雨后春笋。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"出类拔萃","level":"A","group":"第10组","category":"竞争比较","sub":"和别人相比较","meaning":"出：超出。类：同类。拔：高出。萃：指聚在一起的人或物。指人的品德才能出众，高出同类之上。（侧重能力或品德）（高于同类）","example":"这感人的姿态，正是出类拔萃的外交家周恩来的特色。","pdfpage":60,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“人的品德或才能高出同类”","myexample":"在同批青年科研人员中，她既有扎实的专业能力，又有突出的创新成果，表现出类拔萃。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"同日而语","level":"A","group":"第10组","category":"竞争比较","sub":"同等地位","meaning":"指相提并论。（侧重于强调时间上的对比，多形容与自身的比较。现有时也有例外）（多用于否定句中）","example":"俄罗斯目前的经济状况同2008年的危机不能同日而语。","pdfpage":65,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“不同时期的事物不可相比较”","myexample":"十年前的处理器性能远不能与今天的同类产品同日而语，两者在运算能力上差别巨大。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"无与伦比","level":"A","group":"第10组","category":"竞争比较","sub":"和别人相比较","meaning":"意思是指事物非常完美，没有能够与它相比的同类的东西","example":"弋江区既是高新技术产业集聚区，也是高科技人才汇集地，境内有安徽师范大学等七所高等院校，在校学生10万多人，这是弋江区无与伦比的独特优势和宝贵财富。","pdfpage":60,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“同类中几乎没有能够相比的”","myexample":"这座古桥的工艺精度和艺术表现力非常独特，在同类建筑中几乎无与伦比。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"回天乏术","level":"A","group":"第11组","category":"能力不足","sub":"能力有限","meaning":"回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救","example":"对于一些晚期肿瘤和罕见病，再高明的医生也回天乏术，再先进的医学也无能为力。但是，如果人们具有一定的医学常识，在疾病初期就发现苗头，尽早诊治，结果就可能大不一样。","pdfpage":71,"usage":"区分有心无力、忙不过来、资源短缺与无计可施。","clue":"“事态严重到无法挽回”","myexample":"患者送医时病情已极端危急，多种抢救措施均无法挽救，医生最终也回天乏术。","contrasts":[{"other":"应接不暇","note":"同属“能力不足”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"爱莫能助","level":"A","group":"第11组","category":"能力不足","sub":"能力有限","meaning":"爱：爱惜；莫：不。虽然心中关切同情，却没有力量帮助","example":"家里经济条件有限，这也并不是危及到生命的残疾，父母也爱莫能助。","pdfpage":69,"usage":"区分有心无力、忙不过来、资源短缺与无计可施。","clue":"“想帮却没有能力帮”","myexample":"我非常希望提供资金支持，但项目经费已全部锁定，此事只能爱莫能助。","contrasts":[{"other":"应接不暇","note":"同属“能力不足”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"独木难支","level":"A","group":"第11组","category":"能力不足","sub":"应付不了","meaning":"一根木头支不住高大的房子。比喻一个人的力量单薄，维持不住全局","example":"祛除未成年人的网瘾光靠王波一人独木难支，近期三建乡将组织文服中心、司法所、平安办、派出所共同开展网络宣传相关活动，一方面走进校园开展防沉溺网络专题活动，另一方面再组织专业老师上门家访。","pdfpage":73,"usage":"区分有心无力、忙不过来、资源短缺与无计可施。","clue":"“个人力量不足以支撑全局”","myexample":"基层服务窗口只有一名工作人员承担所有事务，即使再努力也独木难支。","contrasts":[{"other":"应接不暇","note":"同属“能力不足”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"触类旁通","level":"A","group":"第12组","category":"印象和效果","sub":"形容学到一点就能推知更多","meaning":"触：接触。通：通晓。指掌握了某一事物的规律或知识，就能够以此类推，了解同类的其他事物。（侧重于抽象的思维层面。）（侧重类推）","example":"大多数人其实是被“狼来了”骗过之后才醒悟，并没有触类旁通，学会辨别这类假新闻，因而不时被低劣的造假手段“套路”。","pdfpage":79,"usage":"辨别浅层接触、理解不深、综合掌握与类推能力。","clue":"“掌握一种规律后类推同类知识”","myexample":"掌握了一种网络协议的基本设计规律后，他能举一反三理解其他相近协议，达到了触类旁通。","contrasts":[{"other":"融会贯通","note":"前者强调把知识融合理解并贯通；后者强调由一种知识推知类似知识。"}]},{"word":"交相辉映","level":"A","group":"第13组","category":"搭档配合","sub":"二者都好","meaning":"各种光亮、色彩相互照耀、映射。常用语形容美好的景象","example":"让我们为青春之中国放歌，让青春梦想与中国梦交相辉映！","pdfpage":82,"usage":"看两者是相互促进、互补协调，还是彼此映衬。","clue":"“美好景物彼此照耀衬托”","myexample":"夜幕下，古城墙与现代光影装置相互照耀，绚丽色彩交相辉映，景致迷人。","contrasts":[{"other":"相得益彰","note":"同属“搭档配合”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"珠联璧合","level":"A","group":"第13组","category":"搭档配合","sub":"合作配合","meaning":"珠联：像珍珠一样串在一起。璧合：像碧玉一样合在一起。原指一种日月重合、五星相联的天相。后多比喻美好的人及事物凑在一起。同“珠连璧合”。（侧重结合）","example":"天文专家介绍说，日落后，天宇将上演“金星合木星”的奇特天象，届时这两颗最明亮的行星将近距离“珠联璧合”，上演一幕虽短暂却精彩的“二人转”。","pdfpage":81,"usage":"看两者是相互促进、互补协调，还是彼此映衬。","clue":"“美好的人或事物结合在一起”","myexample":"优秀编剧与杰出演员合作，文学表达和舞台呈现都达到很高水准，可称珠联璧合。","contrasts":[{"other":"相得益彰","note":"同属“搭档配合”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"并驾齐驱","level":"A","group":"第14组","category":"工作开展顺序","sub":"工作开展顺序","meaning":"并驾：几匹马并排在一起拉车。齐驱：共同快跑。比喻相互之间不相上下","example":"必须坚持民生优先，科学重建，让房屋重建与产业发展并驾齐驱。","pdfpage":85,"usage":"看两项工作是否并行、同时推进或能力相当。","clue":"“双方实力差不多，不相上下”","myexample":"两家科研机构在基础研究和成果转化方面实力相近，长期并驾齐驱，难分高下。","contrasts":[{"other":"双管齐下","note":"同属“工作开展顺序”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"喧宾夺主","level":"A","group":"第15组","category":"错误抉择和方向","sub":"错误抉择","meaning":"喧：吵吵嚷嚷。客人的声音压倒了主人的声音。比喻外来的或次要的事物占据了原有的或主要的事物的位置","example":"麻辣语录走红，折射出社会各界对学校加快教学法改革的期待，但喧宾夺主分散学生学习知识的注意力，就不值得提倡了。","pdfpage":87,"usage":"判定错在目标方向、主次关系，还是方式方法。","clue":"“次要内容占据主要地位”","myexample":"影片本来讲述人物成长，复杂的特效却抢走了叙事主体的位置，难免喧宾夺主。","contrasts":[{"other":"南辕北辙","note":"同属“错误抉择和方向”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"因小失大","level":"A","group":"第15组","category":"错误抉择和方向","sub":"错误抉择","meaning":"因：为了。指为了小的利益造成大的损失","example":"有的人就看着鼻子底下这点实利，算盘珠子拨得很精，看起来很聪明，实际上常常因小失大。","pdfpage":87,"usage":"判定错在目标方向、主次关系，还是方式方法。","clue":"“贪小利益而造成更大的损失”","myexample":"为了省下一笔必要的设备维护费而造成整条产线停工，实在是因小失大。","contrasts":[{"other":"南辕北辙","note":"同属“错误抉择和方向”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"拔苗助长","level":"A","group":"第16组","category":"错误做法（寓言故事）","sub":"错误做法","meaning":"用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长”","example":"超前教育无异于拔苗助长，看似成绩领先，特长傍身，实则根基不稳，不能行稳致远。","pdfpage":90,"usage":"错误行为通常由具体寓言引申，注意事件结构。","clue":"“违背成长规律、急于求成反坏事”","myexample":"孩子尚未掌握基础概念就被要求完成高难度训练，急于求成的做法无异于拔苗助长。","contrasts":[{"other":"削足适履","note":"同属“错误做法（寓言故事）”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"邯郸学步","level":"A","group":"第16组","category":"错误做法（寓言故事）","sub":"错误做法","meaning":"比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了","example":"各地文旅在“抄作业”时，也要谨防“邯郸学步”，阻碍了当地旅游产业的发展壮大。","pdfpage":92,"usage":"错误行为通常由具体寓言引申，注意事件结构。","clue":"“模仿别人不成，还丢掉原本技能”","myexample":"一些小店生搬照抄网红品牌的经营模式，原来的服务特色反而丢了，结果邯郸学步。","contrasts":[{"other":"削足适履","note":"同属“错误做法（寓言故事）”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"循循善诱","level":"A","group":"第17组","category":"教育影响批评","sub":"教育和批评","meaning":"循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法","example":"社会文明的形成，需要自律，也需要他律；需要循循善诱地劝导，也需要法律制度的规范。","pdfpage":96,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“教育时有步骤地耐心引导”","myexample":"面对学生的困惑，老师按照难易顺序逐步提问，引导他们自己发现答案，堪称循循善诱。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"春风化雨","level":"A","group":"第17组","category":"教育影响批评","sub":"教育和批评","meaning":"宜于万物生长的和风，适时的雨。后用来比喻良好的教育。多用来称颂师长对学生及晚辈潜移默化的教诲。（也可用来形容文化或教育等对人的影响）","example":"把党史学习教育做到青少年心坎上，春风化雨般滋润青少年的心田，让他们与党史故事和人物产生情感共鸣、与优秀文化与民族精神发生思想共振，汲取奋发向上的力量。","pdfpage":97,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“良好教育温柔而持续地感化”","myexample":"乡村教师多年来用温和细致的陪伴影响孩子，教育的力量如同春风化雨。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"耳提面命","level":"A","group":"第17组","category":"教育影响批评","sub":"教育和批评","meaning":"“耳提”，提着耳朵叮嘱；“面命”，当面指教，形容教诲殷切。多指（长辈对晚辈、上级对下级）恳切地教导","example":"父亲经常教育我们兄弟俩要“一心为公、两袖清风”，他也深知我工作的重要性，对我更是耳提面命。","pdfpage":96,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“长辈或师长面对面恳切教导”","myexample":"临行前，导师多次当面叮嘱实验安全细节，言辞恳切，真可谓耳提面命。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"呕心沥血","level":"A","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"呕：吐。沥：滴。形容费尽心思","example":"他，呕心沥血把生命最后的光辉都奉献给中国的外宣事业。","pdfpage":102,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“长期费尽心思并投入心血”","myexample":"他为这套辞典耗费十余年心血，不断查证校勘，几乎呕心沥血。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"孜孜不倦","level":"A","group":"第18组","category":"工作学习状态","sub":"勤勉不懈怠","meaning":"孜孜：勤奋的样子。形容勤奋、不知疲倦","example":"希望两位院士孜孜不倦投身科研，准确把握攻关方向，深入谋划科研项目，广泛培养专业人才，推动科研创新水平不断提升。","pdfpage":108,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“勤奋努力且不知疲倦”","myexample":"退休后，这位教师仍坚持阅读文献、指导学生，学习与教学孜孜不倦。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"孜孜以求","level":"A","group":"第18组","category":"工作学习状态","sub":"勤勉不懈怠","meaning":"孜孜：勤勉的样子。意思是不知疲倦地探求","example":"建设现代化强国、实现中华民族伟大复兴，是中国共产党人孜孜以求的宏伟目标，凝结着毛泽东同志等老一辈革命家的毕生心血。","pdfpage":109,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“不倦地探求某一目标”","myexample":"对于尚未解决的科学难题，他十年间不断试验，始终孜孜以求。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"焚膏继晷","level":"A","group":"第18组","category":"工作学习状态","sub":"抓紧时间、勤奋","meaning":"焚：点燃；膏：灯油或蜡烛；继：接续；晷：日影、日光。意思是点燃灯烛来接替日光照明，形容夜以继日地用功读书或努力工作","example":"人类的美好理想，都不可能唾手可得，都离不开手胼足胝、焚膏继晷的艰苦奋斗。","pdfpage":105,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“夜以继日、刻苦工作”","myexample":"为了在期限前完成古籍整理，研究团队白天工作、夜里点灯校勘，常常焚膏继晷。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"义不容辞","level":"A","group":"第19组","category":"正确做法","sub":"勇于承担责任义务","meaning":"义：道义。辞：推辞。道义上不容许推辞。指理应接受。（侧重良心、道义上）","example":"钟南山认为自己只是一个医生，须对人民的生命安全负责，他的出声是义不容辞的。","pdfpage":116,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"“出于道义不能推辞”","myexample":"灾区急需专业救援人员，作为有经验的队员，他认为投入救援义不容辞。","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"博采众长","level":"A","group":"第19组","category":"正确做法","sub":"向他人学习","meaning":"博采：广泛搜集采纳。从多方面吸取各家的长处","example":"搞科学研究，也需博采众长。","pdfpage":113,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"“广泛吸收不同方面的长处”","myexample":"设计城市公园时，团队借鉴不同国家的景观理念，从各家优点中吸收经验，力求博采众长。","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"条分缕析","level":"A","group":"第19组","category":"正确做法","sub":"分析问题","meaning":"缕：线。一条条分析。形容分析得有条理，很细致","example":"越是面对复杂多变的社会环境，越应该注重身教重于言传、具体强于抽象，教育引导、舆论宣传、文化熏陶、实践养成、制度保障都应该条分缕析，在现实针对性上做足功夫。","pdfpage":111,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"“一条条、一层层详细分析”","myexample":"事故调查报告没有简单下结论，而是将时间、设备、人因逐项梳理，分析得条分缕析。","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"见贤思齐","level":"A","group":"第19组","category":"正确做法","sub":"向他人学习","meaning":"指见到有才德的人就想着与他齐平","example":"社会主义核心价值观“十进”活动和“文明城市复审”，催生出25890户“文明家庭”、43562户“星级文明户”，涌现了石丽平、刘仁平、姚少军、杨正文、李春学等23名身边好人，使人人见贤思齐、户户崇德向善。","pdfpage":114,"usage":"强调分析问题、抓住关键、借鉴长处或实事求是。","clue":"“见到优秀的人就想向其看齐”","myexample":"看到同事严谨的实验习惯，他并不嫉妒，而是认真学习，努力见贤思齐。","contrasts":[{"other":"提纲挈领","note":"同属“正确做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"临渊羡鱼","level":"A","group":"第20组","category":"错误做法","sub":"不能这样做","meaning":"比喻有欲望想得到某种东西，但却没有实际行动","example":"临渊羡鱼，不如退而结网。做好招商、安商、稳商工作，打造一流的营商环境是重中之重。要大力加强诚信建设，打造高效透明政务流程，让政策兑现有力度、服务企业有温度，增强招商引资区域竞争力。","pdfpage":120,"usage":"多含批评，要注意错误做法造成的具体后果。","clue":"“只有愿望而不采取行动”","myexample":"天天羡慕别人熟练编程，却从不打开电脑练习，这样临渊羡鱼不会带来进步。","contrasts":[{"other":"于事无补","note":"同属“错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"有恃无恐","level":"A","group":"第20组","category":"错误做法","sub":"不能这样做","meaning":"因有所依仗而毫不害怕","example":"这个过程，普通用户难以察觉，维权举证困难，在违法成本低的情况下，当顶格罚款远不及违法违规的营收所得，企业自然有恃无恐。","pdfpage":120,"usage":"多含批评，要注意错误做法造成的具体后果。","clue":"“仗着依靠而毫不畏惧”","myexample":"某商家自以为背后有人撑腰，面对监管提醒仍毫不收敛，显得有恃无恐。","contrasts":[{"other":"于事无补","note":"同属“错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"坐享其成","level":"A","group":"第21组","category":"某些国家的错误做法","sub":"旁观、得利","meaning":"意思为自己不出力而享受别人取得的成果","example":"习近平总书记在许家冲村考察时强调，乡村振兴不是坐享其成，等不来、也送不来，要靠广大农民奋斗。","pdfpage":128,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"“不付出劳动而享受他人的成果”","myexample":"团队成员辛苦完成研发，他却从不参与劳动，只想分享成果，是典型的坐享其成。","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"坐收渔利","level":"A","group":"第21组","category":"某些国家的错误做法","sub":"旁观、得利","meaning":"比喻利用别人的矛盾而从中获利","example":"在欧洲因能源危机承受巨大压力的同时，美国却趁火打劫、坐收渔利，以高价向欧洲国家兜售能源。","pdfpage":128,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"“利用他人的冲突从中获利”","myexample":"两家企业因专利争执得两败俱伤，第三方却趁机拿走市场份额，成了坐收渔利者。","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"隔岸观火","level":"A","group":"第21组","category":"某些国家的错误做法","sub":"旁观、得利","meaning":"指站在对岸观望火灾；用来比喻对别人的急难不加救助，而采取看热闹的态度","example":"作为二者的共同盟友，美军却选择隔岸观火，并表示由于安全局势过于恶化，停止美军在该地区的巡逻。","pdfpage":127,"usage":"注意自私转嫁、追随模仿、坐视不理与急功近利的区别。","clue":"“他人遇到危急，自己只旁观看热闹”","myexample":"邻近社区出现紧急供水问题，他所在单位本可协助，却只在一旁看热闹，俨然隔岸观火。","contrasts":[{"other":"亦步亦趋","note":"同属“某些国家的错误做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"安居乐业","level":"A","group":"第22组","category":"国家安定与动荡","sub":"社会安定","meaning":"安：安定；乐：喜爱，愉快；业：职业。指安定愉快地生活和劳动","example":"看到来自五湖四海的建设者在这里安居乐业，感到很高兴。城市不仅要有高度，更要有温度。我们的社会主义就是要走共同富裕的路子。外来务工人员来上海作贡献，同样是城市的主人。","pdfpage":133,"usage":"描述社会秩序或居民处境，区分宏观安定与个体漂泊。","clue":"“生活安定、工作安心”","myexample":"搬迁安置区学校、医院和产业配套不断完善，居民终于能够安居乐业，生活稳定。","contrasts":[{"other":"颠沛流离","note":"同属“国家安定与动荡”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"颠沛流离","level":"A","group":"第22组","category":"国家安定与动荡","sub":"生活不如意","meaning":"颠沛：跌倒，比喻困顿，受挫折。流离：流转离散。形容生活困苦，流落异乡，无安身之所。（可指人，也可指物）","example":"《伯远帖》《中秋帖》《五牛图》《韩熙载夜宴图》等国宝级艺术品，都曾经颠沛流离，差一点流失海外，直到新中国成立后才顺利回归了祖国的怀抱。","pdfpage":132,"usage":"描述社会秩序或居民处境，区分宏观安定与个体漂泊。","clue":"“生活困苦、四处流转漂泊”","myexample":"战乱迫使不少家庭辗转多个地区，饱受艰辛，过着颠沛流离的生活。","contrasts":[{"other":"安居乐业","note":"同属“国家安定与动荡”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"一衣带水","level":"A","group":"第23组","category":"国际国内关系","sub":"和邻居的关系","meaning":"原形容像一条衣带那样狭窄的河流。现比喻仅隔一水，极其邻近","example":"在大灾大难面前，两国能够携手并进，同舟共济，这正是一衣带水的邻邦情谊的真实体现，也是未来中日关系持续改善发展的重要基础。","pdfpage":139,"usage":"用于合作关系、互助支持、局势变化与负面勾结。","clue":"“隔水相望，地理位置非常近”","myexample":"两座港口城市仅有一条狭窄海峡相隔，可谓一衣带水，经贸往来十分密切。","contrasts":[{"other":"休戚与共","note":"同属“国际国内关系”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"休戚与共","level":"A","group":"第23组","category":"国际国内关系","sub":"同呼吸共命运","meaning":"休：欢乐，吉庆。戚：忧愁，悲哀。指忧喜祸福彼此共同承担。形容关系密切同甘共苦","example":"新形势下，着眼两国人民的光明未来，中方愿同塔方一道努力，全面提升各领域合作水平，推动构建世代友好、休戚与共、互利共赢的中塔命运共同体。","pdfpage":136,"usage":"用于合作关系、互助支持、局势变化与负面勾结。","clue":"“欢乐忧愁和利害祸福共同承担”","myexample":"面对产业链波动，上下游企业利益相连、风险共担，彼此休戚与共。","contrasts":[{"other":"一衣带水","note":"同属“国际国内关系”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"同舟共济","level":"A","group":"第23组","category":"国际国内关系","sub":"融洽和谐","meaning":"济：渡过。同乘一条船过河。比喻齐心协力渡过困难","example":"抓紧抓实抓细各项防控工作，需要进一步凝心聚力，激发同舟共济、共克时艰的磅礴力量。","pdfpage":137,"usage":"用于合作关系、互助支持、局势变化与负面勾结。","clue":"“齐心协力一起克服困难”","myexample":"遭遇突发灾害，政府、企业与居民齐心协力，共同渡过难关，体现了同舟共济的精神。","contrasts":[{"other":"一衣带水","note":"同属“国际国内关系”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"细水长流","level":"A","group":"第25组","category":"合理规划","sub":"节约成本","meaning":"比喻节约使用财物，使经常不缺用。也比喻一点一滴不间断地做某件事，精细安排，长远打算","example":"这种细水长流式的方法不显山露水，但可以聚少成多，冯大才以这种方式收受回扣达140余万元。","pdfpage":151,"usage":"强调分配资源、开源节流与精细化长期管理。","clue":"“节约安排，使资源长期不断”","myexample":"社区把活动经费分月使用，避免一开始就花光，才能确保服务细水长流。","contrasts":[{"other":"开源节流","note":"同属“合理规划”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"功败垂成","level":"A","group":"第27组","category":"成功与失败","sub":"没能成功","meaning":"垂：接近，将要。事情在将要成功的时候失败了。含惋惜意。同“事败垂成”","example":"虽然离成功只有一毫之差、一步之遥，但终归不免功败垂成、留下缺憾。","pdfpage":161,"usage":"区分轻松完成、临门失败、彻底无策与意外错失。","clue":"“快成功时最终失败”","myexample":"谈判已经接近签约，却因最后一项核心条款无法达成而告吹，令人叹息其功败垂成。","contrasts":[{"other":"功亏一篑","note":"都指接近成功时失败；功亏一篑更强调最后一点没完成。"}]},{"word":"失之交臂","level":"A","group":"第27组","category":"成功与失败","sub":"没能成功","meaning":"交臂：胳膊碰胳膊，指擦肩而过。形容当面错过","example":"“我心里一直憋着这口气，在里约奥运会上失之交臂的金牌，我一定要把它夺回来！”为了夺回这枚金牌，刘洋五年没有回过家，即使是带伤上阵，也要发挥到最完美！","pdfpage":161,"usage":"区分轻松完成、临门失败、彻底无策与意外错失。","clue":"“原本近在眼前却错过”","myexample":"报名截止的前一分钟他才发现网站故障，最终与期待已久的机会失之交臂。","contrasts":[{"other":"一筹莫展","note":"同属“成功与失败”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"适得其反","level":"A","group":"第27组","category":"成功与失败","sub":"没能成功","meaning":"适：恰好。结果与愿望恰好相反。（侧重取得反面结果）","example":"这么看来，商家封杀职业打假人只能适得其反，不仅阻挡不了职业打假者的行动，更会让自己的丑行败露，落得个拒绝监督、袒护问题商品的恶名。","pdfpage":161,"usage":"区分轻松完成、临门失败、彻底无策与意外错失。","clue":"“结果恰好与初衷相反”","myexample":"为了减轻学生焦虑，学校却增加大量重复测评，结果反而造成更大压力，措施适得其反。","contrasts":[{"other":"一筹莫展","note":"同属“成功与失败”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"以身作则","level":"A","group":"第28组","category":"领导力","sub":"以身作则","meaning":"身：自身。则：榜样。自己以行动给大家做出榜样","example":"遵守交通规则是每个人的责任，尤其是偶像明星，更要时刻慎独自省，以身作则，为社会做好示范。","pdfpage":166,"usage":"关注视野、统筹、带头践行和始终坚持等侧重点。","clue":"“亲自带头树立榜样”","myexample":"要求全体员工遵守节能规定，负责人自己先不开空调、带头践行，以行动以身作则。","contrasts":[{"other":"一以贯之","note":"同属“领导力”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"身体力行","level":"A","group":"第28组","category":"领导力","sub":"以身作则","meaning":"身：亲身。体：体验。指亲身体验，努力实践","example":"增强安全意识、注意风险提示，敬畏自然、敬畏生命，每个人都该身体力行。","pdfpage":165,"usage":"关注视野、统筹、带头践行和始终坚持等侧重点。","clue":"“亲身实践而不只是口头提倡”","myexample":"推广垃圾分类的负责人不只停留在口号上，还亲自走入社区示范，始终身体力行。","contrasts":[{"other":"一以贯之","note":"同属“领导力”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"运筹帷幄","level":"A","group":"第28组","category":"领导力","sub":"筹划全面","meaning":"筹：谋划。帷幄：古代军队中的帐幕。指在帐幕中谋划计策。后指在后方指挥、筹划","example":"我们的目标是为各行各业的专业人士提供整合的信息解决方案，帮助他们更快地作出决策、作出更明智的决策，从而在全球化的竞争中，运筹帷幄、决胜千里。","pdfpage":165,"usage":"关注视野、统筹、带头践行和始终坚持等侧重点。","clue":"“在后方制定策略、指挥筹划”","myexample":"面对多个项目并行的复杂局面，总指挥在后方统筹资源、制定方案，表现出运筹帷幄的能力。","contrasts":[{"other":"一以贯之","note":"同属“领导力”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"前仆后继","level":"A","group":"第29组","category":"正义精神和做法","sub":"形容英勇无畏","meaning":"意思是指前面的人倒下了，后面的人继续跟上去。英勇斗争，不怕牺牲","example":"我们不能忘怀视死如归、前仆后继的抗争。历史不会因时代变迁而改变，事实也不会因巧舌抵赖而消失。","pdfpage":171,"usage":"注意正义感、牺牲勇气与困难中坚持奋斗。","clue":"“前面的倒下后面的跟上”","myexample":"为守护防线，一批队员倒下，后续队员仍勇敢接上，展现出前仆后继的牺牲精神。","contrasts":[{"other":"砥砺前行","note":"同属“正义精神和做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"砥砺前行","level":"A","group":"第29组","category":"正义精神和做法","sub":"形容克服困难前进","meaning":"经历磨炼，克服困难，往前进步的意思。也作“砥砺奋进”","example":"在推进中国式现代化的征程上，脚踏实地，砥砺前行，一点一滴地进步里，是一个越来越好的中国。","pdfpage":173,"usage":"注意正义感、牺牲勇气与困难中坚持奋斗。","clue":"“经历磨砺后坚持前进”","myexample":"项目遭遇资金、技术多重困难，但团队在磨炼中坚持向前，用行动诠释砥砺前行。","contrasts":[{"other":"前仆后继","note":"同属“正义精神和做法”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"哗众取宠","level":"A","group":"第30组","category":"干部易犯错误","sub":"其他错误","meaning":"用浮夸的言词或做作的行动去迎合群众，以博取好感和支持","example":"这是民进党当局倚美谋独企图的又一次充分暴露，终将是一场哗众取宠的闹剧。","pdfpage":184,"usage":"常见机关工作语境，关注浮夸、敷衍、逢迎、自保。","clue":"“靠浮夸言行迎合大众博取关注”","myexample":"某博主故意使用夸张标题、耸动言论吸引点击，而无意提供真实内容，明显是在哗众取宠。","contrasts":[{"other":"好大喜功","note":"同属“干部易犯错误”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"沽名钓誉","level":"A","group":"第30组","category":"干部易犯错误","sub":"爱慕名利不务实","meaning":"比喻故意矫情做作，用手段猎取名声或赞誉","example":"但对领导干部而言，沉溺于追名逐利，醉心于沽名钓誉，就无异于打开“潘多拉”盒子，万般恶事多因此而起。","pdfpage":177,"usage":"常见机关工作语境，关注浮夸、敷衍、逢迎、自保。","clue":"“用手段刻意猎取名誉”","myexample":"他捐助少量物资，却要求媒体大篇幅宣传，只为换取名声，难免让人怀疑是在沽名钓誉。","contrasts":[{"other":"好大喜功","note":"同属“干部易犯错误”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"阿谀奉承","level":"A","group":"第30组","category":"干部易犯错误","sub":"虚伪敷衍谄媚","meaning":"阿谀：为讨好而说好听的话。奉承：恭维别人。为讨好而说好听的话恭维别人。也作“阿谀逢迎”","example":"在影片中商纣王为了王权之争，宠信妲己，在一声声阿谀奉承中迷失自我，斩杀忠诚之士，修鹿台纵享酒池肉林之乐。这就要求基层干部要严守纪律规矩，自觉把好行为之舵，扭紧思想的方向盘，扣紧每一粒廉洁的“纽扣”。","pdfpage":180,"usage":"常见机关工作语境，关注浮夸、敷衍、逢迎、自保。","clue":"“靠讨好恭维的话取悦别人”","myexample":"面对上司的错误决定，他不但不提醒，反而一味说好话以讨取欢心，显得阿谀奉承。","contrasts":[{"other":"好大喜功","note":"同属“干部易犯错误”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"从谏如流","level":"A","group":"第31组","category":"对待错误的态度","sub":"谦虚接受建议","meaning":"谏：直言规劝。听从规劝像流水一样自然。形容乐于接受别人的批评意见","example":"在我们的领导干部队伍中，有的同志虚怀若谷、从谏如流，热忱欢迎监督。","pdfpage":187,"usage":"注意承认错误还是遮掩错误、是否愿意听取建议。","clue":"“乐于接受直言规劝，像流水般自然”","myexample":"面对下属指出的流程问题，负责人立即采纳并调整安排，真可谓从谏如流。","contrasts":[{"other":"文过饰非","note":"同属“对待错误的态度”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"固执己见","level":"A","group":"第31组","category":"对待错误的态度","sub":"不考虑别人建议","meaning":"顽固地坚持自己的意见，不肯改变","example":"但在承办法官前两次的耐心劝解下，张某与黄某仍然态度坚决、固执己见，对法律生效判决文书拒不承认，认为自己不应该归还申请执行人闻某案涉土地。","pdfpage":191,"usage":"注意承认错误还是遮掩错误、是否愿意听取建议。","clue":"“顽固坚持个人看法”","myexample":"充分讨论后，新证据已经推翻旧方案，他仍不肯改变观点，继续固执己见。","contrasts":[{"other":"刚愎自用","note":"前者自负任性、不听意见，程度更重；后者坚持自己观点不肯改变。"}]},{"word":"时过境迁","level":"A","group":"第32组","category":"改变与不变","sub":"变化巨大","meaning":"境：环境。迁：变迁。时间过去了，环境或情况也随之改变了","example":"时过境迁，我们往往只有回到经典作品产生的历史语境中，才能更清楚地看到其创新性之所在。","pdfpage":199,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"“时间过去、环境情况改变”","myexample":"十多年后回到故乡，工厂变成公园，邻居也搬走了，许多往事已时过境迁。","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"积习难改","level":"A","group":"第32组","category":"改变与不变","sub":"难以改变","meaning":"积习：指多年养成的习惯。长期形成的某种习惯，很难改变","example":"官僚腐败从古到今一直存在，积习难改，反腐倡廉的工作要艰难而持久地进行下去。","pdfpage":201,"usage":"区分变化强度、时间尺度、趋势与根深蒂固程度。","clue":"“多年养成的习惯难以改变”","myexample":"长期拖延的工作习惯已经形成多年，即使制定计划也反复出现，真是积习难改。","contrasts":[{"other":"改弦更张","note":"同属“改变与不变”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"势在必行","level":"A","group":"第33组","category":"顺势造势","sub":"顺势","meaning":"势：形势。客观形势决定必须这样做","example":"我相信农村不久就会出现一个全新的局面，一切恐怕都势在必行了。","pdfpage":204,"usage":"判断顺应趋势还是助长事态，注意褒贬语境。","clue":"“客观形势决定必须去做”","myexample":"随着老龄人口增加，完善无障碍设施已经不是可选项，而是势在必行。","contrasts":[{"other":"推波助澜","note":"同属“顺势造势”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"顺水推舟","level":"A","group":"第33组","category":"顺势造势","sub":"造势","meaning":"舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事","example":"在市场自然增长的时候，营销的作用是顺水推舟；在市场遭遇困境的时候，营销的作用是逆水行舟，更需体现担当，展现价值。","pdfpage":205,"usage":"判断顺应趋势还是助长事态，注意褒贬语境。","clue":"“顺应既有趋势推动事情成功”","myexample":"听到双方已有合作意向，协调员便顺水推舟提出联合试点建议，促成项目落地。","contrasts":[{"other":"推波助澜","note":"同属“顺势造势”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"理所当然","level":"A","group":"第34组","category":"自然会发生","sub":"事情发生合乎情理","meaning":"指从道理上讲，应该如此","example":"“我才知道，原来我在生活中遇到的很多事是可以拿起法律武器保护自己的，而不是一味地回避或忍受，甚至认为理所当然。这个讲座真是为我送来了一场‘及时雨’！”活动结束后，张女士含着泪感慨道。","pdfpage":206,"usage":"区分顺应自然、合乎道理、条件成熟与自然发生。","clue":"“从道理上说本应如此”","myexample":"公共资源应当公平向公众开放，这是从基本原则出发理所当然的要求。","contrasts":[{"other":"顺其自然","note":"同属“自然会发生”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"顺其自然","level":"A","group":"第34组","category":"自然会发生","sub":"事情发生合乎情理","meaning":"意思是顺着事物本来的性质自然发展","example":"这是一本在微信群“首发”的书，先前没有周密的计划，启动后也没有详细的提纲，完全是“草鞋没样，边打变像”的过程，一切都是顺其自然、水到渠成的。","pdfpage":207,"usage":"区分顺应自然、合乎道理、条件成熟与自然发生。","clue":"“尊重自然发展而不强行干预”","myexample":"孩子需要兴趣探索的空间，不必替他安排好每一项选择，有时不妨顺其自然。","contrasts":[{"other":"理所当然","note":"同属“自然会发生”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"居安思危","level":"A","group":"第35组","category":"提早准备和补救","sub":"前期准备","meaning":"处在安定的环境时而能想到可能会出现的危难","example":"居安思危，思则有备，有备无患。","pdfpage":211,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"“处在平安环境中仍考虑未来危险”","myexample":"即使连续几年生产安全形势平稳，管理者也不能放松警惕，而应居安思危，提前排查潜在风险。","contrasts":[{"other":"亡羊补牢","note":"同属“提早准备和补救”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"高枕无忧","level":"A","group":"第35组","category":"提早准备和补救","sub":"准备得当没有忧虑","meaning":"垫高枕头睡觉，无所忧虑","example":"今年雨水大，不要以为大堤修整过一次，就可以高枕无忧了。","pdfpage":211,"usage":"看清预防发生于何时：事前防备、事中补救或事后亡羊补牢。","clue":"准备得当没有忧虑","myexample":"","contrasts":[{"other":"亡羊补牢","note":"同属“提早准备和补救”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"独当一面","level":"A","group":"第36组","category":"办公、管理相关","sub":"形容人工作的状态","meaning":"意思是指单独负责一个方面的工作或任务","example":"与地勤机械师多人合作的工作形式不同，每趟动车的随车机械师只有一人，必须独当一面，特别是在遇到突发情况的时候。","pdfpage":215,"usage":"常与部门协调、任务负责、独立承担等工作情境搭配。","clue":"形容人工作的状态","myexample":"","contrasts":[{"other":"各自为政","note":"同属“办公、管理相关”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"画饼充饥","level":"A","group":"第37组","category":"空谈与虚幻","sub":"不靠谱的做法","meaning":"画个饼子来解饿。本比喻徒有虚名而于实际无好处。后多用来比喻以空想来安慰自己","example":"冲绳国际大学教授前泊博盛表示，虽然日美达成了《日美地位协定》有关环境问题的补充协定，但日方进入美军基地调查需要得到美方许可，同时美方没有义务对日方实地调查要求作出回应，这无异于“画饼充饥”。","pdfpage":218,"usage":"区分不切实际的计划、徒劳行为和只有理论没有实践。","clue":"不靠谱的做法","myexample":"","contrasts":[{"other":"空中楼阁","note":"同属“空谈与虚幻”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"镜花水月","level":"A","group":"第37组","category":"空谈与虚幻","sub":"实现不了","meaning":"镜子里的花，水里的月亮。比喻虚幻的东西","example":"4K似乎正在沿着3D的足迹，成为看上去很美却让消费者够不到摸不着的镜花水月。","pdfpage":220,"usage":"区分不切实际的计划、徒劳行为和只有理论没有实践。","clue":"实现不了","myexample":"","contrasts":[{"other":"空中楼阁","note":"同属“空谈与虚幻”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"蜂拥而至","level":"A","group":"第38组","category":"来者众多","sub":"形容到来","meaning":"像一窝蜂似地一拥而来。形容很多人乱哄哄地朝一个地方聚拢","example":"尽管当时很多村民听不懂汉语对白，每当有电影在村子放映，十里八乡的人依然会蜂拥而至。","pdfpage":224,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"形容到来","myexample":"","contrasts":[{"other":"无人问津","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"门可罗雀","level":"A","group":"第38组","category":"来者众多","sub":"形容人多、人少","meaning":"罗：张网捕捉。大门之前可以张起网来捕麻雀。形容十分冷落，宾客稀少","example":"她发现，尽管近年来“博物馆热”成为热门话题，一些大博物馆一票难求成为常态，但是许多中小博物馆仍然存在门可罗雀的情况，当地人看到有外地游客到博物馆参观还会说“还有人到这里？”","pdfpage":225,"usage":"关注人群往来是否连续、是否蜂拥到来或无人问津。","clue":"形容人多、人少","myexample":"","contrasts":[{"other":"无人问津","note":"同属“来者众多”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"人山人海","level":"A","group":"第39组","category":"人多人少","sub":"形容人多、热闹","meaning":"形容聚集的人非常多","example":"习近平抵达黎明大街路口，换乘敞篷车，与金正恩同车前往锦绣山太阳宫广场。街道两旁，人山人海，盛况空前。","pdfpage":229,"usage":"区分人多热闹、车马往来与孤身无依。","clue":"形容人多、热闹","myexample":"","contrasts":[{"other":"万人空巷","note":"同属“人多人少”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"川流不息","level":"A","group":"第39组","category":"人多人少","sub":"形容人多、热闹","meaning":"形容行人、车马很多，像水流一样连续不断","example":"历史川流不息，精神代代相传。","pdfpage":230,"usage":"区分人多热闹、车马往来与孤身无依。","clue":"形容人多、热闹","myexample":"","contrasts":[{"other":"万人空巷","note":"同属“人多人少”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"泥沙俱下","level":"A","group":"第40组","category":"好坏掺杂","sub":"好坏都有","meaning":"俱：都。泥土和沙子一同随水冲了下来。比喻人或事物好坏混杂在一起。（侧重量大且好坏都有）","example":"鼓励内容创业的百花齐放，不等于支持内容市场的泥沙俱下。内容创业者在时代风口上受益，就应该为自己的影响力负责。","pdfpage":233,"usage":"先判断“程度不齐、好坏混杂、真假掺杂”，性质不一样。","clue":"好坏都有","myexample":"","contrasts":[{"other":"参差不齐","note":"同属“好坏掺杂”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"鱼目混珠","level":"A","group":"第40组","category":"好坏掺杂","sub":"好坏都有","meaning":"用鱼眼睛假冒珍珠。比喻以假乱真。（也可指以次充好）","example":"近年来，中药材市场价格不断上涨，少数不法分子铤而走险：用染色的玉米须冒充藏红花；用苹果皮代替牡丹片，甚至用萃取后的药渣“鱼目混珠”，让消费者防不胜防。","pdfpage":234,"usage":"先判断“程度不齐、好坏混杂、真假掺杂”，性质不一样。","clue":"好坏都有","myexample":"","contrasts":[{"other":"鱼龙混杂","note":"前者好坏人物混在一起；后者以假充真。"}]},{"word":"后继无人","level":"B","group":"第2组","category":"文化传承","sub":"传承方式","meaning":"继：继续，继承。没有继承的人。形容事业缺少接班人","example":"因后继无人，日本九州和冲绳地区出现企业并购潮。","pdfpage":15,"usage":"关注“传承是否连续、采用何种传承方式、能否继续”三个层次。","clue":"“传承事业找不到接班人”","myexample":"许多老工匠相继退休，年轻人又不愿学艺，这项濒危技艺正面临后继无人的难题。","contrasts":[{"other":"承上启下","note":"同属“文化传承”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"血脉相通","level":"B","group":"第2组","category":"文化传承","sub":"传承不间断","meaning":"血脉：血统。原指有血缘亲属关系。也比喻极亲近的关系","example":"中泰两国毗邻而居，血脉相通。共建“一带一路”使两国关系好上加好、亲上加亲。我们要弘扬传统友好，加强高层往来，引领好两国关系发展。","pdfpage":12,"usage":"关注“传承是否连续、采用何种传承方式、能否继续”三个层次。","clue":"“关系深厚、像同一血脉一样亲近”","myexample":"两地民众虽相隔千里，却拥有深厚的历史渊源和共同文化记忆，情感上血脉相通。","contrasts":[{"other":"承上启下","note":"同属“文化传承”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"陈陈相因","level":"B","group":"第2组","category":"文化传承","sub":"传承不间断","meaning":"粮仓里的米谷一年接一年地堆积起来。比喻沿袭老一套，没有改进","example":"延续民族文化血脉并不等于陈陈相因、泥古守旧，而是要与时俱进、推陈出新，让中华优秀传统文化焕发出勃勃生机。","pdfpage":14,"usage":"关注“传承是否连续、采用何种传承方式、能否继续”三个层次。","clue":"“沿袭老一套，没有改进”","myexample":"这套教材十年不作更新，年年照搬旧内容，讲法越来越陈陈相因。","contrasts":[{"other":"承上启下","note":"同属“文化传承”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"弃旧图新","level":"B","group":"第3组","category":"改革创新","sub":"改良旧的换新的","meaning":"意思是抛弃旧的，谋求新的。多指由坏的转向好的，离开错误的道路走向正确的道路","example":"他说，韩国政治应弃旧图新，推行改革，推翻独断专横的两党政治体系，创出新的多党政治体系，从而迎接充满希望与活力的民主政治时代。","pdfpage":18,"usage":"重点区分除旧、创新、筛选精华与制度变革的对象。","clue":"“抛弃旧东西，转向新的道路”","myexample":"面对过去的错误经营理念，企业终于决定彻底舍弃旧路、另谋新生，开始弃旧图新。","contrasts":[{"other":"吐故纳新","note":"同属“改革创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"剑走偏锋","level":"B","group":"第4组","category":"做法、构思创新","sub":"形容创新、独特","meaning":"指不走常规，找一些新的、不同以往的办法来解决问题，以求出奇制胜","example":"种种前车之鉴，就是因为在文旅创新中，找到了好特色、也打磨出了好创意，但是没有把握好细节与边界，剑走偏锋而遭到反噬。","pdfpage":22,"usage":"多用于作品构思、做法创新或个人风格，注意是否故意求新。","clue":"“不走寻常方法寻求突破”","myexample":"常规方案迟迟不能解决难题，他尝试一条出人意料的技术路线，以求出奇制胜，算是剑走偏锋。","contrasts":[{"other":"不落窠臼","note":"同属“做法、构思创新”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"有条不紊","level":"B","group":"第6组","category":"按规矩办事","sub":"有步骤有条理","meaning":"条：条理。紊：乱。形容办事很有条理","example":"中美经贸团队的磋商工作一直在有条不紊、按计划如期推进。","pdfpage":32,"usage":"区分按步骤推进和机械遵循成规，不要混为一谈。","clue":"“工作步骤清楚、井然有序”","myexample":"突发停电后，值班员先确认安全、再启用备用电源、最后逐项检查，全过程有条不紊。","contrasts":[{"other":"循序渐进","note":"同属“按规矩办事”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"望而生畏","level":"B","group":"第7组","category":"处境困难","sub":"不敢前进","meaning":"指看见了就害怕。（侧重情绪上的害怕）","example":"他坐在椅子上，一言不发，那黑而严峻的面孔，令人望而生畏。","pdfpage":34,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“看见就产生害怕情绪”","myexample":"陡峭的山路旁就是深谷，尚未出发，初次登山的游客已望而生畏。","contrasts":[{"other":"举步维艰","note":"同属“处境困难”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"畏葸不前","level":"B","group":"第7组","category":"处境困难","sub":"不敢前进","meaning":"畏惧退缩，不敢前进","example":"这个时候就要一鼓作气，瞻前顾后、畏葸不前不仅不能前进，而且可能前功尽弃。","pdfpage":35,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“因为胆怯而不敢前进”","myexample":"尽管风险已经充分可控，他仍因害怕失败而迟迟不敢采取行动，始终畏葸不前。","contrasts":[{"other":"举步维艰","note":"同属“处境困难”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"踟蹰不前","level":"B","group":"第7组","category":"处境困难","sub":"不好抉择","meaning":"意思为迟疑不决，不敢前进","example":"数字化转型能为中小企业带来提质升级、降本增效、业务创新等发展红利，但由于前期投入高、不确定性大、回报周期长，不少企业往往踟蹰不前。","pdfpage":37,"usage":"先判断是害怕、犹豫、进退两难，还是行动受阻。","clue":"“犹豫不决、徘徊不前”","myexample":"面对两条看起来都可行的路线，他反复权衡却迟迟无法做决定，踟蹰不前。","contrasts":[{"other":"举步维艰","note":"同属“处境困难”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"命悬一线","level":"B","group":"第8组","category":"形势危险","sub":"形势危险","meaning":"处境危险，随时可能丧失生命","example":"5月1日，突尼斯坚杜拜省的玛卜鲁卡突发心跳呼吸骤停，命悬一线之时，是中国援突医疗队的医护工作者让她转危为安。","pdfpage":42,"usage":"先判断是生命危险、局势动荡，还是时间紧迫。","clue":"“生命随时可能失去”","myexample":"被困矿工的氧气供应即将耗尽，救援人员必须争分夺秒，生命已命悬一线。","contrasts":[{"other":"危在旦夕","note":"同属“形势危险”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"拨云见日","level":"B","group":"第9组","category":"事物出现、发展、衰落","sub":"其他","meaning":"拨开乌云见到太阳。比喻冲破黑暗见到光明。也比喻疑团消除，心里顿时明白","example":"“拨云见日终有时，一碧万顷醉晴空。”不容辩驳的数据事实击碎造谣与谎言编织的黑幕，东方明珠光芒更加耀眼夺目。心中有“数”，脚下有路。","pdfpage":55,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“疑惑消散、真相逐渐明朗”","myexample":"专家将看似矛盾的监测数据一一解释清楚，大家终于拨云见日，理解了异常原因。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"柳暗花明","level":"B","group":"第9组","category":"事物出现、发展、衰落","sub":"其他","meaning":"垂柳浓密，鲜花夺目。形容柳树成荫，繁花似锦的春天景象。也比喻在困难中遇到转机","example":"成绩虽然不尽如人意，但辽篮如果调整得当，第三阶段和季后赛有望迎来柳暗花明的新局面。","pdfpage":55,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“困境中意外出现转机”","myexample":"项目连续三次申请被拒，正打算放弃时却获得新的合作机会，局面忽然柳暗花明。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"每况愈下","level":"B","group":"第9组","category":"事物出现、发展、衰落","sub":"逐渐衰落","meaning":"指情况越来越坏，越来越糟糕。（也可形容身体或精神越来越糟糕）","example":"7年多来，饱受动荡之苦的突尼斯人民生活水平每况愈下。","pdfpage":54,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“状况越来越差”","myexample":"由于维护经费不断削减，路面破损面积逐年增加，通行状况每况愈下。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"波澜壮阔","level":"B","group":"第9组","category":"事物出现、发展、衰落","sub":"其他","meaning":"原形容水面辽阔，现比喻声势雄壮或规模宏大","example":"此次演出不仅为观众带来一幅波澜壮阔的运河音画，也通过“民乐联合”的形式彰显出大运河的文化活力。","pdfpage":55,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“规模宏大、声势雄壮”","myexample":"从一个偏远实验室到全球合作网络，这段科学探索史规模宏大、气势不凡，可谓波澜壮阔。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"风起云涌","level":"B","group":"第9组","category":"事物出现、发展、衰落","sub":"出现、萌生","meaning":"形容雄浑磅礴之势；也比喻事物迅速发展，声势浩大","example":"时代风起云涌，目睹了百年交汇，注视着国际盛会，更见证了青年在历史洪流中惊起波涛。","pdfpage":48,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“事物快速兴起，声势浩大”","myexample":"新法规出台后，各地创新实验室迅速成立，人才和资本纷纷涌入，一时间风起云涌。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"高歌猛进","level":"B","group":"第9组","category":"事物出现、发展、衰落","sub":"发展势头好","meaning":"意思是高声歌唱，勇猛前进；形容在前进的道路上，充满乐观精神","example":"自去年开工以来，项目建设一路高歌猛进，预计年底验收手续办理后即可试生产。","pdfpage":50,"usage":"辨别萌生、快速发展、鼎盛与逐步衰落的具体阶段。","clue":"“乐观昂扬、勇猛向前”","myexample":"研发团队突破关键瓶颈后信心大增，带着昂扬斗志一路高歌猛进。","contrasts":[{"other":"如火如荼","note":"同属“事物出现、发展、衰落”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"一概而论","level":"B","group":"第10组","category":"竞争比较","sub":"同等地位","meaning":"用同一标准来对待或处理（多用于否定）：不能～","example":"其实，服中药时能否喝绿豆汤，不可一概而论，应根据病情的寒热虚实以及所服中药的性味而定。","pdfpage":66,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“不考虑差别，用同一标准判断”","myexample":"不同地区的产业基础和人口结构差异显著，政策效果绝不能一概而论。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"崭露头角","level":"B","group":"第10组","category":"竞争比较","sub":"表现突出","meaning":"崭：高出。比喻突出地显露出才能。（侧重能力）","example":"近日，记者发现上海一批高学历、广视野、敢创新，且经过多年基层磨炼的年轻干部，正在崭露头角。","pdfpage":63,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“开始显露出众才能”","myexample":"这位年轻设计师第一次参赛便拿下重要奖项，在行业内迅速崭露头角。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"望其项背","level":"B","group":"第10组","category":"竞争比较","sub":"赶得上/赶不上","meaning":"项：脖子的后部。能够看到别人的颈项和脊背。比喻有能力赶得上。（常用于否定句：难以～、无法～、不能～）","example":"AI音乐的创作效率，让传统音乐制作难以望其项背。","pdfpage":64,"usage":"重点判断比较对象、差距方向、是否能够赶上。","clue":"“赶得上某人；常用于否定句”","myexample":"该团队在计算能力上领先数代，后来者短期内恐怕难以望其项背。","contrasts":[{"other":"望尘莫及","note":"同属“竞争比较”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"力有未逮","level":"B","group":"第11组","category":"能力不足","sub":"能力有限","meaning":"指有意愿却做不到","example":"虽然我们强调政府应尽可能为民服务，但单纯靠政府来解决民生问题力有未逮。","pdfpage":69,"usage":"区分有心无力、忙不过来、资源短缺与无计可施。","clue":"“有心去做但能力达不到”","myexample":"我们愿意为受灾地区提供帮助，但当前运力不足，部分需求确实力有未逮。","contrasts":[{"other":"应接不暇","note":"同属“能力不足”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"双峰并峙","level":"B","group":"第13组","category":"搭档配合","sub":"二者都好","meaning":"意思通常指的是两座高大的山峰彼此对立地耸立着。这个成语不仅用来形容自然界的景观，也常用于比喻在某一领域或文化上同时达到极高成就的两个人物或事物","example":"在《红楼梦》里，薛宝钗和林黛玉共用一首判词，排名第一，双峰并峙，各具风采。","pdfpage":82,"usage":"看两者是相互促进、互补协调，还是彼此映衬。","clue":"“两个高手或事物同时达到很高水平”","myexample":"两位大师分别代表不同学派的最高成就，在这个领域形成双峰并峙的格局。","contrasts":[{"other":"相得益彰","note":"同属“搭档配合”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"相映成趣","level":"B","group":"第13组","category":"搭档配合","sub":"二者都好","meaning":"映：映衬。趣：意趣。相互衬托着，显得很有情趣，很有意思","example":"法国游客“玩”的“糟评”，与法国作家莫迪亚诺“写”的“诺奖”相映成趣，让人不乏有些联想。","pdfpage":82,"usage":"看两者是相互促进、互补协调，还是彼此映衬。","clue":"“彼此衬托形成情趣”","myexample":"街边古老的青石墙与孩子们的彩绘互相映衬，竟然相映成趣。","contrasts":[{"other":"相得益彰","note":"同属“搭档配合”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"锦上添花","level":"B","group":"第13组","category":"搭档配合","sub":"合作配合","meaning":"指在有彩色花纹的丝织品上再绣上花朵。比喻美上加美，喜上加喜","example":"也许，对中国的银行来说，已经习惯了做锦上添花，而不是雪中送炭的事了。这些年来，中国的企业，所以寿命都十分短暂。","pdfpage":81,"usage":"看两者是相互促进、互补协调，还是彼此映衬。","clue":"“原本已好，再添美好”","myexample":"这款软件原有功能已经完善，新加入的个性化皮肤只是锦上添花，并非解决核心缺陷。","contrasts":[{"other":"相得益彰","note":"同属“搭档配合”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"分道扬镳","level":"B","group":"第15组","category":"错误抉择和方向","sub":"相悖、相反","meaning":"道：道路。镳：马嚼子。分开道路，驱马前进。指分道而行。也比喻思想、志趣不同而各人干各人的事。也作“扬镳分路”","example":"经历了两年半的短暂“联姻”，青岛啤酒与三得利最终分道扬镳。","pdfpage":88,"usage":"判定错在目标方向、主次关系，还是方式方法。","clue":"“志趣不同而各走各的路”","myexample":"两位合伙人在发展方向上分歧越来越大，最终决定各自创业，从此分道扬镳。","contrasts":[{"other":"南辕北辙","note":"同属“错误抉择和方向”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"与虎谋皮","level":"B","group":"第16组","category":"错误做法（寓言故事）","sub":"错误做法","meaning":"跟老虎商量取下它的皮来，比喻跟坏人商量要其牺牲自己的利益，是绝对办不到的","example":"美国民众要指望着这些政客来做出回应性的改革和调整，完全是与虎谋皮、毫无可能。","pdfpage":92,"usage":"错误行为通常由具体寓言引申，注意事件结构。","clue":"“要求损害者主动牺牲自身利益，不可能实现”","myexample":"希望那些靠排污获利的企业主动放弃利润、无需监管就自行停产，几乎是与虎谋皮。","contrasts":[{"other":"削足适履","note":"同属“错误做法（寓言故事）”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"东施效颦","level":"B","group":"第16组","category":"错误做法（寓言故事）","sub":"错误做法","meaning":"比喻盲目地胡乱模仿，效果适得其反","example":"虽然“西方甄选”及时被封，难挡南方甄选、北方甄选、中方甄选们继续东施效颦。","pdfpage":92,"usage":"错误行为通常由具体寓言引申，注意事件结构。","clue":"“盲目模仿、弄巧成拙”","myexample":"没有理解成功案例的内在逻辑，却机械模仿其外观，最后效果更差，只能是东施效颦。","contrasts":[{"other":"削足适履","note":"同属“错误做法（寓言故事）”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"和风细雨","level":"B","group":"第17组","category":"教育影响批评","sub":"教育和批评","meaning":"意思是比喻耐心地和颜悦色地批评或劝说","example":"周口下大力气打造精神文明建设品牌项目，开展了道德模范的感人事迹、无私奉献的志愿服务精神、内容丰富的公益剧场等活动，这样的活动犹如和风细雨，在潜移默化中改变着市民的思想素质、生活方式和精神面貌。","pdfpage":97,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“温和委婉地批评和劝说”","myexample":"与情绪低落的学生沟通时，教师不用强硬训斥，而以温和耐心的方式劝导，做到了和风细雨。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"如沐春风","level":"B","group":"第17组","category":"教育影响批评","sub":"影响感化","meaning":"通常用来形容人感到非常舒适和愉悦。它的意思是像沐浴在春风里一样，感受到舒适的感觉","example":"“芜湖正在建设省域副中心城市，因为坐拥长三角，覆盖了我们80%以上的客户，最关键的是当地让企业如沐春风的营商环境，没有理由不选择这里。”","pdfpage":95,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“受到美好教诲，舒适愉悦”","myexample":"听完教授真诚而平易的讲解，学生们都感到轻松温暖，仿佛如沐春风。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"成风化人","level":"B","group":"第17组","category":"教育影响批评","sub":"影响感化","meaning":"成风，倡树一种社会风气。化人，感染人、影响人、教育人。通过倡导树立一种社会风气来影响、教育感化社会大众","example":"我们要深入学习领会、认真贯彻落实这些重要论述精神，切实传承发展好中华传统美德，用中华传统美德成风化人。","pdfpage":95,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“形成社会风气来感化教育人”","myexample":"城市通过长期营造尊重劳动的社会风尚，让更多年轻人主动参与公益，体现了成风化人的力量。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"润物无声","level":"B","group":"第17组","category":"教育影响批评","sub":"影响感化","meaning":"指有大胸怀者，做了贡献而不张扬，默默奉献。（也指文化教育等对人的潜移默化的影响）","example":"道德是一种力量，它春风化雨，润物无声；道德是一面旗帜，它鼓舞人们，引领方向。","pdfpage":95,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“无声无息地滋润和感化”","myexample":"图书馆通过细致的阅读活动慢慢培养孩子的阅读习惯，教育影响润物无声。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"苦口婆心","level":"B","group":"第17组","category":"教育影响批评","sub":"教育和批评","meaning":"用来形容一个人善意且耐心地反复劝导他人","example":"走街串巷查隐患、苦口婆心解纷争、一丝不苟办实事……在日常生活中，一群来回穿梭在社区、乡村的网格员，用他们忙碌的身影，提升了群众的安全感。","pdfpage":96,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“善意、耐心、反复劝导”","myexample":"医生担心患者再犯同样的饮食错误，一遍又一遍地耐心劝说，可谓苦口婆心。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"诲人不倦","level":"B","group":"第17组","category":"教育影响批评","sub":"教育和批评","meaning":"诲：教诲，教导。教导人时很有耐心而不知疲倦","example":"从经师到人师，从教书先生到大国良师，好的教师学而不厌、诲人不倦，为党育人、为国育才。","pdfpage":97,"usage":"注意教育方式是否温和、长期影响、当面规劝或顿悟。","clue":"“教学耐心，不知疲倦”","myexample":"即使被学生反复追问同一道难题，老师仍耐心讲解、毫无厌烦，称得上诲人不倦。","contrasts":[{"other":"潜移默化","note":"同属“教育影响批评”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"乐此不疲","level":"B","group":"第18组","category":"工作学习状态","sub":"尽心钻研学习","meaning":"因酷爱干某事而不感觉厌烦。形容对某事特别爱好而沉浸其中","example":"变废为宝是该公司一直以来乐此不疲的事情，但随着生产经营规模的扩大，企业遇到了融资难问题。","pdfpage":103,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“特别喜欢做某事而不知疲倦”","myexample":"他几十年如一日研究昆虫，观察到深夜仍不觉得厌烦，始终乐此不疲。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"夙兴夜寐","level":"B","group":"第18组","category":"工作学习状态","sub":"抓紧时间、勤奋","meaning":"夙：早。兴：起来。寐：睡觉。早起晚睡，形容勤奋辛劳","example":"他们夜以继日、夙兴夜寐，默默奋战在每一个白天和夜晚，以实际行动尽职担当，全力以赴投入到疫情防控阻击战中。","pdfpage":106,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“起得早、睡得晚，辛勤工作”","myexample":"农忙时节，乡亲们天不亮就下地，深夜才休息，常常夙兴夜寐。","contrasts":[{"other":"心无旁骛","note":"同属“工作学习状态”类，但要分别结合两个词的释义、搭配对象和具体侧重点判断。"}]},{"word":"夜以继日","level":"B","group":"第18组","category":"工作学习状态","sub":"抓紧时间、勤奋","meaning":"日夜不停地做某事。多形容十分勤奋、勤恳、忙碌","example":"现在每一天的状态就是夜以继日，所做的工作事无巨细。","pdfpage":105,"usage":"区别专注、耗费心血、勤勉不倦与奔波劳累。","clue":"“白天黑夜都不停”","myexample":"应急抢险队连续多个昼夜轮班施工，几乎夜以继日地修复堤坝。","contrasts":[{"other":"心无旁骛","note":"同属“
