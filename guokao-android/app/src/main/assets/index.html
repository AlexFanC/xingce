并论","望尘莫及"],"answer":1,"optionReasons":{"相形见绌":"该词通常表示“形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足”，侧重点是“和别人相比较”。题干则着重““不考虑差别，用同一标准判断””，语义指向不同。","相提并论":"该词表示“把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）”。虽然可能与正确词相近，但这道题的关键信息是““不考虑差别，用同一标准判断””，仍以“一概而论”更贴合。","望尘莫及":"该词通常表示“莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦”，侧重点是“赶得上/赶不上”。题干则着重““不考虑差别，用同一标准判断””，语义指向不同。"}},{"id":"Q177","word":"崭露头角","level":"B","group":"第10组","category":"竞争比较","stem":"这位年轻设计师第一次参赛便拿下重要奖项，在行业内迅速____。","clue":"“开始显露出众才能”","options":["相提并论","崭露头角","望尘莫及","相形见绌"],"answer":1,"optionReasons":{"相提并论":"该词通常表示“把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）”，侧重点是“同等地位”。题干则着重““开始显露出众才能””，语义指向不同。","望尘莫及":"该词通常表示“莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦”，侧重点是“赶得上/赶不上”。题干则着重““开始显露出众才能””，语义指向不同。","相形见绌":"该词通常表示“形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足”，侧重点是“和别人相比较”。题干则着重““开始显露出众才能””，语义指向不同。"}},{"id":"Q178","word":"望其项背","level":"B","group":"第10组","category":"竞争比较","stem":"该团队在计算能力上领先数代，后来者短期内恐怕难以____。","clue":"“赶得上某人；常用于否定句”","options":["相形见绌","相提并论","望其项背","望尘莫及"],"answer":2,"optionReasons":{"相形见绌":"该词通常表示“形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足”，侧重点是“和别人相比较”。题干则着重““赶得上某人；常用于否定句””，语义指向不同。","相提并论":"该词通常表示“把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）”，侧重点是“同等地位”。题干则着重““赶得上某人；常用于否定句””，语义指向不同。","望尘莫及":"该词表示“莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦”。虽然可能与正确词相近，但这道题的关键信息是““赶得上某人；常用于否定句””，仍以“望其项背”更贴合。"}},{"id":"Q179","word":"力有未逮","level":"B","group":"第11组","category":"能力不足","stem":"我们愿意为受灾地区提供帮助，但当前运力不足，部分需求确实____。","clue":"“有心去做但能力达不到”","options":["顾此失彼","力有未逮","应接不暇","回天乏术"],"answer":1,"optionReasons":{"顾此失彼":"该词通常表示“顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）”，侧重点是“应付不了”。题干则着重““有心去做但能力达不到””，语义指向不同。","应接不暇":"该词通常表示“暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）”，侧重点是“应付不了”。题干则着重““有心去做但能力达不到””，语义指向不同。","回天乏术":"该词表示“回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救”。虽然可能与正确词相近，但这道题的关键信息是““有心去做但能力达不到””，仍以“力有未逮”更贴合。"}},{"id":"Q180","word":"双峰并峙","level":"B","group":"第13组","category":"搭档配合","stem":"两位大师分别代表不同学派的最高成就，在这个领域形成____的格局。","clue":"“两个高手或事物同时达到很高水平”","options":["交相辉映","双峰并峙","相辅相成","相得益彰"],"answer":1,"optionReasons":{"交相辉映":"该词表示“各种光亮、色彩相互照耀、映射。常用语形容美好的景象”。虽然可能与正确词相近，但这道题的关键信息是““两个高手或事物同时达到很高水平””，仍以“双峰并峙”更贴合。","相辅相成":"该词通常表示“辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可”，侧重点是“合作配合”。题干则着重““两个高手或事物同时达到很高水平””，语义指向不同。","相得益彰":"该词通常表示“相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来”，侧重点是“合作配合”。题干则着重““两个高手或事物同时达到很高水平””，语义指向不同。"}},{"id":"Q181","word":"相映成趣","level":"B","group":"第13组","category":"搭档配合","stem":"街边古老的青石墙与孩子们的彩绘互相映衬，竟然____。","clue":"“彼此衬托形成情趣”","options":["交相辉映","相映成趣","相辅相成","相得益彰"],"answer":1,"optionReasons":{"交相辉映":"该词表示“各种光亮、色彩相互照耀、映射。常用语形容美好的景象”。虽然可能与正确词相近，但这道题的关键信息是““彼此衬托形成情趣””，仍以“相映成趣”更贴合。","相辅相成":"该词通常表示“辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可”，侧重点是“合作配合”。题干则着重““彼此衬托形成情趣””，语义指向不同。","相得益彰":"该词通常表示“相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来”，侧重点是“合作配合”。题干则着重““彼此衬托形成情趣””，语义指向不同。"}},{"id":"Q182","word":"锦上添花","level":"B","group":"第13组","category":"搭档配合","stem":"这款软件原有功能已经完善，新加入的个性化皮肤只是____，并非解决核心缺陷。","clue":"“原本已好，再添美好”","options":["相得益彰","交相辉映","锦上添花","相辅相成"],"answer":2,"optionReasons":{"相得益彰":"该词表示“相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来”。虽然可能与正确词相近，但这道题的关键信息是““原本已好，再添美好””，仍以“锦上添花”更贴合。","交相辉映":"该词通常表示“各种光亮、色彩相互照耀、映射。常用语形容美好的景象”，侧重点是“二者都好”。题干则着重““原本已好，再添美好””，语义指向不同。","相辅相成":"该词表示“辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可”。虽然可能与正确词相近，但这道题的关键信息是““原本已好，再添美好””，仍以“锦上添花”更贴合。"}},{"id":"Q183","word":"分道扬镳","level":"B","group":"第15组","category":"错误抉择和方向","stem":"两位合伙人在发展方向上分歧越来越大，最终决定各自创业，从此____。","clue":"“志趣不同而各走各的路”","options":["南辕北辙","分道扬镳","舍本逐末","缘木求鱼"],"answer":1,"optionReasons":{"南辕北辙":"该词表示“辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标”。虽然可能与正确词相近，但这道题的关键信息是““志趣不同而各走各的路””，仍以“分道扬镳”更贴合。","舍本逐末":"该词通常表示“舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置”，侧重点是“错误抉择”。题干则着重““志趣不同而各走各的路””，语义指向不同。","缘木求鱼":"该词表示“缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）”。虽然可能与正确词相近，但这道题的关键信息是““志趣不同而各走各的路””，仍以“分道扬镳”更贴合。"}},{"id":"Q184","word":"与虎谋皮","level":"B","group":"第16组","category":"错误做法（寓言故事）","stem":"希望那些靠排污获利的企业主动放弃利润、无需监管就自行停产，几乎是____。","clue":"“要求损害者主动牺牲自身利益，不可能实现”","options":["拔苗助长","削足适履","越俎代庖","与虎谋皮"],"answer":3,"optionReasons":{"拔苗助长":"该词表示“用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长””。虽然可能与正确词相近，但这道题的关键信息是““要求损害者主动牺牲自身利益，不可能实现””，仍以“与虎谋皮”更贴合。","削足适履":"该词表示“履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套”。虽然可能与正确词相近，但这道题的关键信息是““要求损害者主动牺牲自身利益，不可能实现””，仍以“与虎谋皮”更贴合。","越俎代庖":"该词表示“越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情”。虽然可能与正确词相近，但这道题的关键信息是““要求损害者主动牺牲自身利益，不可能实现””，仍以“与虎谋皮”更贴合。"}},{"id":"Q185","word":"东施效颦","level":"B","group":"第16组","category":"错误做法（寓言故事）","stem":"没有理解成功案例的内在逻辑，却机械模仿其外观，最后效果更差，只能是____。","clue":"“盲目模仿、弄巧成拙”","options":["拔苗助长","越俎代庖","削足适履","东施效颦"],"answer":3,"optionReasons":{"拔苗助长":"该词表示“用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长””。虽然可能与正确词相近，但这道题的关键信息是““盲目模仿、弄巧成拙””，仍以“东施效颦”更贴合。","越俎代庖":"该词表示“越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情”。虽然可能与正确词相近，但这道题的关键信息是““盲目模仿、弄巧成拙””，仍以“东施效颦”更贴合。","削足适履":"该词表示“履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套”。虽然可能与正确词相近，但这道题的关键信息是““盲目模仿、弄巧成拙””，仍以“东施效颦”更贴合。"}},{"id":"Q186","word":"和风细雨","level":"B","group":"第17组","category":"教育影响批评","stem":"与情绪低落的学生沟通时，教师不用强硬训斥，而以温和耐心的方式劝导，做到了____。","clue":"“温和委婉地批评和劝说”","options":["醍醐灌顶","耳濡目染","潜移默化","和风细雨"],"answer":3,"optionReasons":{"醍醐灌顶":"该词通常表示“醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快”，侧重点是“醒悟、唤醒”。题干则着重““温和委婉地批评和劝说””，语义指向不同。","耳濡目染":"该词通常表示“濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）”，侧重点是“影响感化”。题干则着重““温和委婉地批评和劝说””，语义指向不同。","潜移默化":"该词通常表示“潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）”，侧重点是“影响感化”。题干则着重““温和委婉地批评和劝说””，语义指向不同。"}},{"id":"Q187","word":"如沐春风","level":"B","group":"第17组","category":"教育影响批评","stem":"听完教授真诚而平易的讲解，学生们都感到轻松温暖，仿佛____。","clue":"“受到美好教诲，舒适愉悦”","options":["潜移默化","如沐春风","耳濡目染","醍醐灌顶"],"answer":1,"optionReasons":{"潜移默化":"该词表示“潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）”。虽然可能与正确词相近，但这道题的关键信息是““受到美好教诲，舒适愉悦””，仍以“如沐春风”更贴合。","耳濡目染":"该词表示“濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）”。虽然可能与正确词相近，但这道题的关键信息是““受到美好教诲，舒适愉悦””，仍以“如沐春风”更贴合。","醍醐灌顶":"该 rue,"source":"教材例句挖空（与真题不同）","optionReasons":{"鱼龙混杂":"该词通常表示“比喻坏人和好人混在一起。同“龙蛇混杂”。（现在用法不只形容人，也可形容事物）”，侧重点是“好坏都有”。题干则着重“不分好坏”，语义指向不同。","参差不齐":"该词通常表示“参差：高低、长短、大小不齐的样子。形容不一致、有差别。（多搭配水平、质量、进展等）”，侧重点是“好坏都有”。题干则着重“不分好坏”，语义指向不同。","良莠不齐":"该词通常表示“莠：狗尾草，比喻坏人。指好人、坏人混在一起。同“良莠不一”。（现在用法不只形容人，也可形容事物）”，侧重点是“好坏都有”。题干则着重“不分好坏”，语义指向不同。"}}],"defs":{"博大精深":{"meaning":"博大：广大。精深：精湛深刻。形容学识、思想、理论广博丰富，精湛深刻","level":"S","group":"第1组","category":"中华文明传统文化","pdfpage":10},"历久弥新":{"meaning":"弥：更加。指经历长久的时间而更加鲜活，更加有活力，更显价值","level":"S","group":"第1组","category":"中华文明传统文化","pdfpage":10},"承上启下":{"meaning":"接续上面的，引起下面的。也指诗文中连接沟通文字的字句，使文字自然过渡","level":"S","group":"第2组","category":"文化传承","pdfpage":15},"继往开来":{"meaning":"继承前人的事业，开辟未来的道路","level":"S","group":"第2组","category":"文化传承","pdfpage":15},"吐故纳新":{"meaning":"纳：使进入，吸入。道家的养生术，吐出浊气，吸进新鲜空气。后多比喻扬弃旧的，吸收新的。（多形容事物在发展中呈现新的面貌）","level":"S","group":"第3组","category":"改革创新","pdfpage":17},"革故鼎新":{"meaning":"革：除去。鼎新：立新。指革除旧的，建立新的。多指改朝换代或重大变革。（多政治角度）","level":"S","group":"第3组","category":"改革创新","pdfpage":18},"不落窠臼":{"meaning":"意为不落俗套，有独创风格（多用于形容文章或艺术作品）","level":"S","group":"第4组","category":"做法、构思创新","pdfpage":26},"别出心裁":{"meaning":"心裁：内心的决断。另外想出与众不同的办法、主意。也作“独出心裁”。（侧重想法构思巧妙）","level":"S","group":"第4组","category":"做法、构思创新","pdfpage":24},"匠心独运":{"meaning":"匠心：精巧的心思。具有独到的创造性。多指文学艺术的创作构思。同“独具匠心”“匠心独运”。（侧重文艺创作的心思巧妙）","level":"S","group":"第4组","category":"做法、构思创新","pdfpage":24},"因循守旧":{"meaning":"因循：沿用旧办法。指一直沿用旧办法而不加改变。（侧重新与旧）","level":"S","group":"第5组","category":"守旧不创新","pdfpage":28},"固步自封":{"meaning":"封：限制在一定的范围内。比喻因循守旧，安于现状，不求创新进取。（侧重开放与封闭）","level":"S","group":"第5组","category":"守旧不创新","pdfpage":29},"举步维艰":{"meaning":"抬脚行走十分困难。形容已陷入十分艰难的处境","level":"S","group":"第7组","category":"处境困难","pdfpage":38},"骑虎难下":{"meaning":"骑在虎背上难以下来。比喻事情遇到困难，迫于形势不能中止，陷入进退两难的境地。（侧重同一件事已经开始了就难以停止）","level":"S","group":"第7组","category":"处境困难","pdfpage":36},"危在旦夕":{"meaning":"旦夕：早晨和晚上，形容时间短。形容危险就在眼前","level":"S","group":"第8组","category":"形势危险","pdfpage":44},"岌岌可危":{"meaning":"岌岌：山高陡峭，就要倒下的样子。形容非常危险，快要倾覆或灭亡","level":"S","group":"第8组","category":"形势危险","pdfpage":41},"如火如荼":{"meaning":"原比喻军容之盛，现在形容旺盛、热烈或激烈","level":"S","group":"第9组","category":"事物出现、发展、衰落","pdfpage":50},"方兴未艾":{"meaning":"意思是事物正在发展，尚未达到止境","level":"S","group":"第9组","category":"事物出现、发展、衰落","pdfpage":48},"日新月异":{"meaning":"形容发展变化很快，新事物、新气象不断出现","level":"S","group":"第9组","category":"事物出现、发展、衰落","pdfpage":52},"日渐式微":{"meaning":"事物逐渐地由兴盛而衰落","level":"S","group":"第9组","category":"事物出现、发展、衰落","pdfpage":53},"望尘莫及":{"meaning":"莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦","level":"S","group":"第10组","category":"竞争比较","pdfpage":64},"相形见绌":{"meaning":"形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足","level":"S","group":"第10组","category":"竞争比较","pdfpage":59},"相提并论":{"meaning":"把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）","level":"S","group":"第10组","category":"竞争比较","pdfpage":65},"应接不暇":{"meaning":"暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）","level":"S","group":"第11组","category":"能力不足","pdfpage":73},"顾此失彼":{"meaning":"顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）","level":"S","group":"第11组","category":"能力不足","pdfpage":72},"蜻蜓点水":{"meaning":"比喻进行某些动作时只轻轻接触表面。也比喻肤浅不深入","level":"S","group":"第12组","category":"印象和效果","pdfpage":77},"融会贯通":{"meaning":"融会：融合。贯通：全面透彻地了解。指把各方面的知识、道理融合贯穿，从而获得对事物全面、透彻地理解和领悟。（侧重融合）","level":"S","group":"第12组","category":"印象和效果","pdfpage":78},"相得益彰":{"meaning":"相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来","level":"S","group":"第13组","category":"搭档配合","pdfpage":80},"相辅相成":{"meaning":"辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可","level":"S","group":"第13组","category":"搭档配合","pdfpage":80},"南辕北辙":{"meaning":"辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标与做法相反）","level":"S","group":"第15组","category":"错误抉择和方向","pdfpage":88},"缘木求鱼":{"meaning":"缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）","level":"S","group":"第15组","category":"错误抉择和方向","pdfpage":89},"舍本逐末":{"meaning":"舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置","level":"S","group":"第15组","category":"错误抉择和方向","pdfpage":86},"削足适履":{"meaning":"履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套","level":"S","group":"第16组","category":"错误做法（寓言故事）","pdfpage":91},"越俎代庖":{"meaning":"越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情","level":"S","group":"第16组","category":"错误做法（寓言故事）","pdfpage":90},"潜移默化":{"meaning":"潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）","level":"S","group":"第17组","category":"教育影响批评","pdfpage":94},"耳濡目染":{"meaning":"濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）","level":"S","group":"第17组","category":"教育影响批评","pdfpage":94},"醍醐灌顶":{"meaning":"醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快","level":"S","group":"第17组","category":"教育影响批评","pdfpage":98},"心无旁骛":{"meaning":"旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志","level":"S","group":"第18组","category":"工作学习状态","pdfpage":103},"殚精竭虑":{"meaning":"殚：竭尽。用尽精力和心思","level":"S","group":"第18组","category":"工作学习状态","pdfpage":101},"筚路蓝缕":{"meaning":"筚路：柴车。蓝缕：又旧又破的衣服。意思是驾着柴车穿着破旧衣服去开辟山林。现用来形容创业的艰难与辛苦。也作“荜路蓝缕”。（词义有拓展，也可形容事情发展的初期阶段）","level":"S","group":"第18组","category":"工作学习状态","pdfpage":107},"提纲挈领":{"meaning":"意思是抓住事物的关键部分或者核心要点，然后用简洁明了的方式进行概述或表达","level":"S","group":"第19组","category":"正确做法","pdfpage":113},"纲举目张":{"meaning":"指提起大网的总绳一撒，所有的网眼就都张开。比喻抓住事物的主要环节，就可带动一切","level":"S","group":"第19组","category":"正确做法","pdfpage":112},"于事无补":{"meaning":"指某种言行对于解决问题没有帮助","level":"S","group":"第20组","category":"错误做法","pdfpage":119},"过犹不及":{"meaning":"过：过分。不及：不够。事情做得过了头，就跟做得不够一样，都不合适","level":"S","group":"第20组","category":"错误做法","pdfpage":118},"亦步亦趋":{"meaning":"步：走。趋：快走。比喻因缺乏主见，任何事都模仿、追随他人。（侧重行动）","level":"S","group":"第21组","category":"某些国家的错误做法","pdfpage":126},"以邻为壑":{"meaning":"壑：深沟。意为把邻国当成排洪水的沟壑。后用来比喻把困难、灾祸推给别人。（多宏观语境，国家、城市、地区等）","level":"S","group":"第21组","category":"某些国家的错误做法","pdfpage":125},"袖手旁观":{"meaning":"袖手：把手揣在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）","level":"S","group":"第21组","category":"某些国家的错误做法","pdfpage":127},"因势利导":{"meaning":"因：顺着。势：趋势。利导：引导。指顺着事物的发展趋势而加以引导。（褒义）","level":"S","group":"第24组","category":"政府优秀做法","pdfpage":145},"正本清源":{"meaning":"正本：从根本上整顿；清源：从源头上清理。从根本上整顿，从源头上清理。比喻从根本上加以整顿清理","level":"S","group":"第24组","category":"政府优秀做法","pdfpage":147},"量体裁衣":{"meaning":"按身材裁剪衣服。也比与按实际情况办事","level":"S","group":"第24组","category":"政府优秀做法","pdfpage":143},"一蹴而就":{"meaning":"蹴：踏；就：成功。踏一步就可以获得成功，比喻事情很容易做。同“一蹴而得”。（多用于否定句中）","level":"S","group":"第26组","category":"政策措施的评价","pdfpage":154},"标本兼治":{"meaning":"标本：事物的枝节和根本。从枝节和根本方面都得到治理","level":"S","group":"第26组","category":"政策措施的评价","pdfpage":155},"迎刃而解":{"meaning":"刃：刀刃。解：分开。把竹子劈开口，下面的一段竹子就迎着刀刃裂开了。比喻主要问题解决了，其他的问题就很容易解决。（常搭配“问题”）","level":"S","group":"第26组","category":"政策措施的评价","pdfpage":154},"一筹莫展":{"meaning":"筹：计策。展：施展。一点计策也施展不出。形容没有一点办法","level":"S","group":"第27组","category":"成功与失败","pdfpage":160},"功亏一篑":{"meaning":"篑：盛土的筐，指一筐土。后用来比喻做事情只差最后一点而前功尽弃","level":"S","group":"第27组","category":"成功与失败","pdfpage":161},"一以贯之":{"meaning":"指做人做事，按照一个道理，从始至终都不会改变。贯：一直，习惯","level":"S","group":"第28组","category":"领导力","pdfpage":168},"深谋远虑":{"meaning":"计谋深远，考虑周密","level":"S","group":"第28组","category":"领导力","pdfpage":164},"高瞻远瞩":{"meaning":"瞻：望。瞩：注视。登高望远。形容目光远大。（更宏观）","level":"S","group":"第28组","category":"领导力","pdfpage":163},"好大喜功":{"meaning":"喜欢做大事、立大功。多形容浮夸、不切实际的行为","level":"S","group":"第30组","category":"干部易犯错误","pdfpage":177},"敷衍塞责":{"meaning":"敷衍：马虎应付。塞责：搪塞责任。做事马虎，应付一下以搪塞责任","level":"S","group":"第30组","category":"干部易犯错误","pdfpage":179},"明哲保身":{"meaning":"明哲：聪明有智慧。指聪明有智慧之人，善于趋安避危，保全自身。也指为保全个人利益而回避原则问题的处世态度","level":"S","group":"第30组","category":"干部易犯错误","pdfpage":178},"文过饰非":{"meaning":"文、饰：掩饰；过、非：错误。用漂亮的言辞掩饰自己的过失和错误","level":"S","group":"第31组","category":"对待错误的态度","pdfpage":189},"欲盖弥彰":{"meaning":"盖：遮掩；弥：更加；彰：明显。想掩盖坏事的真相，结果反而更明显地暴露出来","level":"S","group":"第31组","category":"对待错误的态度","pdfpage":190},"闻过则喜":{"meaning":"过：过失；则：就。听到别人批评自己的缺点或错误，表示欢迎和高兴。指虚心接受意见","level":"S","group":"第31组","category":"对待错误的态度","pdfpage":188},"改弦更张":{"meaning":"更：改换；张：给乐器上弦。改换、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法","level":"S","group":"第32组","category":"改变与不变","pdfpage":196},"根深蒂固":{"meaning":"蒂：草木之根。比喻基础稳固。（中性）（侧重深）","level":"S","group":"第32组","category":"改变与不变","pdfpage":200},"沧海桑田":{"meaning":"沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大","level":"S","group":"第32组","category":"改变与不变","pdfpage":199},"推波助澜":{"meaning":"澜：大的波浪。比喻推动、助长事物的声势及发展。（中性词）","level":"S","group":"第33组","category":"顺势造势","pdfpage":205},"顺势而为":{"meaning":"顺应形势做事情","level":"S","group":"第33组","category":"顺势造势","pdfpage":203},"亡羊补牢":{"meaning":"意指丢失了再去修补羊圈，还不算晚。后用来比喻出了问题以后及时想法补救，以免继续受损失。也指出了问题才想法补救，已经太晚了","level":"S","group":"第35组","category":"提早准备和补救","pdfpage":212},"未雨绸缪":{"meaning":"绸缪：缠绕，引申指修缮。比喻事先做好防备工作","level":"S","group":"第35组","category":"提早准备和补救","pdfpage":209},"防患未然":{"meaning":"患：灾祸。未然：没有这样，指没有发生。在祸患还没有发生之前就进行防备","level":"S","group":"第35组","category":"提早准备和补救","pdfpage":210},"各自为政":{"meaning":"各人按自己的主张办事。（多用来形容工作，单位之间、部门之间）","level":"S","group":"第36组","category":"办公、管理相关","pdfpage":215},"空中楼阁":{"meaning":"悬在空中的楼阁。比喻崇高通达。后多用来比喻虚构的事物或脱离实际的空想","level":"S","group":"第37组","category":"空谈与虚幻","pdfpage":219},"纸上谈兵":{"meaning":"兵：用兵之道。比喻空谈理论，不能解决实际问题。（侧重只有理论而没有行动）","level":"S","group":"第37组","category":"空谈与虚幻","pdfpage":217},"无人问津":{"meaning":"津：渡口。没有人来询问渡口。比喻没人过问、受到冷落。（形容某事物受冷落、无人理睬。程度较重）","level":"S","group":"第38组","category":"来者众多","pdfpage":225},"络绎不绝":{"meaning":"络绎：前后相接、连续不断的样子。形容车船人马等前后相接，往来不断","level":"S","group":"第38组","category":"来者众多","pdfpage":223},"万人空巷":{"meaning":"空巷：街道里弄里的人全部走空。指家家户户的人都从巷里出来了。多形容庆祝、欢迎等盛况","level":"S","group":"第39组","category":"人多人少","pdfpage":230},"参差不齐":{"meaning":"参差：高低、长短、大小不齐的样子。形容不一致、有差别。（多搭配水平、质量、进展等）","level":"S","group":"第40组","category":"好坏掺杂","pdfpage":233},"良莠不齐":{"meaning":"莠：狗尾草，比喻坏人。指好人、坏人混在一起。同“良莠不一”。（现在用法不只形容人，也可形容事物）","level":"S","group":"第40组","category":"好坏掺杂","pdfpage":234},"鱼龙混杂":{"meaning":"比喻坏人和好人混在一起。同“龙蛇混杂”。（现在用法不只形容人，也可形容事物）","level":"S","group":"第40组","category":"好坏掺杂","pdfpage":234},"连绵不绝":{"meaning":"意思是连续而不中断","level":"A","group":"第1组","category":"中华文明传统文化","pdfpage":9},"不绝如缕":{"meaning":"绝：断。缕：细线。像一根细线那样，似断非断。也作“不绝若线”。比喻情势危急","level":"A","group":"第2组","category":"文化传承","pdfpage":13},"口耳相传":{"meaning":"口说耳听，递相传授","level":"A","group":"第2组","category":"文化传承","pdfpage":14},"去芜存菁":{"meaning":"意思是除去杂质、保留精华","level":"A","group":"第3组","category":"改革创新","pdfpage":18},"激浊扬清":{"meaning":"强调通过主动干预清除负面因素并弘扬正面价值，侧重点在于“激”与“扬”的联动作用，既包含对浑浊、消极现象的批判与清除，又包含对清澈、积极价值的彰显与推广","level":"A","group":"第3组","category":"改革创新","pdfpage":19},"除旧布新":{"meaning":"意思是清除旧的，建立新的；以新的代替旧的","level":"A","group":"第3组","category":"改革创新","pdfpage":19},"不拘一格":{"meaning":"不拘一格指不拘泥于一种规格、方式，比喻打破常规","level":"A","group":"第4组","category":"做法、构思创新","pdfpage":22},"别开生面":{"meaning":"比喻另外开创新的局面或新的形式","level":"A","group":"第4组","category":"做法、构思创新","pdfpage":25},"标新立异":{"meaning":"标：表明。异：独特，与众不同。原意为表明新颖的义理，提出与众不同的见解。后指故意提出新奇的见解，表示自己与众不同。（主观上故意性；辨析感情色彩）","level":"A","group":"第4组","category":"做法、构思创新","pdfpage":21},"自成一家":{"meaning":"意思是指在某一方面的学问或技术有独到的见解或独特的做法，能自成体系","level":"A","group":"第4组","category":"做法、构思创新","pdfpage":25},"抱残守缺":{"meaning":"残、缺：不完整。①固守陈旧残缺的东西不放，形容保守，不知改进。②保存虽有残缺但仍有价值的古物","level":"A","group":"第5组","category":"守旧不创新","pdfpage":28},"食古不化":{"meaning":"意思是读书、作画一味学习古人，拘泥陈法，不善于灵活运用。指对所学的古代知识理解得不透，不善于按现在的情况来运用","level":"A","group":"第5组","category":"守旧不创新","pdfpage":29},"寸步难行":{"meaning":"寸步：很短的距离。一步也难以行走。形容行走十分困难。也形容陷入困难境地，无法进行活动。（程度较重）","level":"A","group":"第7组","category":"处境困难","pdfpage":38},"裹足不前":{"meaning":"比喻因心存顾虑而停止行动或不敢向前，与踟蹰不前相比停滞程度更彻底，暗示难以突破","level":"A","group":"第7组","category":"处境困难","pdfpage":37},"进退失据":{"meaning":"同“进退失据”“进退两难”","level":"A","group":"第7组","category":"处境困难","pdfpage":36},"危如累卵":{"meaning":"比喻形势非常危险，如同堆起来的蛋，随时都有塌下打碎的可能","level":"A","group":"第8组","category":"形势危险","pdfpage":41},"风雨飘摇":{"meaning":"飘摇：飘荡。在风雨中飘荡不定。比喻局势动荡不安，很不稳定","level":"A","group":"第8组","category":"形势危险","pdfpage":42},"一日千里":{"meaning":"一天跑一千里。也比喻进步、发展很快","level":"A","group":"第9组","category":"事物出现、发展、衰落","pdfpage":52},"势如破竹":{"meaning":"势：形势。破竹：劈开竹子。形势如同劈竹子一样，劈开头上几节，下面各节就顺着刀口裂开了。后用来形容节节胜利，毫无阻碍","level":"A","group":"第9组","category":"事物出现、发展、衰落","pdfpage":50},"如日中天":{"meaning":"像太阳正运行到正午。比喻正发展到最兴盛的阶段","level":"A","group":"第9组","category":"事物出现、发展、衰落","pdfpage":50},"水涨船高":{"meaning":"水位上涨，船体也随着上升。比喻事物随着它所凭借的基础而增长","level":"A","group":"第9组","category":"事物出现、发展、衰落","pdfpage":54},"江河日下":{"meaning":"长江大河的水，日夜流向下游而不止。比喻事物日趋衰落，情况一天不如一天。（多指国势等事物发展趋势）","level":"A","group":"第9组","category":"事物出现、发展、衰落","pdfpage":54},"突飞猛进":{"meaning":"形容发展十分迅速","level":"A","group":"第9组","category":"事物出现、发展、衰落","pdfpage":51},"雨后春笋":{"meaning":"春天下雨后竹笋长得又多又快，比喻新生事物大量涌现和蓬勃发展。（侧重数量多）","level":"A","group":"第9组","category":"事物出现、发展、衰落","pdfpage":48},"出类拔萃":{"meaning":"出：超出。类：同类。拔：高出。萃：指聚在一起的人或物。指人的品德才能出众，高出同类之上。（侧重能力或品德）（高于同类）","level":"A","group":"第10组","category":"竞争比较","pdfpage":60},"同日而语":{"meaning":"指相提并论。（侧重于强调时间上的对比，多形容与自身的比较。现有时也有例外）（多用于否定句中）","level":"A","group":"第10组","category":"竞争比较","pdfpage":65},"无与伦比":{"meaning":"意思是指事物非常完美，没有能够与它相比的同类的东西","level":"A","group":"第10组","category":"竞争比较","pdfpage":60},"回天乏术":{"meaning":"回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救","level":"A","group":"第11组","category":"能力不足","pdfpage":71},"爱莫能助":{"meaning":"爱：爱惜；莫：不。虽然心中关切同情，却没有力量帮助","level":"A","group":"第11组","category":"能力不足","pdfpage":69},"独木难支":{"meaning":"一根木头支不住高大的房子。比喻一个人的力量单薄，维持不住全局","level":"A","group":"第11组","category":"能力不足","pdfpage":73},"触类旁通":{"meaning":"触：接触。通：通晓。指掌握了某一事物的规律或知识，就能够以此类推，了解同类的其他事物。（侧重于抽象的思维层面。）（侧重类推）","level":"A","group":"第12组","category":"印象和效果","pdfpage":79},"交相辉映":{"meaning":"各种光亮、色彩相互照耀、映射。常用语形容美好的景象","level":"A","group":"第13组","category":"搭档配合","pdfpage":82},"珠联璧合":{"meaning":"珠联：像珍珠一样串在一起。璧合：像碧玉一样合在一起。原指一种日月重合、五星相联的天相。后多比喻美好的人及事物凑在一起。同“珠连璧合”。（侧重结合）","level":"A","group":"第13组","category":"搭档配合","pdfpage":81},"并驾齐驱":{"meaning":"并驾：几匹马并排在一起拉车。齐驱：共同快跑。比喻相互之间不相上下","level":"A","group":"第14组","category":"工作开展顺序","pdfpage":85},"喧宾夺主":{"meaning":"喧：吵吵嚷嚷。客人的声音压倒了主人的声音。比喻外来的或次要的事物占据了原有的或主要的事物的位置","level":"A","group":"第15组","category":"错误抉择和方向","pdfpage":87},"因小失大":{"meaning":"因：为了。指为了小的利益造成大的损失","level":"A","group":"第15组","category":"错误抉择和方向","pdfpage":87},"拔苗助长":{"meaning":"用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长”","level":"A","group":"第16组","category":"错误做法（寓言故事）","pdfpage":90},"邯郸学步":{"meaning":"比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了","level":"A","group":"第16组","category":"错误做法（寓言故事）","pdfpage":92},"循循善诱":{"meaning":"循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法","level":"A","group":"第17组","category":"教育影响批评","pdfpage":96},"春风化雨":{"meaning":"宜于万物生长的和风，适时的雨。后用来比喻良好的教育。多用来称颂师长对学生及晚辈潜移默化的教诲。（也可用来形容文化或教育等对人的影响）","level":"A","group":"第17组","category":"教育影响批评","pdfpage":97},"耳提面命":{"meaning":"“耳提”，提着耳朵叮嘱；“面命”，当面指教，形容教诲殷切。多指（长辈对晚辈、上级对下级）恳切地教导","level":"A","group":"第17组","category":"教育影响批评","pdfpage":96},"呕心沥血":{"meaning":"呕：吐。沥：滴。形容费尽心思","level":"A","group":"第18组","category":"工作学习状态","pdfpage":102},"孜孜不倦":{"meaning":"孜孜：勤奋的样子。形容勤奋、不知疲倦","level":"A","group":"第18组","category":"工作学习状态","pdfpage":108},"孜孜以求":{"meaning":"孜孜：勤勉的样子。意思是不知疲倦地探求","level":"A","group":"第18组","category":"工作学习状态","pdfpage":109},"焚膏继晷":{"meaning":"焚：点燃；膏：灯油或蜡烛；继：接续；晷：日影、日光。意思是点燃灯烛来接替日光照明，形容夜以继日地用功读书或努力工作","level":"A","group":"第18组","category":"工作学习状态","pdfpage":105},"义不容辞":{"meaning":"义：道义。辞：推辞。道义上不容许推辞。指理应接受。（侧重良心、道义上）","level":"A","group":"第19组","category":"正确做法","pdfpage":116},"博采众长":{"meaning":"博采：广泛搜集采纳。从多方面吸取各家的长处","level":"A","group":"第19组","category":"正确做法","pdfpage":113},"条分缕析":{"meaning":"缕：线。一条条分析。形容分析得有条理，很细致","level":"A","group":"第19组","category":"正确做法","pdfpage":111},"见贤思齐":{"meaning":"指见到有才德的人就想着与他齐平","level":"A","group":"第19组","category":"正确做法","pdfpage":114},"临渊羡鱼":{"meaning":"比喻有欲望想得到某种东西，但却没有实际行动","level":"A","group":"第20组","category":"错误做法","pdfpage":120},"有恃无恐":{"meaning":"因有所依仗而毫不害怕","level":"A","group":"第20组","category":"错误做法","pdfpage":120},"坐享其成":{"meaning":"意思为自己不出力而享受别人取得的成果","level":"A","group":"第21组","category":"某些国家的错误做法","pdfpage":128},"坐收渔利":{"meaning":"比喻利用别人的矛盾而从中获利","level":"A","group":"第21组","category":"某些国家的错误做法","pdfpage":128},"隔岸观火":{"meaning":"指站在对岸观望火灾；用来比喻对别人的急难不加救助，而采取看热闹的态度","level":"A","group":"第21组","category":"某些国家的错误做法","pdfpage":127},"安居乐业":{"meaning":"安：安定；乐：喜爱，愉快；业：职业。指安定愉快地生活和劳动","level":"A","group":"第22组","category":"国家安定与动荡","pdfpage":133},"颠沛流离":{"meaning":"颠沛：跌倒，比喻困顿，受挫折。流离：流转离散。形容生活困苦，流落异乡，无安身之所。（可指人，也可指物）","level":"A","group":"第22组","category":"国家安定与动荡","pdfpage":132},"一衣带水":{"meaning":"原形容像一条衣带那样狭窄的河流。现比喻仅隔一水，极其邻近","level":"A","group":"第23组","category":"国际国内关系","pdfpage":139},"休戚与共":{"meaning":"休：欢乐，吉庆。戚：忧愁，悲哀。指忧喜祸福彼此共同承担。形容关系密切同甘共苦","level":"A","group":"第23组","category":"国际国内关系","pdfpage":136},"同舟共济":{"meaning":"济：渡过。同乘一条船过河。比喻齐心协力渡过困难","level":"A","group":"第23组","category":"国际国内关系","pdfpage":137},"细水长流":{"meaning":"比喻节约使用财物，使经常不缺用。也比喻一点一滴不间断地做某件事，精细安排，长远打算","level":"A","group":"第25组","category":"合理规划","pdfpage":151},"功败垂成":{"meaning":"垂：接近，将要。事情在将要成功的时候失败了。含惋惜意。同“事败垂成”","level":"A","group":"第27组","category":"成功与失败","pdfpage":161},"失之交臂":{"meaning":"交臂：胳膊碰胳膊，指擦肩而过。形容当面错过","level":"A","group":"第27组","category":"成功与失败","pdfpage":161},"适得其反":{"meaning":"适：恰好。结果与愿望恰好相反。（侧重取得反面结果）","level":"A","group":"第27组","category":"成功与失败","pdfpage":161},"以身作则":{"meaning":"身：自身。则：榜样。自己以行动给大家做出榜样","level":"A","group":"第28组","category":"领导力","pdfpage":166},"身体力行":{"meaning":"身：亲身。体：体验。指亲身体验，努力实践","level":"A","group":"第28组","category":"领导力","pdfpage":165},"运筹帷幄":{"meaning":"筹：谋划。帷幄：古代军队中的帐幕。指在帐幕中谋划计策。后指在后方指挥、筹划","level":"A","group":"第28组","category":"领导力","pdfpage":165},"前仆后继":{"meaning":"意思是指前面的人倒下了，后面的人继续跟上去。英勇斗争，不怕牺牲","level":"A","group":"第29组","category":"正义精神和做法","pdfpage":171},"砥砺前行":{"meaning":"经历磨炼，克服困难，往前进步的意思。也作“砥砺奋进”","level":"A","group":"第29组","category":"正义精神和做法","pdfpage":173},"哗众取宠":{"meaning":"用浮夸的言词或做作的行动去迎合群众，以博取好感和支持","level":"A","group":"第30组","category":"干部易犯错误","pdfpage":184},"沽名钓誉":{"meaning":"比喻故意矫情做作，用手段猎取名声或赞誉","level":"A","group":"第30组","category":"干部易犯错误","pdfpage":177},"阿谀奉承":{"meaning":"阿谀：为讨好而说好听的话。奉承：恭维别人。为讨好而说好听的话恭维别人。也作“阿谀逢迎”","level":"A","group":"第30组","category":"干部易犯错误","pdfpage":180},"从谏如流":{"meaning":"谏：直言规劝。听从规劝像流水一样自然。形容乐于接受别人的批评意见","level":"A","group":"第31组","category":"对待错误的态度","pdfpage":187},"固执己见":{"meaning":"顽固地坚持自己的意见，不肯改变","level":"A","group":"第31组","category":"对待错误的态度","pdfpage":191},"时过境迁":{"meaning":"境：环境。迁：变迁。时间过去了，环境或情况也随之改变了","level":"A","group":"第32组","category":"改变与不变","pdfpage":199},"积习难改":{"meaning":"积习：指多年养成的习惯。长期形成的某种习惯，很难改变","level":"A","group":"第32组","category":"改变与不变","pdfpage":201},"势在必行":{"meaning":"势：形势。客观形势决定必须这样做","level":"A","group":"第33组","category":"顺势造势","pdfpage":204},"顺水推舟":{"meaning":"舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事","level":"A","group":"第33组","category":"顺势造势","pdfpage":205},"理所当然":{"meaning":"指从道理上讲，应该如此","level":"A","group":"第34组","category":"自然会发生","pdfpage":206},"顺其自然":{"meaning":"意思是顺着事物本来的性质自然发展","level":"A","group":"第34组","category":"自然会发生","pdfpage":207},"居安思危":{"meaning":"处在安定的环境时而能想到可能会出现的危难","level":"A","group":"第35组","category":"提早准备和补救","pdfpage":211},"高枕无忧":{"meaning":"垫高枕头睡觉，无所忧虑","level":"A","group":"第35组","category":"提早准备和补救","pdfpage":211},"独当一面":{"meaning":"意思是指单独负责一个方面的工作或任务","level":"A","group":"第36组","category":"办公、管理相关","pdfpage":215},"画饼充饥":{"meaning":"画个饼子来解饿。本比喻徒有虚名而于实际无好处。后多用来比喻以空想来安慰自己","level":"A","group":"第37组","category":"空谈与虚幻","pdfpage":218},"镜花水月":{"meaning":"镜子里的花，水里的月亮。比喻虚幻的东西","level":"A","group":"第37组","category":"空谈与虚幻","pdfpage":220},"蜂拥而至":{"meaning":"像一窝蜂似地一拥而来。形容很多人乱哄哄地朝一个地方聚拢","level":"A","group":"第38组","category":"来者众多","pdfpage":224},"门可罗雀":{"meaning":"罗：张网捕捉。大门之前可以张起网来捕麻雀。形容十分冷落，宾客稀少","level":"A","group":"第38组","category":"来者众多","pdfpage":225},"人山人海":{"meaning":"形容聚集的人非常多","level":"A","group":"第39组","category":"人多人少","pdfpage":229},"川流不息":{"meaning":"形容行人、车马很多，像水流一样连续不断","level":"A","group":"第39组","category":"人多人少","pdfpage":230},"泥沙俱下":{"meaning":"俱：都。泥土和沙子一同随水冲了下来。比喻人或事物好坏混杂在一起。（侧重量大且好坏都有）","level":"A","group":"第40组","category":"好坏掺杂","pdfpage":233},"鱼目混珠":{"meaning":"用鱼眼睛假冒珍珠。比喻以假乱真。（也可指以次充好）","level":"A","group":"第40组","category":"好坏掺杂","pdfpage":234},"后继无人":{"meaning":"继：继续，继承。没有继承的人。形容事业缺少接班人","level":"B","group":"第2组","category":"文化传承","pdfpage":15},"血脉相 ge":69},"双峰并峙":{"meaning":"意思通常指的是两座高大的山峰彼此对立地耸立着。这个成语不仅用来形容自然界的景观，也常用于比喻在某一领域或文化上同时达到极高成就的两个人物或事物","level":"B","group":"第13组","category":"搭档配合","pdfpage":82},"相映成趣":{"meaning":"映：映衬。趣：意趣。相互衬托着，显得很有情趣，很有意思","level":"B","group":"第13组","category":"搭档配合","pdfpage":82},"锦上添花":{"meaning":"指在有彩色花纹的丝织品上再绣上花朵。比喻美上加美，喜上加喜","level":"B","group":"第13组","category":"搭档配合","pdfpage":81},"分道扬镳":{"meaning":"道：道路。镳：马嚼子。分开道路，驱马前进。指分道而行。也比喻思想、志趣不同而各人干各人的事。也作“扬镳分路”","level":"B","group":"第15组","category":"错误抉择和方向","pdfpage":88},"与虎谋皮":{"meaning":"跟老虎商量取下它的皮来，比喻跟坏人商量要其牺牲自己的利益，是绝对办不到的","level":"B","group":"第16组","category":"错误做法（寓言故事）","pdfpage":92},"东施效颦":{"meaning":"比喻盲目地胡乱模仿，效果适得其反","level":"B","group":"第16组","category":"错误做法（寓言故事）","pdfpage":92},"和风细雨":{"meaning":"意思是比喻耐心地和颜悦色地批评或劝说","level":"B","group":"第17组","category":"教育影响批评","pdfpage":97},"如沐春风":{"meaning":"通常用来形容人感到非常舒适和愉悦。它的意思是像沐浴在春风里一样，感受到舒适的感觉","level":"B","group":"第17组","category":"教育影响批评","pdfpage":95},"成风化人":{"meaning":"成风，倡树一种社会风气。化人，感染人、影响人、教育人。通过倡导树立一种社会风气来影响、教育感化社会大众","level":"B","group":"第17组","category":"教育影响批评","pdfpage":95},"润物无声":{"meaning":"指有大胸怀者，做了贡献而不张扬，默默奉献。（也指文化教育等对人的潜移默化的影响）","level":"B","group":"第17组","category":"教育影响批评","pdfpage":95},"苦口婆心":{"meaning":"用来形容一个人善意且耐心地反复劝导他人","level":"B","group":"第17组","category":"教育影响批评","pdfpage":96},"诲人不倦":{"meaning":"诲：教诲，教导。教导人时很有耐心而不知疲倦","level":"B","group":"第17组","category":"教育影响批评","pdfpage":97},"乐此不疲":{"meaning":"因酷爱干某事而不感觉厌烦。形容对某事特别爱好而沉浸其中","level":"B","group":"第18组","category":"工作学习状态","pdfpage":103},"夙兴夜寐":{"meaning":"夙：早。兴：起来。寐：睡觉。早起晚睡，形容勤奋辛劳","level":"B","group":"第18组","category":"工作学习状态","pdfpage":106},"夜以继日":{"meaning":"日夜不停地做某事。多形容十分勤奋、勤恳、忙碌","level":"B","group":"第18组","category":"工作学习状态","pdfpage":105},"废寝忘食":{"meaning":"顾不上睡觉，忘记了吃饭。形容对某事专心致志","level":"B","group":"第18组","category":"工作学习状态","pdfpage":102},"披星戴月":{"meaning":"身披星光，头顶月色。形容早出晚归或连夜赶路。也作“戴月披星”","level":"B","group":"第18组","category":"工作学习状态","pdfpage":107},"挖空心思":{"meaning":"想方设法，费尽心机。（多含贬义）","level":"B","group":"第18组","category":"工作学习状态","pdfpage":103},"摩顶放踵":{"meaning":"意思是从头顶到脚跟都擦伤了；形容不辞劳苦，不顾身体","level":"B","group":"第18组","category":"工作学习状态","pdfpage":108},"栉风沐雨":{"meaning":"栉：梳头。沐：洗头。形容人辛苦地四处奔波","level":"B","group":"第18组","category":"工作学习状态","pdfpage":106},"皓首穷经":{"meaning":"皓：白。穷经：彻底钻研经书。钻研经籍直到人老头白。也作“白首穷经”。（也可形容长期钻研）","level":"B","group":"第18组","category":"工作学习状态","pdfpage":103},"目不窥园":{"meaning":"窥：看。形容学习专心致志，十分刻苦","level":"B","group":"第18组","category":"工作学习状态","pdfpage":106},"胼手胝足":{"meaning":"意思是手脚生茧。形容劳动十分辛勤","level":"B","group":"第18组","category":"工作学习状态","pdfpage":108},"苦心孤诣":{"meaning":"苦心：用尽心思。诣：（学业、技能等）所达到的程度。孤诣：别人达不到的程度。指尽心竭力钻研，达到了别人所达不到的地步。也指为了达到目的而费尽心思","level":"B","group":"第18组","category":"工作学习状态","pdfpage":102},"风餐露宿":{"meaning":"在风中吃饭，在露天住宿。形容旅途中的辛苦劳累","level":"B","group":"第18组","category":"工作学习状态","pdfpage":107},"以一持万":{"meaning":"用来形容抓住了关键的环节或因素，从而能够控制和影响整个局面。它强调的是在处理问题时识别并把握住核心部分的重要性，以此来驾驭复杂的情况或者广泛的领域","level":"B","group":"第19组","category":"正确做法","pdfpage":113},"当仁不让":{"meaning":"当：面对。仁：符合道义的事。后指遇到应该做的事，勇于承当，不推诿。（侧重情理上）","level":"B","group":"第19组","category":"正确做法","pdfpage":116},"量力而行":{"meaning":"意思是指根据自身的实际能力和条件来决定行动的范围，做事不要超过自己的能力范围，以免出现意外问题","level":"B","group":"第19组","category":"正确做法","pdfpage":114},"堂而皇之":{"meaning":"形容公然而毫不掩饰（多含贬义），强调表面上的正当性或气势宏大，可能隐含虚伪或掩饰","level":"B","group":"第20组","category":"错误做法","pdfpage":121},"明目张胆":{"meaning":"强调公开、毫无顾忌地做坏事，带有明显的贬义","level":"B","group":"第20组","category":"错误做法","pdfpage":121},"作壁上观":{"meaning":"原指双方交战，自己站在壁垒上旁观。后多比喻站在一旁看着，不动手帮助","level":"B","group":"第21组","category":"某些国家的错误做法","pdfpage":128},"唯利是图":{"meaning":"唯：只有；图：图谋，追求。只要有利可图，什么事都干","level":"B","group":"第21组","category":"某些国家的错误做法","pdfpage":126},"穿凿附会":{"meaning":"意思是把讲不通的或不相干的道理、事情硬扯在一起进行解释","level":"B","group":"第21组","category":"某些国家的错误做法","pdfpage":126},"置身事外":{"meaning":"置：安放。把自己放在事情之外。形容毫不关心","level":"B","group":"第21组","category":"某些国家的错误做法","pdfpage":127},"国泰民安":{"meaning":"泰：太平。国家太平，人民生活安定。形容社会安定，人民生活幸福","level":"B","group":"第22组","category":"国家安定与动荡","pdfpage":134},"安土重迁":{"meaning":"土：乡土；重：看得重，不轻易。安于本乡本土，不愿轻易迁移","level":"B","group":"第22组","category":"国家安定与动荡","pdfpage":134},"流离失所":{"meaning":"失所：失去安身之处。形容到处流浪，没有安身的地方。（多指因灾荒、战乱等导致的失去居所）","level":"B","group":"第22组","category":"国家安定与动荡","pdfpage":132},"海晏河清":{"meaning":"晏：平静。黄河水清了，大海没有浪了。比喻天下太平","level":"B","group":"第22组","category":"国家安定与动荡","pdfpage":133},"背井离乡":{"meaning":"背：离开。井：古制八家为井，这里指家宅。指被迫离开家乡，到外地求生。（也指主动离开家乡，到外地生活/工作）","level":"B","group":"第22组","category":"国家安定与动荡","pdfpage":133},"同心同德":{"meaning":"思想统一，信念一致。形容大家团结一条心","level":"B","group":"第23组","category":"国际国内关系","pdfpage":137},"同流合污":{"meaning":"原指言行与不良的习俗、世道相合。后指跟坏人一起干坏事","level":"B","group":"第23组","category":"国际国内关系","pdfpage":142},"和衷共济":{"meaning":"衷：内心。和衷：指同心。大家同心渡过江河。比喻同心协力，渡过难关。现也可比喻齐心协力","level":"B","group":"第23组","category":"国际国内关系","pdfpage":138},"唇齿相依":{"meaning":"嘴唇与牙齿互相依存。比喻关系极为密切","level":"B","group":"第23组","category":"国际国内关系","pdfpage":139},"守望相助":{"meaning":"守：防守。望：瞭望。指彼此关照，互相帮助","level":"B","group":"第23组","category":"国际国内关系","pdfpage":139},"水乳交融":{"meaning":"水和乳汁融合在一起。比喻意气相投、感情融洽。（侧重融合）","level":"B","group":"第23组","category":"国际国内关系","pdfpage":138},"沆瀣一气":{"meaning":"泛指臭味相投的人结合在一起","level":"B","group":"第23组","category":"国际国内关系","pdfpage":141},"相濡以沫":{"meaning":"濡：沾湿，浸润。沫：唾沫。意为泉水干涸，鱼用唾沫相互湿润。后比喻在困境中用微薄的力量相互帮助","level":"B","group":"第23组","category":"国际国内关系","pdfpage":138},"纵横捭阖":{"meaning":"纵横：用游说来联合。捭阖：开合。指在政治、外交上运用手段进行联合或分化","level":"B","group":"第23组","category":"国际国内关系","pdfpage":141},"风云变幻":{"meaning":"风、云：风和云，比喻变幻动荡的局势。变幻：变化不定。像风和云那样变化莫测。比喻局势多变或情况复杂","level":"B","group":"第23组","category":"国际国内关系","pdfpage":140},"保驾护航":{"meaning":"保护某事物能让其能正常发展","level":"B","group":"第24组","category":"政府优秀做法","pdfpage":145},"穿针引线":{"meaning":"使线的一头通过针眼。比喻从中联系、拉拢","level":"B","group":"第24组","category":"政府优秀做法","pdfpage":145},"唾手可得":{"meaning":"唾手：往手上吐唾沫。比喻极容易得到","level":"B","group":"第27组","category":"成功与失败","pdfpage":157},"手到擒来":{"meaning":"擒：捉拿。一出手就把人捉住。形容做事毫不费力或很有把握","level":"B","group":"第27组","category":"成功与失败","pdfpage":158},"触手可及":{"meaning":"伸手便可接触到。形容距离很近","level":"B","group":"第27组","category":"成功与失败","pdfpage":157},"上行下效":{"meaning":"行：做。效：效法。指上面的人怎么做，下面的人就跟着怎么干","level":"B","group":"第28组","category":"领导力","pdfpage":166},"事必躬亲":{"meaning":"躬亲：亲自做。凡事都一定要自己亲自去做","level":"B","group":"第28组","category":"领导力","pdfpage":167},"亲力亲为":{"meaning":"亲自参与，不由别人来代替","level":"B","group":"第28组","category":"领导力","pdfpage":166},"克己奉公":{"meaning":"克己：约束自己；奉公：以公事为重。克制自己的私心，一心为公","level":"B","group":"第28组","category":"领导力","pdfpage":166},"勇毅前行":{"meaning":"意思是勇敢并且坚毅地向前进步或发展","level":"B","group":"第29组","category":"正义精神和做法","pdfpage":173},"大义凛然":{"meaning":"大义：正义。凛然：令人敬畏的样子。形容为了坚持真理而表现出的严峻不可侵犯的样子","level":"B","group":"第29组","category":"正义精神和做法","pdfpage":172},"奋楫争先":{"meaning":"意思是奋力划动船桨的人争先恐后走在前头","level":"B","group":"第29组","category":"正义精神和做法","pdfpage":173},"笃行不怠":{"meaning":"意思是切实履行自己所学的内容，不感到倦怠","level":"B","group":"第29组","category":"正义精神和做法","pdfpage":172},"视死如归":{"meaning":"把死看得像回家一样平常。形容不怕牺牲生命","level":"B","group":"第29组","category":"正义精神和做法","pdfpage":171},"赓续前行":{"meaning":"意思是指不断地延续和发展，保持进步的态度和生活方式","level":"B","group":"第29组","category":"正义精神和做法","pdfpage":173},"兴师动众":{"meaning":"意思是指大规模出兵。现多指动用很多人力做某件事","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":182},"具体而微":{"meaning":"具体：各部分已大体具备；微：微小。指事物的各个组成部分大体都有了，不过形状和规模比较小些","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":183},"如蚁附膻":{"meaning":"附：趋附；膻：羊肉的气味。像蚂蚁趋附羊肉一般。比喻许多臭味相投的人追求不好的事物。也比喻许多人依附有钱有势的人","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":181},"委曲求全":{"meaning":"曲意迁就，以求事成，或保全大局","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":179},"投其所好":{"meaning":"意思是迎合别人的喜好","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":180},"曲意逢迎":{"meaning":"曲意：违背本意。违背自己的本心，千方百计迎合或讨好别人","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":179},"独善其身":{"meaning":"意思是不得志时也要注意自身的修养。后指只顾保持自身修养而不顾他人或全局。（语境要素：个人与外部的对比、保全保护）","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":178},"趋炎附势":{"meaning":"趋：奔走；炎：热，比喻权势。奉承和依附有权有势的人","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":180},"附庸风雅":{"meaning":"附庸：依傍，追随；风雅：泛指诗歌。指缺乏文化修养的人为了装点门面而结交文人，参加有关文化活动，以示自己有一定的文化素养（装文化人）","level":"B","group":"第30组","category":"干部易犯错误","pdfpage":177},"怙恶不悛":{"meaning":"怙：依靠，依仗；悛：改过，悔改。坚持作恶，不肯悔改","level":"B","group":"第31组","category":"对待错误的态度","pdfpage":189},"改头换面":{"meaning":"①原为佛教语。指众生在轮回中形变神不变。②指改变面目。③指改正错误。④比喻只改变形式，而内容、实质不变","level":"B","group":"第31组","category":"对待错误的态度","pdfpage":192},"洗心革面":{"meaning":"洗心：指清除坏思想。革面：改变旧面貌。比喻彻底悔改","level":"B","group":"第31组","category":"对待错误的态度","pdfpage":191},"亘古不变":{"meaning":"从古至今永远也不会改变。多褒义","level":"B","group":"第32组","category":"改变与不变","pdfpage":196},"今非昔比":{"meaning":"现在不能和过去相比。形容变化大。（多形容现在比过去好）","level":"B","group":"第32组","category":"改变与不变","pdfpage":198},"天翻地覆":{"meaning":"覆：翻过来。形容变化巨大。也形容闹得很凶","level":"B","group":"第32组","category":"改变与不变","pdfpage":199},"恍如隔世":{"meaning":"恍：仿佛；世：三十年为一世。仿佛隔了一个时代。指一种因人事或景物变化很大而引起的感触","level":"B","group":"第32组","category":"改变与不变","pdfpage":200},"改弦易辙":{"meaning":"改弦：更换琴弦。易：改变。辙：车轮压过的痕迹，指道路。比喻改变方向或做法。同“更弦易辙”“改辕易辙”","level":"B","group":"第32组","category":"改变与不变","pdfpage":196},"斗转星移":{"meaning":"斗：北斗星。表示一夜之间时间的推移。后也指岁月流逝","level":"B","group":"第32组","category":"改变与不变","pdfpage":199},"白云苍狗":{"meaning":"苍：青色，泛指青黑色。比喻世事变化无常。也作“白衣苍狗”","level":"B","group":"第32组","category":"改变与不变","pdfpage":200},"长盛不衰":{"meaning":"长久兴盛而不衰败，比喻长时间保持旺盛的势头","level":"B","group":"第32组","category":"改变与不变","pdfpage":198},"因陋就简":{"meaning":"指在条件有限的情况下，利用现有简陋条件将就办事，强调适应环境而非追求完善。该成语褒贬取决于“简”的合理性—灵活务实则褒，降低标准则贬","level":"B","group":"第33组","category":"顺势造势","pdfpage":204},"天经地义":{"meaning":"指天地间理所当然而不能改变的道理；也指理所当然，不容置疑的问题","level":"B","group":"第34组","category":"自然会发生","pdfpage":207},"临渴掘井":{"meaning":"临；接近。感到口渴才挖井。比喻平时没有准备，事到临头才想办法","level":"B","group":"第35组","category":"提早准备和补救","pdfpage":212},"常备不懈":{"meaning":"意思是时刻准备着，毫不松懈","level":"B","group":"第35组","category":"提早准备和补救","pdfpage":210},"江心补漏":{"meaning":"指船到江心才补漏洞。比喻临到紧急关头才设法补救，为时已晚。偏正式结构；在句中一般作谓语、定语","level":"B","group":"第35组","category":"提早准备和补救","pdfpage":212},"各行其是":{"meaning":"指各人按照自己认为正确的去做","level":"B","group":"第36组","category":"办公、管理相关","pdfpage":214},"如鱼得水":{"meaning":"好像鱼得到水一样。比喻得到跟自己非常投合的人或对自己很适合的环境","level":"B","group":"第36组","category":"办公、管理相关","pdfpage":215},"无根之木":{"meaning":"意思是比喻没有根据或基础的事物","level":"B","group":"第37组","category":"空谈与虚幻","pdfpage":217},"水中捞月":{"meaning":"指在水中捞月亮；比喻去做根本做不到的事情，只能徒劳无功。含贬义","level":"B","group":"第37组","category":"空谈与虚幻","pdfpage":218},"不期而遇":{"meaning":"没约定而意外相遇","level":"B","group":"第38组","category":"来者众多","pdfpage":226},"人迹罕至":{"meaning":"罕：少。指偏僻荒凉、少有人到的地方。（侧重偏僻荒凉）","level":"B","group":"第38组","category":"来者众多","pdfpage":226},"如影随形":{"meaning":"好像影子总是跟着身体一样。比喻两个人关系亲密，常在一起","level":"B","group":"第38组","category":"来者众多","pdfpage":227},"萍水相逢":{"meaning":"比喻从不认识的人偶然相遇","level":"B","group":"第38组","category":"来者众多","pdfpage":226},"门庭冷落":{"meaning":"形容十分冷落，宾客稀少","level":"B","group":"第38组","category":"来者众多","pdfpage":225},"门庭若市":{"meaning":"门庭：门口和庭院。若：如，好像。门口和庭院就像集市一样，热闹非凡。形容往来的人很多","level":"B","group":"第38组","category":"来者众多","pdfpage":224},"孑然一身":{"meaning":"孑然：孤单的样子。指孤身一人。（常用褒义，形容追寻事业或理想）","level":"B","group":"第39组","category":"人多人少","pdfpage":231},"形单影只":{"meaning":"只：指单独。形容孤独，没有伴侣","level":"B","group":"第39组","category":"人多人少","pdfpage":231},"形影相吊":{"meaning":"吊：慰问。只有自己的身体和影子相互慰问。形容无依无靠，非常孤单","level":"B","group":"第39组","category":"人多人少","pdfpage":231},"熙熙攘攘":{"meaning":"熙熙：和乐的样子。攘攘：乱纷纷的样子。形容人来人往，纷杂拥挤","level":"B","group":"第39组","category":"人多人少","pdfpage":229},"茕茕孑立":{"meaning":"茕茕：孤单，无依靠。孑立：孤立。形容一个人孤苦伶仃，无依无靠","level":"B","group":"第39组","category":"人多人少","pdfpage":231},"车水马龙":{"meaning":"车像流水，马如游龙。形容车马来来往往的热闹景象。同“马龙车水”","level":"B","group":"第39组","category":"人多人少","pdfpage":230},"买椟还珠":{"meaning":"椟：木匣子。还：退还。比喻没有眼光，不识货，取舍失当","level":"B","group":"第40组","category":"好坏掺杂","pdfpage":235},"推陈出新":{"meaning":"推去旧的，产生新的。后多指在文化艺术方面去掉旧的糟粕，吸取其精华，创造出新的来。（多形容文化但不绝对）","level":"已考","group":"第3组","category":"改革创新","pdfpage":17},"集思广益":{"meaning":"集：积重。思：想法，智慧。广：扩大。益：益处，效果。指集中众人的智慧，可以收到更好的效果","level":"已考","group":"第24组","category":"政府优秀做法","pdfpage":147},"好高骛远":{"meaning":"骛：通“务”，追求。指不切实际地追求过高、过远的目标","level":"已考","group":"第30组","category":"干部易犯错误","pdfpage":176},"难以为继":{"meaning":"难以继续下去","level":"已考","group":"第2组","category":"文化传承","pdfpage":14},"另辟蹊径":{"meaning":"意思是另外开辟一条路。比喻另创一种风格或方法","level":"已考","group":"第4组","category":"做法、构思创新","pdfpage":21},"循序渐进":{"meaning":"循：顺，按照。序：次序。指事物的发展或学习工作等按照一定的步骤逐渐深入或提高","level":"已考","group":"第6组","category":"按规矩办事","pdfpage":32},"按部就班":{"meaning":"部：类别。班：次序。原指写文章按类别安排文义，按顺序组织文辞。后指按照一定的次序或部置进行。（中性词）","level":"已考","group":"第6组","category":"按规矩办事","pdfpage":31},"左支右绌":{"meaning":"支：支持；绌：屈曲，引申为不足。原指弯弓射箭的姿势，左手支持，右手屈曲。指力量不足，应付了这方面，那方面又出了问题。（侧重能力有限，应付不过来）","level":"已考","group":"第11组","category":"能力不足","pdfpage":72},"捉襟见肘":{"meaning":"捉襟：整理衣襟。肘：胳膊肘儿。形容衣裳破旧。也比喻困难很多，应付不过来。（侧重人力、物力等资源有限）","level":"已考","group":"第11组","category":"能力不足","pdfpage":72},"不求甚解":{"meaning":"甚：很，极。原指读书只领会要旨，不必在一字一句上下功夫。后指只求懂个大概，不去深入理会","level":"已考","group":"第12组","category":"印象和效果","pdfpage":78},"走马观花":{"meaning":"走马：骑马快跑。比喻观察事物或者了解情况不深入细致。（侧重于用眼看具体事物的过程）（一般不形容读书）","level":"已考","group":"第12组","category":"印象和效果","pdfpage":76},"双管齐下":{"meaning":"管：笔管。比喻一件事同时采用两种办法或两件事同时进行","level":"已考","group":"第14组","category":"工作开展顺序","pdfpage":85},"齐头并进":{"meaning":"指几方面同时前进","level":"已考","group":"第14组","category":"工作开展顺序","pdfpage":84},"闭门造车":{"meaning":"关起门来造车子。比喻不管客观情况如何，只凭主观愿望办事。（多形容不开放、自我封闭）","level":"已考","group":"第16组","category":"错误做法（寓言故事）","pdfpage":91},"抽丝剥茧":{"meaning":"意思是丝得一根一根地抽，茧得一层一层地剥；形容分析事物极为细致，而且一步一步很有层次","level":"已考","group":"第19组","category":"正确做法","pdfpage":112},"急功近利":{"meaning":"功：成功；近：眼前的。急于求成，贪图眼前的成效和利益","level":"已考","group":"第21组","category":"某些国家的错误做法","pdfpage":130},"画地为牢":{"meaning":"牢：牢狱。在地上画个圈儿，作为牢狱。比喻局限在小圈子里活动","level":"已考","group":"第21组","category":"某些国家的错误做法","pdfpage":125},"因地制宜":{"meaning":"根据不同地方的基本情况，制定相应的办法","level":"已考","group":"第24组","category":"政府优秀做法","pdfpage":143},"对症下药":{"meaning":"医生针对病症开方用药。比喻针对问题所在确定解决方法","level":"已考","group":"第24组","category":"政府优秀做法","pdfpage":144},"高屋建瓴":{"meaning":"建：倾倒。瓴：水瓶。从高屋脊上往下倒瓶中的水。形容居高临下，不可阻挡的形势","level":"已考","group":"第28组","category":"领导力","pdfpage":163},"从善如流":{"meaning":"从：听从；善：好的，正确的；如流：好像流水向下，形容迅速。形容能迅速地接受别人的好意见","level":"已考","group":"第31组","category":"对待错误的态度","pdfpage":187},"刚愎自用":{"meaning":"愎：任性；刚愎：强硬固执；自用：自以为是。十分固执自信，不考虑别人的意见","level":"已考","group":"第31组","category":"对待错误的态度","pdfpage":190},"不期而至":{"meaning":"指事先没有约定而意外到来，没有预料地到来","level":"已考","group":"第38组","category":"来者众多","pdfpage":226},"兼收并蓄":{"meaning":"并：一起。蓄：积聚，储存。对不同的人或事物都能同时收容、保留","level":"已考","group":"第1组","category":"中华文明传统文化","pdfpage":10},"源远流长":{"meaning":"源头远，水流长。也比喻历史悠久","level":"已考","group":"第1组","category":"中华文明传统文化","pdfpage":9},"一脉相承":{"meaning":"一脉：指一个血统或一个派系。相承：相续传承。由一个血统或一个派别世代相传承袭下来。比喻人或事物间的传承关系。也作“一脉相传”“一脉相通”","level":"已考","group":"第2组","category":"文化传承","pdfpage":12},"薪火相传":{"meaning":"意思是比喻学问和技艺代代相传。比喻师生授受不绝，或种族、血统、文化精神的传承，绵延不尽","level":"已考","group":"第2组","category":"文化传承","pdfpage":13},"与时俱进":{"meaning":"时：时间。俱：一起，一同。进：前进。与时间一起前进。指不断进取，永不停滞","level":"已考","group":"第4组","category":"做法、构思创新","pdfpage":22},"独树一帜":{"meaning":"单独树起一面旗帜。比喻创造独特风格，自成一家。同“别树一帜”。（侧重风格）","level":"已考","group":"第4组","category":"做法、构思创新","pdfpage":25},"墨守成规":{"meaning":"形容因循守旧，不肯改变","level":"已考","group":"第5组","category":"守旧不创新","pdfpage":28},"循规蹈矩":{"meaning":"循：依照。规：圆规。蹈：踩。矩：曲尺。规、矩是定方圆的标准规则，借指行为的准则。原指遵守规矩，不敢违反。后指拘守旧准则，不敢稍作变动。（中性词）","level":"已考","group":"第6组","category":"按规矩办事","pdfpage":31},"照本宣科":{"meaning":"原指照着书本或讲稿逐字宣读。引申为机械执行既定规则或文本内容，完全依赖书面指示而缺乏实际调整，批评其缺乏创造性","level":"已考","group":"第6组","category":"按规矩办事","pdfpage":32},"望而却步":{"meaning":"却步：不敢前进，往后退。形容遇到危险、困难或力所不及的事就往后退缩。（侧重行为上的退却，多因为害怕、惊讶、震撼、犹豫、顾虑等）","level":"已考","group":"第7组","category":"处境困难","pdfpage":34},"瞻前顾后":{"meaning":"多用于形容顾虑太多，犹豫不决","level":"已考","group":"第7组","category":"处境困难","pdfpage":37},"进退维谷":{"meaning":"谷：困窘。指前进或后退都处于困难境地。形容进退两难。同“进退两难”“进退失据”。（侧重很难抉择）","level":"已考","group":"第7组","category":"处境困难","pdfpage":36},"层出不穷":{"meaning":"层出：接连出现。穷：尽。接连出现，没有穷尽。（主语是事物）","level":"已考","group":"第9组","category":"事物出现、发展、衰落","pdfpage":47},"应运而生":{"meaning":"应运：应天命。指顺应天命而降生。后泛指顺应时机而产生","level":"已考","group":"第9组","category":"事物出现、发展、衰落","pdfpage":49},"异军突起":{"meaning":"异军：另一支军队。比喻一支新生力量突然崛起。（侧重新生事物）","level":"已考","group":"第9组","category":"事物出现、发展、衰落","pdfpage":49},"横空出世":{"meaning":"形容人或物高大，横在空中，浮出人世，或比喻卓尔不群。（侧重突出、明显）","level":"已考","group":"第9组","category":"事物出现、发展、衰落","pdfpage":48},"此消彼长":{"meaning":"指这个下降，那个上升","level":"已考","group":"第9组","category":"事物出现、发展、衰落","pdfpage":55},"等量齐观":{"meaning":"等：同等。齐：一样。把不同的事物一律同等看待","level":"已考","group":"第10组","category":"竞争比较","pdfpage":65},"脱颖而出":{"meaning":"颖：细长物体的尖端。比喻才能完全显露出来。（侧重能力）（明显地）","level":"已考","group":"第10组","category":"竞争比较","pdfpage":62},"望洋兴叹":{"meaning":"望洋：仰视的样子。仰望海神而兴叹。原指在伟大事物面前感叹自己的渺小。现多比喻做事时因力不胜任或没有条件而感到无可奈何","level":"已考","group":"第11组","category":"能力不足","pdfpage":70},"鞭长莫及":{"meaning":"及：到。原意是鞭子虽长，也不能打马肚子。比喻相隔太远，力量达不到。（有时会用于形容“虽有能力，但能力有限”）","level":"已考","group":"第11组","category":"能力不足","pdfpage":70},"举一反三":{"meaning":"反：类推，推论。指举出一件事，就可以触类旁通，类推出许多同类事物来。（侧重于具象的事物层面。）（侧重类推）","level":"已考","group":"第12组","category":"印象和效果","pdfpage":78},"囫囵吞枣":{"meaning":"囫囵：整个的。把枣子整个吞下。比喻笼统地接受，不加分析、甄别，不求甚解","level":"已考","group":"第12组","category":"印象和效果","pdfpage":77},"浅尝辄止":{"meaning":"辄：立即，就。只略微尝试一下就停止。比喻做事不求深入。（侧重停止）","level":"已考","group":"第12组","category":"印象和效果","pdfpage":77},"浮光掠影":{"meaning":"浮光：水面上的反光。掠影：一闪而过的影子。比喻因事物很快消逝而使人对它的印象不深。（侧重抽象语境）","level":"已考","group":"第12组","category":"印象和效果","pdfpage":76},"互为表里":{"meaning":"甲为乙的外表，乙为甲的内里；比喻互相依存，互相接受","level":"已考","group":"第13组","category":"搭档配合","pdfpage":81},"并行不悖":{"meaning":"悖：违反，违背。指同时进行而互相不违背","level":"已考","group":"第14组","category":"工作开展顺序","pdfpage":84},"因噎废食":{"meaning":"废：停止。比喻因为碰到挫折，连该做的事情也不做了","level":"已考","group":"第15组","category":"错误抉择和方向","pdfpage":87},"本末倒置":{"meaning":"本：树根。末：树梢。比喻把事情的轻重主次颠倒了过来","level":"已考","group":"第15组","category":"错误抉择和方向","pdfpage":86},"背道而驰":{"meaning":"背：逆着。道：道路。向着相反的道路奔驰。比喻彼此方向目标完全相反。也比喻背离正确的目标，朝相反的方向走","level":"已考","group":"第15组","category":"错误抉择和方向","pdfpage":88},"刻舟求剑":{"meaning":"求：寻找。比喻拘泥、不变通，不懂得根据实际情况处理问题。也比喻徒劳无功，达不到目的","level":"已考","group":"第16组","category":"错误做法（寓言故事）","pdfpage":91},"守株待兔":{"meaning":"株：树桩子。比喻心存侥幸，不劳而获。也比喻死守狭隘经验，不知变通","level":"已考","group":"第16组","category":"错误做法（寓言故事）","pdfpage":91},"掩耳盗铃":{"meaning":"掩：掩盖，遮盖。比喻自欺欺人。同“掩耳偷铃”","level":"已考","group":"第16组","category":"错误做法（寓言故事）","pdfpage":92},"振聋发聩":{"meaning":"比喻唤醒糊涂麻木之人","level":"已考","group":"第17组","category":"教育影响批评","pdfpage":98},"兢兢业业":{"meaning":"原形容畏惧的样子。后多用来形容小心谨慎、不敢懈怠的样子","level":"已考","group":"第18组","category":"工作学习状态","pdfpage":101},"如履薄冰":{"meaning":"履：踩，走过。形容战战兢兢、小心谨慎的样子","level":"已考","group":"第18组","category":"工作学习状态","pdfpage":100},"厚积薄发":{"meaning":"厚积：充分积累。薄发：少量地慢慢地释放。形容积累丰富的学问而不轻易表现出来","level":"已考","group":"第19组","category":"正确做法","pdfpage":114},"深入浅出":{"meaning":"指讲话或文章的内容深刻，语言文字却浅显易懂","level":"已考","group":"第19组","category":"正确做法","pdfpage":112},"责无旁贷":{"meaning":"责：责任。贷：推卸。指自己应尽的责任，不能推给别人。（侧重责任、职责上）","level":"已考","group":"第19组","category":"正确做法","pdfpage":116},"作茧自缚":{"meaning":"蚕吐丝作茧，把自己包在里面。比喻自己束缚了自己或使自己陷入困境","level":"已考","group":"第20组","category":"错误做法","pdfpage":119},"扬汤止沸":{"meaning":"把开水从锅中舀出来，再倒回去，以阻止锅中的水沸腾。比喻不能解决根本问题的做法","level":"已考","group":"第20组","category":"错误做法","pdfpage":119},"矫枉过正":{"meaning":"矫枉：矫正弯曲。指纠正偏失错误，超过了应有的限度","level":"已考","group":"第20组","category":"错误做法","pdfpage":118},"隔靴搔痒":{"meaning":"比喻说话、做事、写文章不中肯，没有抓住关键","level":"已考","group":"第20组","category":"错误做法","pdfpage":120},"寅吃卯粮":{"meaning":"寅、卯：古代用于纪年等的十二地支中的两个，寅在卯之前。寅年吃了卯年的粮食。比喻经济困难，入不敷出。同“寅支卯粮”。（侧重由于有困难而提前预支）","level":"已考","group":"第21组","category":"某些国家的错误做法","pdfpage":129},"杀鸡取卵":{"meaning":"卵：蛋。为了要得到蛋，不惜把鸡杀了。比喻贪图眼前微小的好处而损害长远的利益","level":"已考","group":"第21组","category":"某些国家的错误做法","pdfpage":129},"竭泽而渔":{"meaning":"排尽湖中或池中的水捕鱼。比喻取利只顾眼前，不作长远打算","level":"已考","group":"第21组","category":"某些国家的错误做法","pdfpage":129},"饮鸩止渴":{"meaning":"鸩：毒酒。比喻用有害的方法解决面临的困难，而不顾后果","level":"已考","group":"第21组","category":"某些国家的错误做法","pdfpage":130},"波诡云谲":{"meaning":"好像云彩和水波那样，形态不可捉摸","level":"已考","group":"第23组","category":"国际国内关系","pdfpage":140},"广开言路":{"meaning":"广：扩大；言路：进言的道路。指尽量给下面创造发表意见的条件","level":"已考","group":"第24组","category":"政府优秀做法","pdfpage":146},"有的放矢":{"meaning":"的：箭靶。矢：箭。对着靶子射箭。比喻目的性强，有针对性","level":"已考","group":"第24组","category":"政府优秀做法","pdfpage":144},"开源节流":{"meaning":"开发财源，节省支出，以储蓄财力","level":"已考","group":"第25组","category":"合理规划","pdfpage":150},"精打细算":{"meaning":"意思是精密地计划，详细地计算。指在使用人力、物力时计算得很精细","level":"已考","group":"第25组","category":"合理规划","pdfpage":150},"量入为出":{"meaning":"入：收入。根据收入的情况来安排支出","level":"已考","group":"第25组","category":"合理规划","pdfpage":151},"一劳永逸":{"meaning":"逸：安逸。指辛苦一次把事情办好，以后就不用费力了","level":"已考","group":"第26组","category":"政策措施的评价","pdfpage":153},"事半功倍":{"meaning":"事：所要做的事情，指措施。功：功效。形容费力小，收效大","level":"已考","group":"第26组","category":"政策措施的评价","pdfpage":155},"立竿见影":{"meaning":"在阳光下竖起竹竿，立刻就能看到它的影子。比喻效果显著迅速","level":"已考","group":"第26组","category":"政策措施的评价","pdfpage":153},"行之有效":{"meaning":"之：代词，它，指办法、措施等；效：成效，效果。实行起来有成效。指某种方法或措施已经实行过，证明很有效用","level":"已考","group":"第26组","category":"政策措施的评价","pdfpage":154},"釜底抽薪":{"meaning":"釜：锅。薪：柴。从锅底下抽出柴火。比喻从根本上解决问题","level":"已考","group":"第26组","category":"政策措施的评价","pdfpage":155},"信手拈来":{"meaning":"信手：随手；拈：用两三个手指头捏东西。随手拿来，多指写文章时能自由纯熟地选用词语或应用典故、素材，用不着怎么思考。（多用于引用资料、数据、典故等）（也可形容做事不费力）","level":"已考","group":"第27组","category":"成功与失败","pdfpage":158},"束手无策":{"meaning":"策：办法。手被捆住，无法应对。形容遇到问题没有解决的办法","level":"已考","group":"第27组","category":"成功与失败","pdfpage":160},"游刃有余":{"meaning":"比喻工作熟练，实际经验很丰富，解决困难问题毫不费事。［近］应付自如","level":"已考","group":"第27组","category":"成功与失败","pdfpage":158},"审时度势":{"meaning":"审：详查，观察。时：当前情况。度：估计。势：发展趋势。观察时机，估计发展趋势。用来指对形势有洞察力。也作“审时定势”“审几度势”","level":"已考","group":"第28组","category":"领导力","pdfpage":164},"矢志不渝":{"meaning":"矢志不渝（矢：誓；渝：改变）指立下志愿，绝不改变","level":"已考","group":"第28组","category":"领导力","pdf function allQuestions(){const m=new Map(Q.concat(R).map(q=>[q.word,q]));return V.map(v=>m.get(v.word)).filter(Boolean)}
function quizOne(encoded){const w=getWord(encoded);const q=Q.concat(R).find(x=>x.word===w);if(!q)return;quiz={list:[q],index:0,selected:null,answered:[],mode:'单词检测'};view='quiz';render();window.scrollTo(0,0)}

function startQuiz(forceWrong=false){let pool=Q.concat(R).filter(q=>quizLevel==='ALL'||q.level===quizLevel);if(forceWrong||quizMode==='wrong'){pool=Q.concat(R).filter(q=>(state.wrong[q.word]?.count||0)>0&&(quizLevel==='ALL'||q.level===quizLevel));}else if(quizMode==='studied'){pool=pool.filter(q=>state.learned[q.word]!==undefined)}
 if(!pool.length){alert('当前条件还没有可练习的题，请先背几个词或完成一次答题。');return}
 pool=[...pool];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let selected=quizCount==='all'?pool:pool.slice(0,quizCount);quiz={list:selected,index:0,selected:null,answered:[],mode:forceWrong||quizMode==='wrong'?'错题重练':quizMode==='studied'?'已学词检测':'自由刷题'};render()}
function answerQuiz(i){if(!quiz||quiz.selected!==null)return;const q=quiz.list[quiz.index];quiz.selected=i;const ok=i===q.answer;let a=state.attempts[q.word]||{right:0,wrong:0};if(ok)a.right++;else a.wrong++;state.attempts[q.word]=a;if(!ok){let b=state.wrong[q.word]||{count:0};b.count++;b.last=q.id;state.wrong[q.word]=b;}const day=todaykey();let d=state.today[day]||{right:0,total:0};d.total++;if(ok)d.right++;state.today[day]=d;quiz.answered.push({word:q.word,ok,chosen:i,id:q.id});save();render();}

if(quiz.index>=quiz.list.length){const total=quiz.answered.length,right=quiz.answered.filter(a=>a.ok).length;let wrong=quiz.answered.filter(x=>!x.ok);return header('本次练习完成','知识不是只靠记住，而是在相似语境中辨别准确用法。')+`<div class="quiz-area"><div class="panel center" style="padding:40px 24px"><div class="eyebrow">RESULT</div><div class="resultsbig">${Math.round(right/total*100)}%</div><h2>答对 ${right}/${total} 题</h2><p class="muted">${quiz.mode} · ${wrong.length}道需巩固</p><div class="flash-actions"><button class="btn primary" onclick="startQuiz()">再练一组</button><button class="btn outline" onclick="go('wrong')">查看错题本</button><button class="btn outline" onclick="go('feed')">继续背词</button></div></div>${wrong.length?`<div class="section-title"><h2>本次错词</h2></div><div class="panel">${wrong.map(a=>`<span class="tag alt" style="margin:5px;cursor:pointer;padding:7px 11px" onclick="showDetail('${safeWord(a.word)}')">${esc(a.word)}</span>`).join('')}</div>`:''}</div>`}

function explainHtml(q,ok){const original=WORD[q.word],d=DEFS[q.word],rec=original?.contrasts?.find(c=>q.options.includes(c.other));return `<div class="explain ${ok?'':'wrong'}"><h3 style="color:${ok?'var(--green)':'var(--red)'}">${ok?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${'ABCD'[q.answer]}：${esc(q.word)}</h3><p><b>题眼：</b>${esc(q.clue)}。</p><p><b>教材释义：</b>${esc(d?.meaning||'见本书分类表')}。</p><p><b>使用提醒：</b>${esc(original?.usage||'先判断词语所强调的对象、语义方向和上下文搭配。')}</p>${rec?`<p><b>高频辨析：</b>${esc(rec.note)}</p>`:''}<div style="font-weight:800;font-size:13px;margin:15px 0 7px">四个选项逐项分析</div>${q.options.map((w,i)=>{const z=DEFS[w];return `<div class="option-reason"><b>${'ABCD'[i]} · ${esc(w)}</b> ${i===q.answer?'<span class="tag">最佳匹配</span>':'<span class="tag gray">干扰项</span>'}<br><span>${esc(z?.meaning||'见相关教材释义')}</span><div style="color:#71858d;font-size:12px;margin-top:4px">${i===q.answer?'本题明确指向“'+esc(q.clue)+'”，与这一成语的关键含义一致。':esc(q.optionReasons?.[w]||('题干核心提示是“'+q.clue+'”，应选择更贴切的“'+q.word+'”。'))}</div></div>`}).join('')}<div class="rowbetween" style="margin-top:15px"><span class="tiny">释义参考教材 PDF 第 ${d?.pdfpage||'—'} 页</span><button class="btn soft" onclick="showDetail('${safeWord(q.word)}')">查看完整词卡</button></div></div>`}

function starWord(encoded){const w=getWord(encoded);if(state.stars[w])delete state.stars[w];else state.stars[w]=1;save();closeDetail();render()}
function forgetWrong(encoded){const w=getWord(encoded);delete state.wrong[w];save();render()}
function wrongHtml(){const items=V.filter(v=>state.wrong[v.word]?.count>0).sort((a,b)=>(state.wrong[b.word]?.count||0)-(state.wrong[a.word]?.count||0));return header('错题回炉','选错就自动记录，重新练习后可手动移出错题本。')+`<div class="rowbetween" style="margin:0 0 18px"><span class="muted small">当前 ${items.length} 个需要巩固的词</span>${items.length?`<button class="btn primary" onclick="reviewWrong()">重练这 ${items.length} 个词</button>`:''}</div>${items.length?`<div class="panel">${items.map(e=>`<div class="wrong-item"><div><b style="font-size:18px">${esc(e.word)}</b> <span class="tag">${e.level}</span> <span class="tag alt">错 ${state.wrong[e.word].count} 次</span><div class="small muted" style="max-width:600px">${esc(e.meaning.slice(0,110))}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn soft" onclick="showDetail('${safeWord(e.word)}')">释义</button><button class="btn outline" onclick="forgetWrong('${safeWord(e.word)}')">移出</button></div></div>`).join('')}</div>`:`<div class="empty"><div style="font-size:36px">◎</div>还没有错题。先做一组逻辑填空，答错的词会自动出现在这里。<div style="margin-top:15px"><button class="btn primary" onclick="go('quiz')">开始刷题</button></div></div>`}`}
function reviewWrong(){let w=new Set(V.filter(v=>state.wrong[v.word]?.count>0).map(v=>v.word));let qs=Q.concat(R).filter(q=>w.has(q.word));quiz={list:qs,index:0,selected:null,answered:[],mode:'错题回炉'};view='quiz';render()}
function progressHtml(){const total=V.length,done=V.filter(v=>state.learned[v.word]===1).length;const qs=Object.values(state.attempts),right=qs.reduce((s,x)=>s+(x.right||0),0),miss=qs.reduce((s,x)=>s+(x.wrong||0),0),dates=Object.entries(state.today).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);return header('学习数据','所有学习记录保存在当前浏览器的本地存储，不会上传到服务器。')+`<div class="cards"><div class="panel"><div class="metric-number">${done}/${total}</div><div class="metric-label">已掌握词语</div></div><div class="panel"><div class="metric-number">${right+miss}</div><div class="metric-label">累计作答次数</div></div><div class="panel"><div class="metric-number">${right+miss?Math.round(right/(right+miss)*100)+'%':'—'}</div><div class="metric-label">答题正确率</div></div></div><div class="twocol"><div class="panel"><h3 style="margin-top:0">分级词汇掌握进度</h3>${['S','A','B'].map(l=>{const n=V.filter(x=>x.level===l).length,k=known(l);return `<div style="margin:18px 0"><div class="rowbetween"><b>${dlabel(l)}</b><span class="tiny">${k}/${n} · ${Math.round(k/n*100)}%</span></div><div class="statbar" style="margin-top:8px"><div style="width:${k/n*100}%"></div></div></div>`}).join('')}</div><div class="panel"><h3 style="margin-top:0">最近7个练习记录日</h3>${dates.length?dates.map(([day,x])=>`<div class="rowbetween" style="margin:16px 0"><span class="small">${day}</span><span class="small">${x.right}/${x.total}题正确</span></div>`).join(''):`<p class="muted small">暂无答题记录</p>`}<div class="divider"></div><p class="small muted">收藏词语：${Object.keys(state.stars).length} 个<br>曾做过的词：${qs.length} 个<br>错题本：${Object.values(state.wrong).filter(x=>x?.count>0).length} 个</p></div></div><div class="panel" style="margin-top:15px"><h3 style="margin-top:0">数据管理</h3><p class="small muted">清除当前浏览器中的所有学习进度、收藏和错题（不会影响 HTML 文件本身）。</p><button class="btn warn" onclick="resetProgress()">清空本地学习记录</button></div>`}
function resetProgress(){if(confirm('确定清空所有已记住、错题和答题记录吗？此操作无法撤销。')){state={learned:{},stars:{},wrong:{},attempts:{},today:{},cursor:0};save();render();}}
let touchX=null,touchY=null;document.addEventListener('touchstart',e=>{if(view!=='quiz'||!quiz||quiz.selected===null)return;touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});document.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;touchX=null;if(dx < -100 && Math.abs(dy)<65 && view==='quiz' && quiz?.selected!==null)nextQuestion()},{passive:true});
navRender();render();
</script></body></html>
